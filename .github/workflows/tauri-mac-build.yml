name: tauri-mac-build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag/branch/commit)'
        required: false
        default: 'hotfix-001-path-fixes'
  push:
    tags:
      - 'release-*'
      - 'hotfix-*'

permissions:
  contents: read

jobs:
  build-mac-intel:
    name: Build Tauri DMG (x86_64-apple-darwin)
    # macos-13 = Intel runner. macos-14 is Apple Silicon — wrong arch for the
    # target MacBook Air 2020 (Intel Core i3).
    runs-on: macos-13
    timeout-minutes: 180

    env:
      TARGET: x86_64-apple-darwin
      PYTHON_VERSION: '3.12'
      RUST_BACKTRACE: '1'
      # Embedded Groq keys for the offline demo build. Per user-authorised
      # demo only; rotate before any external deployment.
      GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
      GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
      GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}

    steps:
      - name: Setup Git LFS
        run: git lfs install

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          lfs: true

      - name: Show host info
        run: |
          uname -a
          sw_vers
          xcodebuild -version || true
          df -h .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python deps for sidecars
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps the 4 sidecars import. Pin major versions
          # for reproducibility; allow patch-level updates.
          pip install \
            'pyinstaller>=6.10,<7' \
            'fastapi>=0.115' \
            'uvicorn>=0.30' \
            'flask>=3.0' \
            'flask-cors>=4.0' \
            'requests>=2.32' \
            'python-dotenv>=1.0' \
            'pydantic>=2.7' \
            'httpx>=0.27' \
            'groq>=0.11' \
            'chromadb>=0.5' \
            'sentence-transformers>=3.0' \
            'transformers>=4.40' \
            'huggingface_hub>=0.24' \
            'safetensors>=0.4' \
            'tokenizers>=0.19' \
            'torch>=2.2'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri_bundle/enerlytik-app/src-tauri/target
          key: cargo-${{ runner.os }}-${{ env.TARGET }}-${{ hashFiles('tauri_bundle/enerlytik-app/src-tauri/Cargo.lock', 'tauri_bundle/enerlytik-app/src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.TARGET }}-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Stage bundled resources
        run: |
          cd tauri_bundle/enerlytik-app
          python prepare_resources.py
          ls -la src-tauri/resources

      - name: Build sidecar — db_api
        run: |
          python -m PyInstaller --noconfirm --clean db_api-x86_64-apple-darwin.spec
          ls -la dist

      - name: Build sidecar — passport
        run: |
          python -m PyInstaller --noconfirm --clean passport-x86_64-apple-darwin.spec
          ls -la dist

      - name: Build sidecar — enerlyst
        run: |
          python -m PyInstaller --noconfirm --clean enerlyst-x86_64-apple-darwin.spec
          ls -la dist

      - name: Build sidecar — rag_api (slow, ~25-45 min)
        run: |
          python -m PyInstaller --noconfirm --clean rag_api-x86_64-apple-darwin.spec
          ls -la dist

      - name: Stage sidecars + grant exec bit
        run: |
          mkdir -p tauri_bundle/enerlytik-app/src-tauri/sidecars
          cp dist/db_api-x86_64-apple-darwin     tauri_bundle/enerlytik-app/src-tauri/sidecars/
          cp dist/passport-x86_64-apple-darwin   tauri_bundle/enerlytik-app/src-tauri/sidecars/
          cp dist/rag_api-x86_64-apple-darwin    tauri_bundle/enerlytik-app/src-tauri/sidecars/
          cp dist/enerlyst-x86_64-apple-darwin   tauri_bundle/enerlytik-app/src-tauri/sidecars/
          chmod +x tauri_bundle/enerlytik-app/src-tauri/sidecars/*
          ls -la tauri_bundle/enerlytik-app/src-tauri/sidecars

      - name: Build Tauri DMG
        run: |
          cd tauri_bundle/enerlytik-app
          cargo tauri build --target ${{ env.TARGET }} --bundles dmg

      - name: Locate DMG + .app
        id: locate
        run: |
          DMG=$(find tauri_bundle/enerlytik-app/src-tauri/target/${{ env.TARGET }}/release/bundle/dmg -name '*.dmg' | head -1)
          APP=$(find tauri_bundle/enerlytik-app/src-tauri/target/${{ env.TARGET }}/release/bundle/macos -name '*.app' -maxdepth 2 | head -1)
          echo "dmg_path=$DMG" >> $GITHUB_OUTPUT
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          ls -lh "$DMG" "$APP" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: enerlytik-mac-intel-dmg
          path: ${{ steps.locate.outputs.dmg_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload .app (zipped)
        run: |
          cd "$(dirname '${{ steps.locate.outputs.app_path }}')"
          zip -ry enerlytik-mac.app.zip "$(basename '${{ steps.locate.outputs.app_path }}')"
        shell: bash

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: enerlytik-mac-intel-app
          path: tauri_bundle/enerlytik-app/src-tauri/target/${{ env.TARGET }}/release/bundle/macos/enerlytik-mac.app.zip
          retention-days: 14
          if-no-files-found: warn
