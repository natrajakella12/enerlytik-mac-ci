// SUMMARY TAB — renderSummary (Sprint UI-P1)
// ════════════════════════════════════════════════════════════════
async function renderSummary() {
  const el = document.getElementById('tab-content');
  const [bat, alertData, fs, sbd, cc, l7, dss, attr] = await Promise.all([
    get(`/api/battery/${S.bat}`),
    get(`/api/battery/${S.bat}/alerts`).catch(()=>null),
    get('/api/fleet/alerts/summary').catch(()=>null),
    get(`/api/battery/${S.bat}/score-breakdown`).catch(()=>null),
    get(`/api/battery/${S.bat}/consequence-chain`).catch(()=>null),
    get(`/api/battery/${S.bat}/contextual-scores`).catch(()=>null),
    get(`/api/battery/${S.bat}/dss?audience=oem`).catch(()=>null),
    get(`/api/battery/${S.bat}/attribution?audience=oem`).catch(()=>null),
  ]);
  if (!bat) {
    let fleetH = await renderFleetIntelligence();
    el.innerHTML = fleetH || emptyState('Select a battery','Choose from dropdown above.');
    return;
  }

  const tier = normalizeTier(bat.tier_label_v2 || bat.tier_v2 || 'UNSCORED');
  const score = Math.round(bat.operational_score || bat.adjusted_composite || 0);
  const ss = (alertData && alertData.score_status) || {};
  const mode = ss.scoring_mode || bat.scoring_mode || 'FULL';
  const conf = ss.confidence_score || (mode === 'FULL' ? 100 : 75);
  const alerts = (alertData && alertData.alerts) || [];
  const wks = bat.weekly_trend || [];
  const latest = wks.length ? wks[wks.length-1] : {};
  const spread = Math.round(latest.cell_spread_max || 0);
  const kps = latest.km_per_soc_pct;
  const wk = latest.week_number || bat.week_number || '\u2014';
  const isSuspended = mode.includes('SUSPENDED') || tier === 'INSUFFICIENT_DATA';
  const rangeKm = kps ? Math.round(kps * 80) : null;

  // Sprint 2D: Pack3401 exception — suppress stored attribution sentences, use pack narrative
  const isPack3401 = (bat.battery_model || '').includes('3401');
  const isPackGapException = isPack3401 || (attr && attr.attribution_mode === 'PACK_GAP_EXCEPTION');

  // Consequence chain data — Pack3401 takes pack narrative; others use chain → attr-synthesised fallback
  const chainSentence = isPackGapException
    ? PACK3401_NARRATIVE
    : ((cc && cc.integrated_chain_sentence)
        || (cc && cc.asset_impact_sentence)
        || synthesiseChainSentence(bat, attr));
  const ccCat = (cc && cc.battery_category) || bat.battery_category || null;
  const ccGolden = (cc && cc.golden_rule_pass) || bat.golden_rule_pass || 0;
  const ccConflict = cc && cc.scoring_conflict_note;
  const ccSpreadDelta = cc && cc.spread_delta_mv;
  const ccCapState = cc && cc.capacity_state;
  const ccPrimaryDriver = cc && cc.primary_driver;
  const ccAssetImpact = cc && cc.asset_impact_sentence;
  const ccCorrVerdict = cc && cc.corroboration_verdict;
  const ccCorrScore = cc && cc.corroboration_score;
  const ccIntWindow = cc && cc.intervention_window;
  const ccValVel = cc && cc.value_velocity;

  // Tier colour
  const tc = tier==='CRITICAL'?'#dc2626':tier==='STRESSED'?'#f59e0b':tier==='WATCH'?'#d97706':tier==='STABLE'?'#22c55e':tier==='PRIME'?'#1A7A4A':'#888';

  // Efficiency delta
  let effDelta = null;
  if (wks.length >= 2) {
    const first = wks[0], last = wks[wks.length-1];
    if (first.km_per_soc_pct && last.km_per_soc_pct && first.km_per_soc_pct > 0)
      effDelta = ((last.km_per_soc_pct - first.km_per_soc_pct)/first.km_per_soc_pct*100);
  }
  const effBar = effDelta != null ? Math.max(0, Math.min(1, (100+effDelta)/100)) : 0;
  const spreadBar = Math.max(0, Math.min(1, 1 - spread/300));

  // Slope + monthly change
  const slope4wk = bat.kps_slope_4wk || bat.km_per_soc_slope || 0;
  const slopeArrow = slope4wk > 0.05 ? '\u25B2' : slope4wk < -0.05 ? '\u25BC' : '\u2192';
  const slopeCol = slope4wk > 0.05 ? 'var(--tier-stable)' : slope4wk < -0.05 ? 'var(--tier-critical)' : 'var(--text-faint)';
  const monthlyKm = Math.abs(slope4wk * 80 * 4).toFixed(1);
  const monthlySign = slope4wk >= 0 ? '+' : '-';
  // Baseline %
  const blRange = bat.baseline_range_km || (wks.length > 0 ? wks[0].km_per_soc_pct * 80 : null);
  const pctVsBl = (rangeKm && blRange && blRange > 0) ? Math.round((rangeKm / blRange) * 100) : null;

  // CATEGORY_MAP
  const catBadgeMap = {RR_CANDIDATE:['var(--cat-rr)','\u2605 Fleet Benchmark'],PRIME:['var(--cat-prime)','Performing Well'],OPERATIONAL:['var(--cat-operational)','Operational'],INTERVENTION:['var(--cat-intervention)','Needs Attention'],CRITICAL_WATCH:['var(--cat-watch)','Declining'],END_OF_LIFE:['var(--cat-eol)','Near Limit']};

  let h = '';

  // ══ SECTION 1 — DARK HERO CARD (redesigned) ══
  h += `<div style="background:var(--nav);color:#fff;border-radius:var(--radius-lg);padding:24px 28px;margin-bottom:16px">`;
  // Identity line
  const scoringDate = bat.scored_at || bat.scoring_date || '';
  const scoringDateFmt = scoringDate ? new Date(scoringDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
  // Sprint 2D Fix 9: week staleness indicator
  const _fleetWk = S.fleetCurrentWeek || null;
  const _dataWk = typeof wk === 'number' ? wk : parseInt(wk, 10);
  const _isStale = _fleetWk && !isNaN(_dataWk) && (_fleetWk - _dataWk) > 4;
  const _wkDisplay = _isStale
    ? `Week ${_dataWk} <span style="color:#f59e0b;font-size:10px">(${_fleetWk - _dataWk} weeks behind)</span>`
    : `Week ${wk}`;
  h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-size:13px;font-family:var(--font-mono);color:rgba(255,255,255,0.5)">${S.bat} \xB7 ${_wkDisplay}${scoringDateFmt ? ' \xB7 Scored '+scoringDateFmt : ''}</div><a href="/enerlyst-next?battery=${S.bat}" target="_blank" style="font-size:12px;color:#f97316;text-decoration:none;font-weight:500">Ask enerlyst \u2192</a></div>`;

  if (isSuspended) {
    h += `<div style="display:flex;gap:32px;align-items:center;margin-bottom:12px"><div><div style="font-family:var(--font-display);font-size:42px;font-weight:800;color:#666">\u2014</div><div style="font-size:11px;color:rgba(255,255,255,0.4)">Score paused</div></div></div>`;
  } else {
    h += `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">`;
    // Left: score + tier + trajectory
    h += `<div style="display:flex;align-items:flex-end;gap:16px">`;
    h += `<div style="font-family:var(--font-display);font-size:56px;font-weight:700;color:#fff;line-height:1">${score}</div>`;
    h += `<div style="margin-bottom:6px"><span style="display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600;background:${tc}33;color:${tc};margin-bottom:4px">${tier}</span>`;
    h += `<div style="font-size:12px;color:rgba(255,255,255,0.6)"><span style="color:${slopeCol}">${slopeArrow}</span> ${monthlySign}${monthlyKm}km/mo</div>`;
    h += `</div></div>`;
    // Right: category badge
    if (ccCat) {
      const cb = ccGolden ? ['var(--cat-rr)','\u2605 R&R Candidate'] : (catBadgeMap[ccCat] || ['#94a3b8', ccCat]);
      h += `<div><span style="display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;background:${cb[0]};color:#fff">${cb[1]}</span></div>`;
    }
    h += `</div>`;
    // Range anchor
    h += `<div style="font-size:14px;color:rgba(255,255,255,0.7)">Delivering <strong style="color:#fff">${rangeKm||'\u2014'}km</strong>`;
    if (pctVsBl != null) h += ` \xB7 ${pctVsBl}% vs own baseline`;
    h += `</div>`;
  }
  h += `<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08)"><a href="/oem-v3?pack=${encodeURIComponent(bat.battery_model||'')}&context=oem" id="fleet-view-link" style="font-size:11px;color:#f97316;font-family:var(--font-mono);text-decoration:none">Fleet view \u2192</a></div>`;
  h += `</div>`;

  // ══ SCORING CONFLICT BANNER ══ (Sprint 2D: plain English)
  const ccConflictPlain = translateConflictNote(ccConflict);
  if (ccConflictPlain) {
    h += `<div class="conflict-banner">\u26A0 ${ccConflictPlain}</div>`;
  }

  // ══ SECTION 2 — INTELLIGENCE CHAIN ══
  if (chainSentence && !isSuspended) {
    // Section label
    h += `<div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280;margin:16px 0 8px 0">INTELLIGENCE CHAIN</div>`;

    // Lead sentence — Outfit, 17px, border-left accent
    h += `<div style="background:#fff;border-left:4px solid #f97316;padding:20px 24px;border-radius:0 10px 10px 0;margin-bottom:14px">`;
    h += `<div style="font-family:var(--font-display);font-size:17px;font-weight:500;line-height:1.5;color:#0d0d0b">${chainSentence}</div>`;
    h += `</div>`;

    // Audience pills in 2x2 grid — only non-null
    const audiencePills = [
      ['OPERATOR', cc && (cc.asset_recovery_note || cc.operator_attribution_sentence || cc.asset_impact_sentence)],
      ['FINANCE', cc && cc.nbfc_sentence],
      ['OEM', cc && cc.battery_oem_sentence],
      ['SERVICE', cc && cc.action_remark],
    ].filter(([_, text]) => text);

    if (audiencePills.length > 0) {
      const cols = audiencePills.length >= 3 ? 2 : audiencePills.length;
      h += `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:10px;margin-bottom:14px">`;
      audiencePills.forEach(([label, text]) => {
        h += `<div style="background:#f4f3f0;border-radius:10px;padding:16px">`;
        h += `<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;margin-bottom:6px">${label}</div>`;
        h += `<div style="font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.5">${text}</div>`;
        h += `</div>`;
      });
      h += `</div>`;
    }
  } else if (!isSuspended) {
    // Fallback
    h += `<div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280;margin:16px 0 8px 0">INTELLIGENCE CHAIN</div>`;
    h += `<div style="background:#fff;border-left:4px solid #d1d5db;padding:20px 24px;border-radius:0 10px 10px 0;margin-bottom:14px">`;
    h += `<div style="font-family:var(--font-display);font-size:17px;font-weight:500;line-height:1.5;color:#9ca3af">Intelligence analysis pending for this battery.</div>`;
    h += `</div>`;
  }

  // ══ ATTRIBUTION-IMPACT MATRIX (the moat slide) ══
  if (!isSuspended) {
    h += `<div style="margin:18px 0 8px 0"><div style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text)">Why this battery \u2014 and who needs to act</div>`;
    h += `<div style="font-size:11px;color:#9ca3af;margin-bottom:12px">Same data. Three stakeholders. Three decisions.</div></div>`;
    h += `<div id="attribution-matrix" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">`;
    h += `<div style="flex:1;min-width:200px;font-size:11px;color:#9ca3af;text-align:center;padding:20px">Loading stakeholder views...</div>`;
    h += `</div>`;
    // Async load all 3 stakeholder cards
    Promise.all([
      get(`/api/battery/${S.bat}`).catch(()=>({})),
      get(`/api/battery/${S.bat}/nbfc`).catch(()=>({})),
      get(`/api/battery/${S.bat}/oem`).catch(()=>({})),
    ]).then(([batD, nbfcD, oemD]) => {
      const mx = document.getElementById('attribution-matrix');
      if (!mx) return;
      const _rangeKm = Math.round((batD.range_corrected_km || batD.range_est_km || 0));
      const _slope = batD.kps_slope_4wk || 0;
      const _slopeKm = Math.abs(_slope * 80).toFixed(1);
      const _slopeSign = _slope >= 0 ? '+' : '\u2212';
      const _slopeCol = _slope > 0 ? '#22c55e' : _slope < -0.003 ? '#ef4444' : '#9ca3af';
      // Sprint 2D: Pack3401 overrides the stored operator sentence.
      const _isPack3401_card = (batD.battery_model || '').includes('3401');
      const _opSent = _isPack3401_card
        ? PACK3401_NARRATIVE
        : (batD.operator_cause_sentence || batD.operator_capacity_sentence || '');
      const _resolvedAction = resolveAction(batD);
      const _act = ACTION_PLAIN[_resolvedAction] || _resolvedAction || '';
      const _actCol = _resolvedAction === 'NO_ACTION' ? '#22c55e'
        : ['MONITOR_WEEKLY','MONITOR','CELL_BALANCE','CHARGING_DISCIPLINE'].includes(_resolvedAction) ? '#f59e0b'
        : '#ef4444';
      const _nbfcTier = nbfcD.nbfc_risk_tier || '\u2014';
      const _nbfcCol = {A:'#22c55e',B:'#3b82f6',C:'#f59e0b',D:'#ef4444'}[_nbfcTier] || '#94a3b8';
      const _nbfcSent = nbfcD.nbfc_sentence || '';
      const _rul = batD.rul_weeks_v2;
      const _rulConf = batD.rul_confidence || '';
      const _oemSent = oemD.battery_oem_sentence || oemD.shap_explanation || '';
      const _attrAvail = oemD.attribution_available;
      const _attrSplit = oemD.attribution_split || {};
      const _clusterFlag = oemD.cluster_alert_flag;

      let mh = '';
      // Card 1 — Fleet Operator
      mh += `<div style="flex:1;min-width:200px;border-left:4px solid #f97316;background:#fff;border-radius:0 10px 10px 0;padding:16px">`;
      mh += `<div style="display:inline-block;padding:2px 10px;border-radius:12px;background:#f9731618;color:#f97316;font-size:10px;font-weight:700;margin-bottom:10px">Fleet Operator</div>`;
      mh += `<div style="font-family:var(--font-display);font-size:32px;font-weight:700;color:#0d0d0b">${_rangeKm}km</div>`;
      mh += `<div style="font-size:12px;color:${_slopeCol};margin-bottom:8px">${_slopeSign}${_slopeKm} km/wk</div>`;
      if (_opSent) mh += `<div style="font-size:12px;color:#6b7280;line-height:1.5;margin-bottom:8px">${_opSent.substring(0,120)}</div>`;
      mh += `<div style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:${_actCol}18;color:${_actCol}">${_act}</div>`;
      mh += `</div>`;

      // Card 2 — Finance
      mh += `<div style="flex:1;min-width:200px;border-left:4px solid #3b82f6;background:#fff;border-radius:0 10px 10px 0;padding:16px">`;
      mh += `<div style="display:inline-block;padding:2px 10px;border-radius:12px;background:#3b82f618;color:#3b82f6;font-size:10px;font-weight:700;margin-bottom:10px">Finance</div>`;
      mh += `<div style="font-family:var(--font-display);font-size:56px;font-weight:700;color:${_nbfcCol};line-height:1">${_nbfcTier}</div>`;
      if (_nbfcSent) mh += `<div style="font-size:13px;font-family:'DM Sans',sans-serif;color:#374151;line-height:1.5;margin:8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${_nbfcSent}</div>`;
      if (_rul != null) mh += `<div style="font-size:11px;color:#6b7280${_rulConf.includes('UNCALIB')?';font-style:italic':''}">Est. ${Math.round(_rul)} weeks remaining</div>`;
      mh += `</div>`;

      // Card 3 — Manufacturer (Sprint 5 Route 8: click navigates to OEM)
      mh += `<div style="flex:1;min-width:200px;border-left:4px solid #7c3aed;background:#fff;border-radius:0 10px 10px 0;padding:16px;cursor:pointer" title="Open fleet view for this battery" onclick="window.location.href='/oem-v3?battery='+encodeURIComponent('${S.bat}')+'&context=oem'">`;
      mh += `<div style="display:inline-block;padding:2px 10px;border-radius:12px;background:#7c3aed18;color:#7c3aed;font-size:10px;font-weight:700;margin-bottom:10px">Manufacturer</div>`;
      if (_clusterFlag) mh += `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;margin-left:6px">Pack Alert</span>`;
      if (_attrAvail) {
        const _bars = [['Charging',_attrSplit.charging||0,'#3b82f6'],['Design',_attrSplit.battery_design||0,'#f97316'],['Wear',_attrSplit.maintenance||0,'#22c55e']];
        _bars.forEach(([l,p,c]) => {
          mh += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="width:50px;font-size:11px;color:#6b7280">${l}</span><div style="flex:1;height:4px;background:#f3f4f6;border-radius:2px"><div style="width:${Math.min(p,100)}%;height:100%;background:${c};border-radius:2px"></div></div><span style="font-size:10px;font-weight:600;width:30px;text-align:right">${Math.round(p)}%</span></div>`;
        });
      }
      if (_oemSent) mh += `<div style="font-size:13px;font-family:'DM Sans',sans-serif;color:#374151;line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${_oemSent}</div>`;
      mh += `</div>`;

      mx.innerHTML = mh;
    });
    h += `<div style="font-size:11px;font-style:italic;color:#9ca3af;margin-bottom:14px">enerlyst \xB7 Physics-validated battery intelligence \xB7 Directional only \u2014 not for covenant triggers (Rule C09)</div>`;
  }

  // ══ SECTION 3 — ASSET STATUS MICRO-TILES ══
  if (cc && !isSuspended) {
    const iwMap = {OPEN:['#22c55e','Open'],CLOSING:['#f59e0b','Closing'],NARROWING:['#f59e0b','Closing'],CLOSED:['#ef4444','Closed']};
    const vvMap = {STABLE:['#14b8a6','Stable'],ERODING:['#f59e0b','Eroding'],COMPOUNDING:['#ef4444','Compounding loss']};
    const arcMap = {PRIME_CANDIDATE:'Healthy',SECONDARY_MARKET:'Stable \u2014 secondary use viable',INTERVENTION_CANDIDATE:'Recoverable \u2014 act now',URGENT_INTERVENTION:'Urgent',COMPOUNDING_LOSS:'Declining on both axes',END_OF_LIFE:'Near end of life'};
    const iw = iwMap[ccIntWindow] || ['#9ca3af','Stable'];
    const vv = vvMap[ccValVel] || ['#9ca3af','Steady'];
    const arcLabel = safeAssetClass(bat, arcMap[cc.asset_recovery_class] || 'Assessing');

    h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px">`;
    h += `<div style="background:#f4f3f0;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px"><div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280">Intervention window</div><div style="font-size:14px;font-weight:600;color:${iw[0]}">${iw[1]}</div></div>`;
    h += `<div style="background:#f4f3f0;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px"><div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280">Value velocity</div><div style="font-size:14px;font-weight:600;color:${vv[0]}">${vv[1]}</div></div>`;
    h += `<div style="background:#f4f3f0;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px"><div style="font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280">Asset class</div><div style="font-size:14px;font-weight:600">${arcLabel}</div></div>`;
    h += `</div>`;
  }

  // ══ SECTION 4 — OPERATING CONTEXT TILES ══
  if (cc && (cc.latest_behaviour_grade || cc.latest_thermal_grade || cc.latest_route_stress)) {
    const gCol = {A:'#22c55e',B:'#f59e0b',C:'#f97316',D:'#ef4444'};
    const _mtStyle = 'background:#f4f3f0;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px';
    const _lblStyle = 'font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#6b7280';
    h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:10px">`;
    h += `<div style="${_mtStyle}"><div style="${_lblStyle}">Charging</div><div style="font-size:14px;font-weight:600;color:${gCol[cc.latest_behaviour_grade]||'#9ca3af'}">Grade ${cc.latest_behaviour_grade||'--'}</div>`;
    if (cc.latest_behaviour_grade === 'A' && ccPrimaryDriver && ccPrimaryDriver !== 'charging') {
      h += `<div style="font-size:11px;font-style:italic;color:#6b7280">Good discipline \u2014 not the primary cause of decline here</div>`;
    }
    h += `</div>`;
    h += `<div style="${_mtStyle}"><div style="${_lblStyle}">Thermal</div><div style="font-size:14px;font-weight:600">${cc.latest_thermal_grade||'--'}</div></div>`;
    h += `<div style="${_mtStyle}"><div style="${_lblStyle}">Route</div><div style="font-size:14px;font-weight:600">${cc.latest_route_stress||'--'}</div></div>`;
    h += `</div>`;
    if (cc.operating_context_summary) h += `<div style="font-size:13px;color:#6b7280;font-style:italic;margin-bottom:12px;padding:0 4px">${cc.operating_context_summary}</div>`;
  }

  // ── 6 NAVIGATION TILES ──
  const alertCount = alerts.filter(a=>a.priority<=2).length;
  const tiles = [
    {tab:'health',emoji:'⚡',title:'Health Score',q:'How degraded?'},
    {tab:'predictions',emoji:'🔮',title:'Predictions',q:'12-week forecast'},
    {tab:'alerts',emoji:'🔔',title:'Alerts',q:'What needs action?',badge:alertCount},
    {tab:'events',emoji:'📋',title:'Events',q:'What happened?'},
    {tab:'analytics',emoji:'📊',title:'Analytics',q:'Custom signal charts'},
    {tab:'forensic',emoji:'🔬',title:'Data Quality',q:'Signal reliability'},
  ];
  h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">`;
  tiles.forEach(t => {
    h += `<div onclick="showTab('${t.tab}')" style="background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative" onmouseover="this.style.borderColor='var(--accent)';this.style.boxShadow='0 2px 8px rgba(249,115,22,0.15)'" onmouseout="this.style.borderColor='var(--bg3)';this.style.boxShadow='none'">`;
    h += `<div style="font-size:18px;margin-bottom:4px">${t.emoji}</div>`;
    h += `<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px">${t.title}</div>`;
    h += `<div style="font-size:10px;color:var(--text3)">${t.q}</div>`;
    if (t.badge > 0) h += `<span style="position:absolute;top:8px;right:10px;background:#dc2626;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px">${t.badge}</span>`;
    h += `</div>`;
  });
  h += `</div>`;

  // Fleet context bar
  if (fs) {
    const partial = (fs.scored_partial||0) + (fs.scored_estimated||0);
    h += `<div style="font-size:10px;font-family:var(--font-mono);color:var(--text3);padding:6px 12px;background:var(--bg2);border-radius:6px">`;
    h += `<span style="color:var(--grn)">${fs.scored_full||0}</span> fully scored · <span style="color:var(--amb)">${partial}</span> scored with caveats · <span style="color:#888">${fs.suspended||0}</span> paused`;
    if (fs.alerts_p1 > 0) h += ` · <span style="color:#dc2626">${fs.alerts_p1} need urgent attention</span>`;
    h += `</div>`;
  }

  // Score-range divergence strip (links to Score Lab)
  get('/api/fleet/scoring-grid').then(g => {
    if (!g) return;
    const dc = (g.case_a_count||0)+(g.case_b_count||0)+(g.case_c_count||0)+(g.case_d_count||0)+(g.case_f_count||0);
    if (dc > 0) {
      const strip = document.getElementById('divergence-strip');
      if (strip) {
        strip.style.display = 'block';
        strip.innerHTML = `Score–range alignment: <strong>${dc} batteries</strong> flagged for review <span style="float:right;color:var(--accent);cursor:pointer" onclick="showTab('scorelab')">View Score Lab →</span>`;
        strip.style.background = dc > 10 ? '#FCEBEB' : dc > 5 ? '#FAEEDA' : '#f8fafc';
        strip.style.color = dc > 10 ? '#991b1b' : dc > 5 ? '#92400e' : '#374151';
      }
    }
  }).catch(()=>{});
  h += `<div id="divergence-strip" style="display:none;font-size:11px;padding:8px 14px;border-radius:8px;margin-top:8px;cursor:pointer" onclick="showTab('scorelab')"></div>`;

  el.innerHTML = h;
}

// Audience toggle handler
function switchAudience(aud) {
  ['op','nb','oem'].forEach(a => {
    const narr = document.getElementById('aud-narrative-'+a);
    const expl = document.getElementById('se-'+a);
    if (narr) narr.style.display = a===aud ? '' : 'none';
    if (expl) expl.style.display = a===aud ? '' : 'none';
  });
  document.querySelectorAll('.aud-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().startsWith(aud==='op'?'oper':aud==='nb'?'nbfc':'oem')));
}

// ════════════════════════════════════════════════════════════════
// ALERTS TAB — renderAlerts (Sprint vScore)
// ════════════════════════════════════════════════════════════════
const PLAIN_LANG = {
  'SCORE_SUSPENDED':'Score paused','SUPPRESSED_NO_SOH':'Scored on available signals',
  'NO_SOH_HISTORY':'Capacity measurement using efficiency proxy',
  'PARTIAL_CYCLE':'Partial charging cycles — reduced confidence',
  'EFFICIENCY_PROXY':'Efficiency-based health estimate',
  'INSUFFICIENT_DATA':'Not enough data weeks yet','IOT_CRITICAL':'IoT device issue detected',
  'CAN_GPS_DAILY':'Full telemetry','GPS_DAILY_ONLY':'GPS only — no battery telemetry this week',
  'GPS_ONLY':'GPS only — no battery telemetry this week','NONE':'No data this week',
  'PIPELINE_FAILURE':'Technical issue — platform team notified',
  'FULL':'Full signals — standard scoring','PARTIAL_NO_SOH':'Efficiency proxy scoring (confidence 75/100)',
  'PARTIAL_LOW_DATA':'Partial data — directional only','ESTIMATED':'Estimate — limited history',
  'SUSPENDED':'Score paused — data insufficient',
};
function plainLang(code) { return PLAIN_LANG[code] || code || '—'; }

async function renderAlerts() {
  const el = document.getElementById('tab-content');
  const data = await get(`/api/battery/${S.bat}/alerts`);
  if (!data) { el.innerHTML = emptyState('Alerts','Failed to load alerts.'); return; }

  const alerts = data.alerts || [];
  const ss = data.score_status || {};
  const mode = ss.scoring_mode || 'FULL';
  const conf = ss.confidence_score || (mode === 'FULL' ? 100 : 0);
  let h = '';

  // ── Score status badge ──
  const modeCls = mode === 'FULL' ? 'var(--grn)' : mode.includes('PARTIAL') ? 'var(--amb)' : mode.includes('ESTIMATED') ? '#6B21A8' : '#E24B4A';
  h += `<div class="sec-l">◈ Score status</div>`;
  h += `<div style="background:#fff;border:1px solid var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px">`;
  h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">`;
  h += `<span style="padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;font-family:var(--font-mono);background:${modeCls}22;color:${modeCls};border:1px solid ${modeCls}44">${plainLang(mode)}</span>`;
  h += `<span style="font-size:13px;font-weight:600;color:var(--text)">Confidence: ${conf}/100</span>`;
  if (ss.nbfc_suitable) h += `<span style="font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(26,122,74,0.1);color:var(--grn);font-family:var(--font-mono)">NBFC suitable</span>`;
  h += `</div>`;
  // Explanation
  let expl = ss.score_explanation;
  if (expl) { try { const p = JSON.parse(expl); expl = p.text || expl; } catch(e) {} }
  if (expl) h += `<div style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:6px">${expl}</div>`;
  if (ss.remedy_operator && mode !== 'FULL') h += `<div style="font-size:11px;color:var(--amb);margin-bottom:4px">→ ${ss.remedy_operator}</div>`;
  if (ss.nbfc_caveat) h += `<div style="font-size:10px;color:var(--text3);font-style:italic">NBFC note: ${ss.nbfc_caveat}</div>`;
  h += `</div>`;

  // ── Group alerts by priority ──
  const p1 = alerts.filter(a => a.priority === 1);
  const p2 = alerts.filter(a => a.priority === 2);
  const p3 = alerts.filter(a => a.priority === 3);
  const p4 = alerts.filter(a => a.priority === 4);

  function alertCard(a, borderColor, bgColor) {
    return `<div style="background:${bgColor};border-left:4px solid ${borderColor};border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:7px">
      <div style="font-weight:500;font-size:12px;color:var(--text);margin-bottom:3px">${a.title}</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px;line-height:1.5">${a.detail}</div>
      ${a.action_operator ? '<div style="font-size:11px;color:'+borderColor+';margin-bottom:2px">→ '+a.action_operator+'</div>' : ''}
      ${a.recheck_weeks ? '<div style="font-size:10px;font-family:var(--font-mono);color:var(--text3)">Recheck: '+a.recheck_weeks+' weeks</div>' : ''}
    </div>`;
  }

  if (p1.length || p2.length) {
    h += `<div class="sec-l">◈ Requires action</div>`;
    p1.forEach(a => { h += alertCard(a, '#E24B4A', 'rgba(226,75,74,0.05)'); });
    p2.forEach(a => { h += alertCard(a, '#EF9F27', 'rgba(239,159,39,0.05)'); });
  }

  if (p3.length) {
    h += `<details style="margin-bottom:10px"><summary class="sec-l" style="cursor:pointer">◈ Monitoring (${p3.length})</summary>`;
    p3.forEach(a => { h += alertCard(a, '#378ADD', 'rgba(55,138,221,0.04)'); });
    h += `</details>`;
  }

  if (p4.length) {
    h += `<details style="margin-bottom:10px"><summary class="sec-l" style="cursor:pointer">◈ Information (${p4.length})</summary>`;
    p4.forEach(a => { h += alertCard(a, '#999', 'var(--bg2)'); });
    h += `</details>`;
  }

  if (!alerts.length && mode === 'FULL') {
    h += `<div style="background:rgba(34,197,94,0.06);border-left:4px solid var(--grn);border-radius:0 8px 8px 0;padding:14px 16px;margin-top:8px">
      <div style="font-weight:500;font-size:13px;color:var(--grn)">No active alerts. All signals healthy.</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Score based on full telemetry. All thresholds within normal range.</div>
    </div>`;
  } else if (!alerts.length && (mode.includes('SUSPENDED') || mode.includes('SUPPRESSED'))) {
    h += `<div style="background:rgba(226,75,74,0.05);border-left:4px solid #E24B4A;border-radius:0 8px 8px 0;padding:14px 16px;margin-top:8px">
      <div style="font-weight:500;font-size:13px;color:#E24B4A">Score paused — device or data issue</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">This battery cannot be scored reliably. Check the Forensic tab for details on what data is missing and what action to take.</div>
    </div>`;
  } else if (!alerts.length) {
    h += `<div style="font-size:12px;color:var(--text3);padding:10px">No active alerts for this battery.</div>`;
  }

  el.innerHTML = h;
}

// SCORE LAB TAB — renderScoreLab (Sprint UI-B — post-reform)
// ════════════════════════════════════════════════════════════════
async function renderScoreLab() {
  const el = document.getElementById('tab-content');
  const grid = await get('/api/fleet/scoring-grid').catch(()=>null);
  let comp = null;
  if (S.bat) comp = await get(`/api/battery/${S.bat}/score-components`).catch(()=>null);
  if (!grid || grid.error) { el.innerHTML = emptyState('Score Lab unavailable','Fleet scoring grid failed to load. Check API.'); return; }

  let h = '';

  // ── SECTION 0: Fleet summary tiles (3×2) ──
  if (grid) {
    const cd = grid.capacity_state_dist || {};
    const corr = grid.corroboration_dist || {};
    const nb = grid.nbfc_tier_dist || {};
    const dv = grid.divergence || {};
    const actionUrgent = ((grid.rul_action_dist || {}).EOL_IMMINENT || 0) + ((grid.rul_action_dist || {}).REPLACE_URGENT || 0);
    const divTotal = (dv.forward_warning||0)+(dv.floor_stable||0)+(dv.lagging_score||0)+(dv.recovering_penalised||0)+(dv.baseline_suspect||0);

    h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">';
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Total scored</div><div style="font-size:24px;font-weight:500;color:#f97316;font-family:'IBM Plex Mono',monospace">${grid.total_batteries||0}</div><div style="font-size:10px;color:#6b7280">LFP batteries with full scoring</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Action required</div><div style="font-size:24px;font-weight:500;color:${(cd.CRITICAL||0)+(cd.NEAR_FLOOR||0)>0?'#dc2626':'#22c55e'}">${(cd.CRITICAL||0)+(cd.NEAR_FLOOR||0)}</div><div style="font-size:10px;color:#6b7280">CRITICAL + NEAR_FLOOR</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Early warning</div><div style="font-size:24px;font-weight:500;color:#f59e0b">${cd.EARLY_WARNING||0}</div><div style="font-size:10px;color:#6b7280">flagged ${grid.mean_early_warning_weeks||0} wks before impact</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Fleet range median</div><div style="font-size:24px;font-weight:500;font-family:'IBM Plex Mono',monospace">${grid.p50_range||0}km</div><div style="font-size:10px;color:#6b7280">P25: ${grid.p25_range||0}km · P75: ${grid.p75_range||0}km</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">Corroboration</div><div style="font-size:24px;font-weight:500;color:#22c55e">${corr.PHYSICS_CONFIRMED||0}</div><div style="font-size:10px;color:#6b7280">PHYSICS_CONFIRMED · ${corr.UNCONFIRMED||0} unconfirmed</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">NBFC portfolio</div><div style="font-size:24px;font-weight:500;color:#22c55e">${(nb.A||0)+(nb.B||0)} A/B</div><div style="font-size:10px;color:#6b7280">${nb.C||0} C · ${nb.D||0} D</div></div>`;
    h += '</div>';
  }

  // ── SECTION 1: Signal correlation ranking (post-reform) ──
  h += '<div class="sec-label">Which signals best predict range?</div>';
  h += '<div style="font-size:11px;color:#9ca3af;margin-bottom:8px">Pearson r with current range · validated on 144 LFP batteries</div>';
  const corrs = [
    {name:'Composite (reformed)',r:0.760,col:'#f97316',note:'23× improvement'},
    {name:'Efficiency proxy (kps)',r:0.739,col:'#14b8a6',note:'Best SOH→range'},
    {name:'RUL v2 (range-anchored)',r:0.637,col:'#22c55e',note:'PRODUCTION'},
    {name:'SOH cap weekly',r:0.531,col:'#14b8a6',note:'EFFICIENCY_PROXY'},
    {name:'Corroboration score',r:0.450,col:'#22c55e',note:'Monotonic validated'},
    {name:'Slope — 8 weeks',r:0.278,col:'#3b82f6',note:'Leading indicator'},
    {name:'Cell spread (snapshot)',r:0.124,col:'#f59e0b',note:'Rule 42 confirmed'},
    {name:'Composite (LEGACY)',r:0.033,col:'#94a3b8',op:0.4,note:'REPLACED'},
  ];
  h += '<div style="margin-bottom:12px">';
  corrs.forEach(c => {
    const w = Math.abs(c.r) / 0.7 * 100;
    h += `<div class="corr-bar-row"><div class="corr-label">${c.name}</div><div class="corr-track"><div class="corr-fill" style="width:${w}%;background:${c.col};opacity:${c.op||1}"></div></div><div class="corr-val" style="color:${c.r<0?'#dc2626':'#374151'}">${c.r>0?'+':''}${c.r.toFixed(3)}</div></div>`;
  });
  h += '<div style="font-size:10px;color:#6b7280;margin-top:6px">Legacy composite r=0.033 (0.1% variance). Reformed composite: r=0.760 (23× improvement). Cell spread r=0.124 — confirms Rule 42: spread does not predict range on this fleet.</div>';
  h += '</div>';

  // ── SECTION 2: Divergence bars (post-reform categories) ──
  if (grid && grid.divergence) {
    h += '<div class="sec-label">Capacity state divergence</div>';
    const total = grid.total_batteries || 144;
    const dv = grid.divergence;
    const divDefs = [
      {key:'aligned',badge:'✓',label:'Aligned — capacity state matches range',col:'#22c55e',count:dv.aligned||0},
      {key:'forward_warning',badge:'FW',label:'Forward warning — flagged before range impact',col:'#f59e0b',count:dv.forward_warning||0},
      {key:'floor_stable',badge:'FS',label:'Floor stable — range at floor, state looks ok',col:'#f97316',count:dv.floor_stable||0},
      {key:'lagging_score',badge:'LS',label:'Lagging — DECLINING_FAST but not yet in action tier',col:'#f59e0b',count:dv.lagging_score||0},
      {key:'recovering_penalised',badge:'RP',label:'Recovering but penalised — improving, action elevated',col:'#8b5cf6',count:dv.recovering_penalised||0},
      {key:'baseline_suspect',badge:'BS',label:'Baseline suspect — commissioning baseline unreliable',col:'#3b82f6',count:dv.baseline_suspect||0},
    ];
    divDefs.forEach(dd => {
      const bw = Math.max(4, dd.count/total*220);
      h += `<div class="case-bar"><div class="case-dot" style="background:${dd.col}">${dd.badge}</div><div style="flex:1;font-size:11px;color:#374151">${dd.label}</div><div style="width:220px;height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden"><div style="height:100%;width:${bw}px;background:${dd.col};border-radius:4px"></div></div><div style="width:40px;text-align:right;font-size:11px;font-weight:500;font-family:'IBM Plex Mono',monospace">${dd.count}</div></div>`;
    });
  }

  // ── SECTION 3: Battery archetypes ──
  h += '<div class="sec-label" style="margin-top:14px">Battery failure archetypes</div>';
  h += '<div style="font-size:11px;color:#9ca3af;margin-bottom:8px">Four patterns observed · each requires a different intervention</div>';
  h += '<div class="arch-grid">';
  const archs = [
    {letter:'FS',col:'#f97316',title:'Floor stable — range at floor / state looks ok',desc:'range_floor_override=1 but capacity_state=STABLE. Born-weak or commissioning baseline issue.',sigs:'cap=STABLE · spread_delta=LOW · range=FLOOR · trajectory=FLAT · baseline=SUSPECT',fix:'Verify commissioning baseline. Check weeks 1-4 kps. If always low: NOT degradation — reclassify.'},
    {letter:'FW',col:'#f59e0b',title:'Forward warning — high range, structural risk building',desc:'capacity_state=EARLY_WARNING. Range still good. Corroboration score rising.',sigs:'cap=EARLY_WARNING · spread_delta=ELEVATED · range=HIGH · trajectory=DECLINING_SLOW · corr=3-4',fix:'Monitor weekly. Schedule cell balance. DO NOT replace — range is fine. Act on the signal.'},
    {letter:'LS',col:'#f59e0b',title:'Lagging score — fast decline, score not caught up',desc:'trajectory_state=DECLINING_FAST but capacity_state not yet CRITICAL. 8-week slope is leading.',sigs:'cap=DECLINING_SLOW · spread_delta=MED · range=MED · trajectory=DECLINING_FAST · slope=FAST',fix:'Plan replacement 4-8 weeks. Score will drop. Rule 52: slope override cannot be downgraded.'},
    {letter:'CP',col:'#3b82f6',title:'Charger pattern — operator or charger driven',desc:'degradation_primary_driver=CHARGING_STRESSED. C-rate elevated. Range declining.',sigs:'cap=DECLINING_SLOW · charge=HIGH · range=DECLINING · driver=CHARGING · spread_delta=LOW',fix:'Replace charger first. Reassess battery in 4 weeks. If range recovers: battery vindicated.'},
  ];
  archs.forEach(a => {
    h += `<div class="arch-card" style="border-left-color:${a.col}"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div class="case-dot" style="background:${a.col};width:20px;height:20px;font-size:9px">${a.letter}</div><div style="font-size:12px;font-weight:500;color:#374151">${a.title}</div></div>`;
    h += `<div style="font-size:11px;color:#6b7280;margin-bottom:6px">${a.desc}</div>`;
    h += `<div style="font-size:10px;font-family:var(--font-mono);color:#9ca3af;margin-bottom:6px">${a.sigs}</div>`;
    h += `<div style="font-size:11px;font-weight:500;color:${a.col}">→ ${a.fix}</div></div>`;
  });
  h += '</div>';

  // ── SECTION 4: Key findings ──
  h += '<div class="sec-label">Scoring reform — what the data revealed</div>';
  const findings = [
    {border:'#dc2626',bg:'#fff8f8',badge:'FIXED — r=0.760',title:'Legacy composite r=0.033 — explained 0.1% of range variance',text:'Reformed composite: r=0.760 (23× improvement). capacity_state + rul_action_v2 are now the production signals, not a single number.'},
    {border:'#f59e0b',bg:'#fffdf5',badge:'RULE 42 CONFIRMED',title:'Cell spread r=0.124 — not a range predictor on this fleet',text:'82% delivered above 150mV at commissioning (median 193mV). Spread is standalone warning, never folded into composite. Rule 46 + Rule 51 implemented.'},
    {border:'#22c55e',bg:'#f8fff9',badge:'SPRINT 2 COMPLETE',title:'Attribution recalibrated — maintenance 42.5% → 34.3%',text:'New formula uses commissioning_delta not absolute spread. E2 threshold: max(150, commissioning+80mV). 67 batteries had E2 suppressed — structural spread confirmed.'},
    {border:'#f59e0b',bg:'#fffdf5',badge:'JUNE 1 2026',title:'Thermal attribution 1% in March — summer re-run scheduled',text:'thermal_stress_score v2 promoted LFP. 874 summer weeks in VWF. Summer attribution expected 15-20%. NMC thermal in shadow.'},
  ];
  findings.forEach(f => {
    h += `<div class="finding-card" style="border-left-color:${f.border};background:${f.bg}"><div style="position:absolute;top:8px;right:10px;font-size:9px;font-weight:500;padding:2px 8px;border-radius:4px;background:${f.border}18;color:${f.border}">${f.badge}</div><div style="font-size:13px;font-weight:500;color:#374151;margin-bottom:4px;padding-right:90px">${f.title}</div><div style="font-size:11px;color:#6b7280;line-height:1.6">${f.text}</div></div>`;
  });

  // ── SECTION 5: Corroboration quality panel ──
  if (grid && grid.corroboration_dist) {
    const cd = grid.corroboration_dist;
    h += '<div class="sec-label" style="margin-top:14px">Corroboration quality — 7-signal validation</div>';
    const corrDefs = [
      {verdict:'PHYSICS_CONFIRMED',col:'#22c55e',range:'5-7',count:cd.PHYSICS_CONFIRMED||0},
      {verdict:'PROGRESSIVE',col:'#14b8a6',range:'3-4',count:cd.PROGRESSIVE||0},
      {verdict:'WEAK_SIGNAL',col:'#f59e0b',range:'1-2',count:cd.WEAK_SIGNAL||0},
      {verdict:'UNCONFIRMED',col:'#94a3b8',range:'0',count:cd.UNCONFIRMED||0},
    ];
    const corrTotal = corrDefs.reduce((s,c)=>s+c.count,0);
    corrDefs.forEach(c => {
      const bw = corrTotal>0?Math.max(4,c.count/corrTotal*200):4;
      h += `<div class="corr-bar-row"><div class="corr-label" style="font-family:'IBM Plex Mono',monospace">${c.verdict}</div><div class="corr-track"><div class="corr-fill" style="width:${bw}px;background:${c.col}"></div></div><div class="corr-val">${c.count} <span style="font-size:9px;color:#9ca3af">(${c.range})</span></div></div>`;
    });
    h += '<div style="font-size:10px;color:#6b7280;margin-top:6px">Corroboration validates capacity_state before action. Score 0=118km mean range · Score 6=65km (monotonic). Zero overalarms maintained — Gate 2 non-negotiable.</div>';
  }

  // ── SECTION 6: Per-battery drill-down ──
  if (comp && comp.has_data !== false && S.bat) {
    h += '<div class="sec-label" style="margin-top:14px">Battery drill-down: ' + S.bat + '</div>';
    const opS = comp.operational_score ?? comp.l1_score ?? 0;
    const trS = comp.trajectory_score ?? 70;
    const cf = comp.case_flag || comp.score_reform_flag || 'ALIGNED';
    const ep = comp.event_penalty || 0;
    const legacy = comp.composite_pre_penalty || 0;

    // Score comparison
    h += '<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:12px 15px;margin-bottom:8px">';
    h += `<div style="font-size:11px;color:#9ca3af;margin-bottom:6px">Score comparison</div>`;
    h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:12px">`;
    h += `<div><div style="color:#9ca3af;font-size:10px">Legacy composite</div><div style="font-size:20px;font-weight:500;color:#888">${Math.round(legacy)}</div></div>`;
    h += `<div><div style="color:#9ca3af;font-size:10px">Operational (new)</div><div style="font-size:20px;font-weight:500;color:#f97316">${Math.round(opS)}</div></div>`;
    h += `<div><div style="color:#9ca3af;font-size:10px">Trajectory</div><div style="font-size:20px;font-weight:500;color:${trS<40?'#dc2626':trS<60?'#f59e0b':'#22c55e'}">${Math.round(trS)}</div></div>`;
    h += '</div></div>';

    // Case classification
    if (cf !== 'ALIGNED' && cf !== 'NORMAL') {
      const caseDescs = {DIVERGE:'Score and range diverged under reform analysis.',B:'Forward warning — delivering well today, structural risk building.',D:'Score suppressed by event penalty despite improving trajectory.',F:'Above own baseline but penalised by cell health signals.'};
      h += `<div style="background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:8px"><div style="font-size:11px;font-weight:500;color:#92400e;margin-bottom:2px">Case: ${cf}</div><div style="font-size:11px;color:#6b7280">${caseDescs[cf]||'Review score components.'}</div></div>`;
    }

    // Causal direction
    if (comp.causal_direction) {
      const cd = comp.causal_direction;
      const cc = cd === 'COMPENSATION' ? 'causal-comp' : 'causal-caus';
      h += `<div class="causal-card ${cc}"><div class="causal-label">${cd === 'COMPENSATION' ? 'Real degradation confirmed' : 'Charging stress detected'}</div><div class="causal-text">${comp.causal_text || cd}</div></div>`;
    }

    // Weight sensitivity
    const l1 = comp.l1_score || opS;
    const l2 = comp.l2_score || 50;
    const l3 = comp.l3_score || 50;
    const noL2 = Math.round(0.71*l1 + 0.29*l3);
    const decayed = Math.round(opS + ep * 0.5);
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">';
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:8px 10px;text-align:center"><div style="font-size:10px;color:#9ca3af">Current 50/30/20</div><div style="font-size:18px;font-weight:500">${Math.round(opS)}</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:8px 10px;text-align:center"><div style="font-size:10px;color:#9ca3af">L2 removed</div><div style="font-size:18px;font-weight:500">${noL2}</div></div>`;
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:8px 10px;text-align:center"><div style="font-size:10px;color:#9ca3af">Event decay 50%</div><div style="font-size:18px;font-weight:500">${decayed}</div></div>`;
    h += '</div>';
  }

  el.innerHTML = h;
}

// ════════════════════════════════════════════════════════════════
// BATTERY PROFILE TAB — renderProfile (Sprint UI-C)
// ════════════════════════════════════════════════════════════════
async function renderProfile() {
  const el = document.getElementById('tab-content');
  if (!S.bat) { el.innerHTML = `<div style="text-align:center;padding:60px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#9ca3af">Select a battery to view its operational profile</div>`; return; }
  const p = await get(`/api/battery/${S.bat}/profile`).catch(()=>null);
  if (!p || !p.has_data) { el.innerHTML = emptyState('Profile unavailable','No usage profile data for this battery.'); return; }

  let h = '';
  // Hero
  const confCol = {HIGH:'#22c55e',MEDIUM:'#f59e0b',LOW:'#dc2626',ESTIMATED:'#94a3b8'}[p.profile_confidence]||'#94a3b8';
  h += `<div class="hero-dark"><div style="display:flex;justify-content:space-between;align-items:flex-start">`;
  h += `<div><span style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#f97316">${S.bat}</span>`;
  if (p.template_id) h += ` <span style="font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border:1px solid #555;border-radius:8px;color:#888">${p.template_id}</span>`;
  h += `</div><span style="font-size:10px;padding:2px 8px;border-radius:8px;background:${confCol}22;color:${confCol};font-weight:600;font-family:'IBM Plex Mono',monospace">${p.profile_confidence||'—'}</span></div>`;
  const sumParts = [p.ownership_model, p.end_use_type, (p.usage_intensity_tier||'')+ ' use', p.primary_charge_type, p.city].filter(Boolean);
  h += `<div style="font-size:12px;color:#d1d5db;border-top:1px solid #1f1f1f;padding-top:8px;margin-top:8px">${sumParts.join(' · ')}</div>`;
  if (p.template_id) {
    h += `<div style="margin-top:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#f97316">Template: ${p.template_id}</span>`;
    const sensCols = {LOW:'#22c55e',STANDARD:'#94a3b8',HIGH:'#f59e0b',CRITICAL:'#dc2626'};
    h += ` <span style="font-size:9px;padding:1px 6px;border-radius:6px;background:${(sensCols[p.alert_sensitivity]||'#94a3b8')}22;color:${sensCols[p.alert_sensitivity]||'#94a3b8'};font-family:'IBM Plex Mono',monospace">${p.alert_sensitivity||'STANDARD'}</span></div>`;
  }
  h += `</div>`;

  // Usage context 2x2
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">';
  const uTier = p.usage_intensity_tier||'MODERATE';
  const uCol = {LIGHT:'#22c55e',MODERATE:'#14b8a6',HEAVY:'#f59e0b',EXTREME:'#dc2626'}[uTier]||'#94a3b8';
  h += `<div class="sub-card" style="border-left-color:${uCol}"><div class="sub-name">Daily km <span class="sub-status-badge" style="background:${uCol}18;color:${uCol}">${uTier}</span></div><div class="sub-val">${p.daily_km_typical?Math.round(p.daily_km_typical):'—'}<span>km/day</span></div><div class="sub-insight">${p.active_days_per_week?p.active_days_per_week.toFixed(1):'-'} active days/week</div></div>`;
  const chgType = (p.primary_charge_type||'').replace(/_/g,' ').toLowerCase();
  const relCol = {RELIABLE:'#22c55e',OPPORTUNISTIC:'#f59e0b',CONSTRAINED:'#dc2626'}[p.charge_access_reliability]||'#94a3b8';
  h += `<div class="sub-card" style="border-left-color:${relCol}"><div class="sub-name">Charging</div><div class="sub-val" style="font-size:14px">${chgType||'—'}</div><div class="sub-insight">${p.charge_access_reliability||'—'}</div></div>`;
  const endUseMap = {LOGISTICS_FOOD:'Food delivery',LOGISTICS_ECOMM:'E-commerce',PERSONAL:'Personal',PASSENGER_HIRE:'Auto-rickshaw'};
  h += `<div class="sub-card" style="border-left-color:${uCol}"><div class="sub-name">Cycles</div><div class="sub-val">${p.cycles_per_day_typical?p.cycles_per_day_typical.toFixed(1):'—'}<span>cycles/day</span></div><div class="sub-insight">${endUseMap[p.end_use_type]||p.end_use_type||'—'}</div></div>`;
  const ep = p.economic_pressure_score;
  const epCol = ep>70?'#dc2626':ep>40?'#f59e0b':'#22c55e';
  h += `<div class="sub-card" style="border-left-color:${ep!=null?epCol:'#94a3b8'}"><div class="sub-name">Economic pressure</div><div class="sub-val">${ep!=null?Math.round(ep)+' / 100':'—'}</div>`;
  if (ep!=null) h += `<div style="height:4px;background:#f3f4f6;border-radius:2px;margin:4px 0"><div style="width:${ep}%;height:100%;background:${epCol};border-radius:2px"></div></div>`;
  h += `<div class="sub-insight" style="font-size:10px;color:#94a3b8">Score logged · CRITICAL sensitivity not yet activated (Rule 58)</div></div>`;
  h += '</div>';

  // Ownership chain
  h += '<div class="sec-label">OWNERSHIP & RELATIONSHIPS</div>';
  h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">';
  const nodes = [{type:'Battery',name:S.bat,sub:p.battery_oem_name||'OEM'}];
  if (p.operator_name) nodes.push({type:'Operator',name:p.operator_name,sub:p.operator_city||p.city||''});
  if (p.lender_name) nodes.push({type:'Lender',name:p.lender_name,sub:''});
  if (p.swap_operator_name) nodes.push({type:'Swap',name:p.swap_operator_name,sub:''});
  nodes.push({type:'End use',name:endUseMap[p.end_use_type]||p.end_use_type||'—',sub:p.city||''});
  nodes.forEach((n,i) => {
    if (i>0) h += '<span style="color:#94a3b8;font-size:14px">→</span>';

  const iotCol = {RELIABLE:'#22c55e',INTERMITTENT:'#f59e0b',DEGRADED:'#dc2626'}[p.iot_data_quality_flag]||'#94a3b8';
  h += `<div class="sub-card" style="border-left-color:${iotCol}"><div class="sub-name">IoT Device</div><div style="font-size:13px;font-weight:500">${p.iot_device_id||'Unknown'}</div><div style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:#6b7280">FW: ${p.iot_firmware_version||'—'} · ${p.iot_sampling_freq_sec||20}s</div><div style="font-size:10px;color:${iotCol}">● ${p.iot_data_quality_flag||'UNKNOWN'}</div></div>`;
  h += `<div class="sub-card" style="border-left-color:${p.vehicle_oem_name?'#14b8a6':'#94a3b8'}"><div class="sub-name">Vehicle</div><div style="font-size:13px;font-weight:500">${p.vehicle_oem_name||'Unknown'}</div>${!p.vehicle_oem_name?'<div style="font-size:10px;color:#94a3b8">vehicle_oem_id not mapped — Rule 1C gap</div>':''}</div>`;
  h += `<div class="sub-card" style="border-left-color:#14b8a6"><div class="sub-name">Battery cell</div><div style="font-size:13px;font-weight:500">${p.battery_oem_name||'Unknown'}</div><div style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:#6b7280">${p.cell_chemistry_variant||'—'} · ${p.rated_capacity_ah||'—'}Ah · ${p.cell_count_series||'—'}S</div></div>`;
  h += '</div>';

  // Maintenance + Route
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">';
  const maintCol = {SELF:'#f59e0b',SERVICE_PARTNER:'#22c55e',OEM_WARRANTY:'#22c55e',UNMAINTAINED:'#dc2626'}[p.maintenance_regime]||'#94a3b8';
  h += `<div class="sub-card" style="border-left-color:${maintCol}"><div class="sub-name">Maintenance</div><div style="font-size:12px;font-weight:500">${(p.maintenance_regime||'UNKNOWN').replace(/_/g,' ')}</div>${p.last_service_date?'<div style="font-size:10px;color:#6b7280">Last: '+p.last_service_date+'</div>':''}</div>`;
  h += `<div class="sub-card"><div class="sub-name">Route</div><div style="font-size:12px;font-weight:500">${(p.route_type||'—').replace(/_/g,' ')}</div>${p.route_severity_score!=null?'<div style="height:4px;background:#f3f4f6;border-radius:2px;margin:4px 0"><div style="width:'+p.route_severity_score+'%;height:100%;background:#f97316;border-radius:2px"></div></div>':''}${p.city?'<div style="font-size:10px;font-family:\'IBM Plex Mono\',monospace;color:#9ca3af">'+p.city+'</div>':''}</div>`;
  h += '</div>';

  // Template (collapsible)
  if (p.template_id) {
    h += '<details style="margin-bottom:10px"><summary class="sec-label" style="cursor:pointer">INTELLIGENCE TEMPLATE</summary>';
    h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:11px 14px">`;
    h += `<div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#f97316;margin-bottom:4px">${p.template_id}</div>`;
    if (p.template_name) h += `<div style="font-size:11px;color:#6b7280;margin-bottom:6px">${p.template_name}</div>`;
    if (p.modules_active_json) {
      try { const mods=JSON.parse(p.modules_active_json); h+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">'; const mCols={M0:'#94a3b8',M1:'#14b8a6',M2:'#14b8a6',M3:'#3b82f6',M4:'#f59e0b',M5:'#f97316',M6:'#22c55e',M7:'#8b5cf6'}; mods.forEach(m=>{const c=mCols[m]||'#94a3b8';h+=`<span style="font-size:9px;padding:2px 6px;border-radius:4px;background:${c}18;color:${c};font-family:'IBM Plex Mono',monospace">${m}</span>`;}); h+='</div>'; } catch(e){}
    }
    if (p.rul_urgency_multiplier!=null) h+=`<div style="font-size:10px;color:#6b7280">RUL urgency: ×${p.rul_urgency_multiplier} · Floor mod: ${p.range_floor_modifier>=0?'+':''}${p.range_floor_modifier||0}km · Alert: ${p.alert_sensitivity||'STANDARD'}</div>`;
    if (p.template_override) h+=`<div style="background:#fffdf5;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;padding:6px 10px;margin-top:6px;font-size:10px;color:#92400e">Template manually overridden — auto-derivation disabled (Rule 57)</div>`;
    h += '</div></details>';
  }

  el.innerHTML = h;
}

// PLATFORM CONFIG TAB — renderConfig (Sprint UI-C)
// ════════════════════════════════════════════════════════════════
async function renderConfig() {
  const el = document.getElementById('tab-content');
  const [params, audit] = await Promise.all([
    get('/api/fleet/config-params').catch(()=>null),
    get('/api/fleet/config-audit?limit=20').catch(()=>null),
  ]);

  let h = '';

  // Header
  h += `<div style="background:#f8fafc;border-bottom:1px solid #e5e7eb;padding:14px 18px;margin:-16px -16px 14px;border-radius:8px 8px 0 0">`;

  h += `<div style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:#9ca3af">fleet_context_params — 3-layer adaptive threshold engine</div></div>`;

  if (!params) { h += '<div style="color:#94a3b8;padding:20px;text-align:center">Config endpoint unavailable</div>'; el.innerHTML = h; return; }

  // Summary tiles
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
  h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#dc2626;text-transform:uppercase">🔒 Layer 1 · Physics</div><div style="font-size:20px;font-weight:500">${(params.layer1||[]).length}</div></div>`;
  h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#f59e0b;text-transform:uppercase">⚙ Layer 2 · Fleet</div><div style="font-size:20px;font-weight:500">${(params.layer2||[]).length}</div></div>`;
  h += `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#22c55e;text-transform:uppercase">👤 Layer 3 · Customer</div><div style="font-size:20px;font-weight:500">${(params.layer3||[]).length}</div></div>`;
  h += '</div>';

  // Render each layer as table
  function renderParamTable(layerRows, layerNum, label, icon) {
    if (!layerRows || !layerRows.length) return '';
    let t = `<div class="sec-label">${icon} LAYER ${layerNum} — ${label}</div>`;
    t += '<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px">';
    t += '<tr style="background:#0F0800"><th style="padding:6px 8px;color:#fff;text-align:left;font-size:10px">Param</th><th style="color:#fff;padding:6px;text-align:left;font-size:10px">Segment</th><th style="color:#fff;padding:6px;text-align:right;font-size:10px">Value</th><th style="color:#fff;padding:6px;text-align:right;font-size:10px">Floor</th><th style="color:#fff;padding:6px;text-align:right;font-size:10px">Ceiling</th><th style="color:#fff;padding:6px;text-align:left;font-size:10px">Confidence</th></tr>';
    layerRows.forEach((r,i) => {
      const bg = i%2===0?'#fff':'#f8fafc';
      const confCol = {HIGH:'#22c55e',MEDIUM:'#f59e0b',LOW:'#dc2626'}[r.confidence]||'#94a3b8';
      t += `<tr style="background:${bg}"><td style="padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-weight:500">${r.param_name}</td><td style="padding:5px 6px;color:#6b7280">${r.segment_type||'—'}:${r.segment_value||'ALL'}</td><td style="padding:5px 6px;text-align:right;font-family:'IBM Plex Mono',monospace;color:#f97316;font-weight:500">${r.param_value}</td><td style="padding:5px 6px;text-align:right;color:#9ca3af">${r.override_floor??'—'}</td><td style="padding:5px 6px;text-align:right;color:#9ca3af">${r.override_ceiling??'—'}</td><td style="padding:5px 6px"><span style="font-size:9px;padding:1px 5px;border-radius:4px;background:${confCol}18;color:${confCol}">${r.confidence||'—'}</span></td></tr>`;
    });
    t += '</table>';
    return t;
  }

  h += renderParamTable(params.layer1, 1, 'PHYSICS FLOORS · READ ONLY', '🔒');
  h += `<div style="background:#fff8f8;border-left:3px solid #dc2626;border-radius:0 6px 6px 0;padding:8px 12px;font-size:10px;color:#991b1b;margin-bottom:12px">Layer 1 cannot be overridden. Customer Layer 3 overrides are bounded by these floors.</div>`;
  h += renderParamTable(params.layer2, 2, 'FLEET CALIBRATED · AUTO-UPDATED', '⚙');
  h += renderParamTable(params.layer3, 3, 'CUSTOMER OVERRIDES', '👤');
  if (!(params.layer3||[]).length) {
    h += '<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:14px;font-size:11px;color:#9ca3af;text-align:center;margin-bottom:12px">No customer overrides configured. Platform defaults apply.</div>';
  }

  // ── Section E: Override form ──
  const allParams = [...(params.layer1||[]), ...(params.layer2||[])];
  h += '<div class="sec-label">CONFIGURE CUSTOMER OVERRIDE</div>';
  h += '<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:14px;margin-bottom:12px">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">';
  h += `<div><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;margin-bottom:3px">Parameter</div><select id="cfg-param" onchange="cfgParamChanged()" style="width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;font-family:'IBM Plex Mono',monospace"><option value="">Select parameter...</option>`;
  allParams.forEach(p => h += `<option value="${p.param_name}" data-floor="${p.override_floor??''}" data-ceil="${p.override_ceiling??''}" data-val="${p.param_value}">${p.param_name} · ${p.segment_type||'ALL'}:${p.segment_value||'ALL'} · Current: ${p.param_value}</option>`);
  h += `</select></div>`;
  h += `<div><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;margin-bottom:3px">Scope</div><div style="display:flex;gap:4px"><select id="cfg-seg-type" style="flex:1;padding:6px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px"><option>BATTERY_ID</option><option>OPERATOR_ID</option><option>PACK</option><option>CHEMISTRY</option><option>CITY</option><option>ALL</option></select><input id="cfg-seg-val" placeholder="e.g. BAT_LFP_001" style="flex:1;padding:6px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;font-family:'IBM Plex Mono',monospace"></div></div>`;
  h += '</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">';
  h += `<div><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;margin-bottom:3px">New value</div><input id="cfg-val" type="number" step="0.001" oninput="cfgValidateVal()" style="width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;font-family:'IBM Plex Mono',monospace"><div id="cfg-val-msg" style="font-size:10px;margin-top:2px"></div></div>`;
  h += `<div><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;margin-bottom:3px">Allowed range</div><div id="cfg-range" style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;padding:8px 0">Select a parameter first</div></div>`;
  h += '</div>';
  h += `<div style="margin-bottom:8px"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:#9ca3af;margin-bottom:3px">Reason <span id="cfg-reason-count" style="color:#dc2626">(0/10 min)</span></div><textarea id="cfg-reason" rows="2" oninput="cfgValidateReason()" placeholder="Explain why this threshold is being changed..." style="width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;resize:vertical"></textarea></div>`;
  h += `<button id="cfg-submit" onclick="cfgSubmitOverride()" disabled style="padding:8px 18px;border:none;border-radius:6px;background:#ccc;color:#fff;font-size:12px;font-weight:600;cursor:not-allowed;font-family:'DM Sans',sans-serif">Apply Layer 3 Override</button>`;
  h += '<div id="cfg-result" style="margin-top:6px"></div>';
  h += '</div>';

  // ── Section G: Battery-level param view ──
  if (S.bat) {
    h += `<div class="sec-label">EFFECTIVE PARAMS FOR ${S.bat}</div>`;
    const prof = await get(`/api/battery/${S.bat}/profile`).catch(()=>null);
    const keyParams = ['soh_critical_pct','range_floor_km','spread_critical_mv','spread_alert_delta_mv','bms_soc_bias_pct','thermal_weight_attribution','crate_alert_threshold_c','commissioning_spread_mv'];
    h += '<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px">';
    h += '<tr style="background:#0F0800"><th style="padding:5px 8px;color:#fff;text-align:left;font-size:10px">Parameter</th><th style="color:#fff;padding:5px;text-align:right;font-size:10px">Value</th><th style="color:#fff;padding:5px;text-align:left;font-size:10px">Resolved at</th><th style="color:#fff;padding:5px;font-size:10px">Layer</th></tr>';
    const batChem = prof?.chemistry || 'LFP';
    const batPack = prof?.pack_model || prof?.battery_model || '';
    const batCity = prof?.city || '';
    keyParams.forEach(pn => {
      // Cascade: L3 BATTERY > L3 PACK > L2 PACK > L2 CHEM > L1 CHEM > L1 ALL
      let resolved = null, resolvedAt = '—', layer = '—';
      for (const [lk, ll] of [['layer3','L3'],['layer2','L2'],['layer1','L1']]) {
        const lp = params[lk] || [];
        // Battery-specific
        const batMatch = lp.find(p => p.param_name===pn && p.segment_type==='BATTERY_ID' && p.segment_value===S.bat);
        if (batMatch) { resolved=batMatch.param_value; resolvedAt=`BATTERY_ID:${S.bat}`; layer=ll; break; }
        // Pack
        const packMatch = lp.find(p => p.param_name===pn && p.segment_type==='PACK' && p.segment_value===batPack);
        if (packMatch) { resolved=packMatch.param_value; resolvedAt=`PACK:${batPack}`; layer=ll; break; }
        // Chemistry
        const chemMatch = lp.find(p => p.param_name===pn && p.segment_type==='CHEMISTRY' && p.segment_value===batChem);
        if (chemMatch) { resolved=chemMatch.param_value; resolvedAt=`CHEMISTRY:${batChem}`; layer=ll; break; }
        // ALL
        const allMatch = lp.find(p => p.param_name===pn && (p.segment_type==='ALL' || !p.segment_type));
        if (allMatch) { resolved=allMatch.param_value; resolvedAt='ALL'; layer=ll; break; }
      }
      const lCol = {L1:'#dc2626',L2:'#f59e0b',L3:'#22c55e'}[layer]||'#94a3b8';
      const lIcon = {L1:'🔒',L2:'⚙',L3:'👤'}[layer]||'';
      h += `<tr style="border-top:1px solid #f3f4f6"><td style="padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-weight:500">${pn}</td><td style="padding:5px;text-align:right;font-family:'IBM Plex Mono',monospace;color:#f97316">${resolved??'—'}</td><td style="padding:5px;font-size:10px;color:#6b7280">${resolvedAt}</td><td style="padding:5px;text-align:center"><span style="font-size:9px;padding:1px 5px;border-radius:4px;background:${lCol}18;color:${lCol}">${lIcon}${layer}</span></td></tr>`;
    });
    h += '</table>';
    h += `<div style="font-size:10px;color:#9ca3af;font-family:'IBM Plex Mono',monospace">Resolution: Battery → Operator → Pack → Chemistry → Fleet · Most specific wins · L3 overrides L2 overrides L1</div>`;
  }

  // Audit log
  if (audit && audit.entries && audit.entries.length) {
    h += '<div class="sec-label">RECENT PARAMETER CHANGES</div>';
    audit.entries.forEach(e => {
      const byCol = {SYSTEM_CALIBRATION:'#3b82f6',CUSTOMER_CONFIG:'#22c55e',ENERLYTIK_ADMIN:'#dc2626'}[e.changed_by]||'#94a3b8';
      const byLabel = {SYSTEM_CALIBRATION:'⚙ System',CUSTOMER_CONFIG:'👤 Customer',ENERLYTIK_ADMIN:'🔒 Admin'}[e.changed_by]||e.changed_by;
      h += `<div style="border-bottom:1px solid #f3f4f6;padding:8px 0">`;
      h += `<div style="display:flex;justify-content:space-between"><span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px">${e.param_name}</span><span style="font-size:10px;color:#9ca3af">${e.changed_at||'—'}</span></div>`;
      h += `<div style="font-size:11px;margin-top:2px"><span style="font-family:'IBM Plex Mono',monospace;color:#94a3b8">${e.old_value??'—'}</span> → <span style="font-family:'IBM Plex Mono',monospace;color:#f97316">${e.new_value??'—'}</span> <span style="font-size:9px;padding:1px 5px;border-radius:4px;background:${byCol}18;color:${byCol}">${byLabel}</span></div>`;
      if (e.change_reason) h += `<div style="font-size:10px;color:#9ca3af;font-style:italic;margin-top:2px">${e.change_reason}</div>`;
      h += '</div>';
    });
  }

  el.innerHTML = h;
}

// Config form helpers
function cfgParamChanged() {
  const sel = document.getElementById('cfg-param');
  const opt = sel?.options[sel.selectedIndex];
  const floor = opt?.dataset.floor; const ceil = opt?.dataset.ceil;
  document.getElementById('cfg-range').textContent = floor && ceil ? `${floor} – ${ceil}` : 'No bounds';
  cfgValidateVal();
}
function cfgValidateVal() {
  const sel = document.getElementById('cfg-param');
  const opt = sel?.options[sel.selectedIndex];
  const val = parseFloat(document.getElementById('cfg-val')?.value);
  const floor = parseFloat(opt?.dataset.floor); const ceil = parseFloat(opt?.dataset.ceil);
  const msg = document.getElementById('cfg-val-msg');
  const inp = document.getElementById('cfg-val');
  if (isNaN(val)) { msg.textContent=''; inp.style.borderColor='#e5e7eb'; }
  else if (!isNaN(floor) && val < floor) { msg.innerHTML=`<span style="color:#dc2626">Below physics floor (${floor})</span>`; inp.style.borderColor='#dc2626'; }
  else if (!isNaN(ceil) && val > ceil) { msg.innerHTML=`<span style="color:#dc2626">Above ceiling (${ceil})</span>`; inp.style.borderColor='#dc2626'; }
  else { msg.innerHTML='<span style="color:#22c55e">✓ Within range</span>'; inp.style.borderColor='#22c55e'; }
  cfgCheckSubmit();
}
function cfgValidateReason() {
  const r = document.getElementById('cfg-reason')?.value?.length||0;
  const cnt = document.getElementById('cfg-reason-count');
  cnt.textContent = `(${r}/10 min)`; cnt.style.color = r>=10?'#22c55e':'#dc2626';
  cfgCheckSubmit();
}
function cfgCheckSubmit() {
  const sel = document.getElementById('cfg-param')?.value;
  const val = document.getElementById('cfg-val')?.value;
  const reason = document.getElementById('cfg-reason')?.value?.length||0;
  const btn = document.getElementById('cfg-submit');
  const ok = sel && val && reason >= 10;
  btn.disabled = !ok; btn.style.background = ok?'#f97316':'#ccc'; btn.style.cursor = ok?'pointer':'not-allowed'; btn.style.color = ok?'#fff':'#999';
}
async function cfgSubmitOverride() {
  const btn = document.getElementById('cfg-submit');
  btn.textContent = 'Applying...'; btn.disabled = true;
  try {
    const body = {
      param_name: document.getElementById('cfg-param').value,
      param_value: parseFloat(document.getElementById('cfg-val').value),
      segment_type: document.getElementById('cfg-seg-type').value,
      segment_value: document.getElementById('cfg-seg-val').value,
      change_reason: document.getElementById('cfg-reason').value,
      operator_id: 'INTERNAL_UI'
    };
    const r = await fetch(API_BASE+'/api/config/param',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data = await r.json();
    const res = document.getElementById('cfg-result');
    if (r.ok) { res.innerHTML='<div style="background:#f8fff9;border-left:3px solid #22c55e;padding:6px 10px;border-radius:0 6px 6px 0;font-size:11px;color:#166534">Override applied · Layer 3 row created</div>'; setTimeout(()=>renderConfig(),1500); }
    else { res.innerHTML=`<div style="background:#fff8f8;border-left:3px solid #dc2626;padding:6px 10px;border-radius:0 6px 6px 0;font-size:11px;color:#991b1b">${data.detail||data.error||'Error'}</div>`; }
  } catch(e) { document.getElementById('cfg-result').innerHTML='<div style="color:#dc2626;font-size:11px">Request failed</div>'; }
  btn.textContent = 'Apply Layer 3 Override'; cfgCheckSubmit();
}
