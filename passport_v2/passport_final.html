async function loadForensicData() {
  if (!S.bat) return;
  const data = await get('/api/battery/' + S.bat + '/forensic');
  if (!data || data.detail) { document.getElementById('tab-content').innerHTML = emptyState('Forensic','Failed to load forensic data.'); return; }

  const id = data.identity || {};
  const dq = data.data_quality || {};
  const sc = data.score || {};
  const weeks = data.weekly_coverage || [];
  const events = data.events || [];

  // Identity
  document.getElementById('f-original-id').textContent = id.original_id || '—';
  document.getElementById('f-battery-id').textContent = id.battery_id || '—';
  document.getElementById('f-pack-type').textContent = (id.battery_model || '—') + ' / ' + (id.chemistry || '—');
  document.getElementById('f-commissioned').textContent = id.commissioning_date || '—';
  document.getElementById('f-oem').textContent = id.oem_name || '—';
  document.getElementById('f-cohort').textContent = (id.cohort_size || '?') + ' batteries same model';

  // Banner
  const verdict = dq.data_quality_verdict || 'UNKNOWN';
  const usable = sc.score_usable_for_decisions !== 0;
  const banner = document.getElementById('forensic-banner');
  if (!usable || verdict.includes('SUSPEND') || verdict.includes('CRITICAL') || verdict.includes('SUPPRESSED')) {
    banner.style.display = 'block'; banner.style.background = 'rgba(226,75,74,0.08)'; banner.style.borderLeftColor = '#E24B4A';
    document.getElementById('forensic-banner-title').style.color = '#A32D2D';
    document.getElementById('forensic-banner-title').textContent = 'DATA QUALITY WARNING — Score not reliable for financial decisions';
    document.getElementById('forensic-banner-body').textContent = dq.dq_summary || 'Score suspended or data incomplete.';
  } else if (verdict.includes('ALERT') || verdict.includes('IMPUTED') || verdict.includes('WARN')) {
    banner.style.display = 'block';
    document.getElementById('forensic-banner-title').textContent = 'Data quality caution';
    document.getElementById('forensic-banner-body').textContent = dq.dq_summary || 'Partial data — review before external use.';
  }

  // Score reliability — plain language
  const vEl = document.getElementById('f-dq-verdict'); vEl.textContent = plainLang(verdict);
  vEl.style.color = verdict.includes('SUSPEND') || verdict.includes('CRITICAL') || verdict.includes('SUPPRESSED') ? '#E24B4A' : verdict.includes('ALERT') || verdict.includes('WARN') ? '#d97706' : 'var(--grn)';
  const uEl = document.getElementById('f-usable'); uEl.textContent = usable ? 'YES' : 'NO';
  uEl.style.color = usable ? 'var(--grn)' : '#E24B4A';
  document.getElementById('f-scoring-mode').textContent = plainLang(sc.scoring_mode || 'FULL');
  document.getElementById('f-confidence').textContent = sc.confidence_score ? sc.confidence_score + '/100' : '—';

  // Flags — plain language with what/cause/fix/timeline
  const flags = (Array.isArray(dq.data_quality_flags) ? dq.data_quality_flags : []).filter(Boolean);
  const flagEl = document.getElementById('f-flags-container');
  const flagDesc = {
    'NO_SOH_HISTORY':{what:'Capacity measurement using efficiency proxy',cause:'Charging pattern prevents full discharge-charge cycle measurement.',fix:'Encourage full charge cycles (0→100%) 2-3 times per week.',time:'4-6 weeks after charging behaviour change'},
    'IOT_ALERT':{what:'IoT connectivity issue',cause:'CAN data gap of 2-3 weeks detected.',fix:'Check IoT device and SIM card.',time:'Resolves automatically when device reconnects'},
    'IOT_CRITICAL':{what:'IoT device issue detected',cause:'CAN data absent for 4+ weeks. GPS confirms vehicle is still operating.',fix:'Physical IoT device inspection required. Replace if offline >4 weeks.',time:'Immediate — score paused until device restored'},
    'PIPELINE_FAILURE':{what:'Technical issue — platform team notified',cause:'Data arrived but processing incomplete for some weeks.',fix:'No action needed — platform team will investigate.',time:'Usually resolved within 24 hours'},
  };
  flagEl.innerHTML = flags.map(f => {
    const hi = f.includes('SOH') || f.includes('CRITICAL');
    const fd = flagDesc[f];
    if (fd) {
      return `<div style="background:${hi?'rgba(226,75,74,0.06)':'rgba(239,159,39,0.06)'};border-left:3px solid ${hi?'#E24B4A':'#EF9F27'};border-radius:0 6px 6px 0;padding:8px 11px;margin-bottom:5px;font-size:11px;line-height:1.5">
        <div style="font-weight:600;margin-bottom:2px">${fd.what}</div>
        <div style="color:var(--text2)"><strong>Cause:</strong> ${fd.cause}</div>
        <div style="color:var(--text2)"><strong>What improves it:</strong> ${fd.fix}</div>
        <div style="color:var(--text3);font-family:var(--font-mono);font-size:10px">Estimated time to full scoring: ${fd.time}</div>
      </div>`;
    }
    return `<div style="background:rgba(239,159,39,0.06);border-left:3px solid #EF9F27;border-radius:0 6px 6px 0;padding:7px 11px;margin-bottom:5px;font-size:11px"><strong>${plainLang(f)}</strong></div>`;
  }).join('');

  // DQ summary
  if (dq.dq_summary && dq.dq_summary !== 'Data quality acceptable.') {
    const s = document.getElementById('f-dq-summary'); s.textContent = dq.dq_summary; s.style.display = 'block';
  }

  // Coverage stats
  const canWeeks = weeks.filter(w => w.can_data_source === 'CAN_GPS_DAILY').length;
  const gpsWeeks = weeks.filter(w => w.can_data_source === 'CAN_GPS_DAILY' || w.can_data_source === 'GPS_DAILY_ONLY').length;
  const sohWeeks = weeks.filter(w => w.soh_cap_weekly != null).length;
  document.getElementById('f-can-coverage').textContent = canWeeks + ' / ' + weeks.length + ' wks';
  document.getElementById('f-gps-coverage').textContent = gpsWeeks + ' / ' + weeks.length + ' wks';
  const gapW = dq.can_gap_weeks || 0;
  const gapEl = document.getElementById('f-can-gap');
  gapEl.textContent = gapW > 0 ? gapW + ' weeks' : 'None';
  gapEl.style.color = gapW >= 4 ? '#E24B4A' : gapW >= 2 ? '#d97706' : 'var(--grn)';
  document.getElementById('f-soh-weeks').textContent = sohWeeks + ' / ' + weeks.length + ' wks';
  document.getElementById('f-soh-weeks').style.color = sohWeeks === 0 ? '#E24B4A' : 'var(--text)';

  // Timeline bars
  const tl = document.getElementById('f-timeline'); tl.innerHTML = '';
  weeks.forEach(w => {
    const d = document.createElement('div');
    let bg = '#DDD', tt = 'W' + w.week_number;
    if (!w.km_per_soc_pct && w.week_number <= 3) { bg = '#DDD'; tt += ' ramp-up'; }
    else if (w.can_data_source === 'CAN_GPS_DAILY') { bg = '#1A7A4A'; tt += ' CAN+GPS'; }
    else if (w.can_data_source === 'GPS_DAILY_ONLY') { bg = '#EF9F27'; tt += ' GPS only'; }
    else { bg = '#E24B4A'; tt += ' No data'; }
    if (w.cell_spread_max > 150) tt += ' | spread>150mV';
    d.style.cssText = 'width:14px;height:22px;background:'+bg+';border-radius:2px;flex-shrink:0';
    d.title = tt;
    tl.appendChild(d);
  });

  // Charts
  const labels = weeks.map(w => 'W'+w.week_number);
  const cOpts = {responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:8},maxRotation:0,maxTicksLimit:14},grid:{display:false}},y:{ticks:{font:{size:8}},grid:{color:'rgba(0,0,0,0.04)'}}}};

  ['f-chart-eff','f-chart-spread','f-chart-voltage','f-chart-usage'].forEach(id => { const c=document.getElementById(id); if(c&&c._fChart){try{c._fChart.destroy();}catch(e){}} });

  const _fEnough = weeks && weeks.length >= 2;
  const _fEmpty = '<p class="empty-small">Not enough data yet — builds after 2+ weeks.</p>';

  const effC = document.getElementById('f-chart-eff');
  if (!_fEnough) { if (effC && effC.parentElement) effC.parentElement.innerHTML = _fEmpty; }
  else effC._fChart = new Chart(effC, {type:'line',data:{labels,datasets:[{data:weeks.map(w=>w.km_per_soc_pct),borderColor:'#1A4E8C',backgroundColor:'rgba(26,78,140,0.08)',borderWidth:1.5,pointRadius:1.5,fill:true,spanGaps:true}]},options:cOpts});

  const spC = document.getElementById('f-chart-spread');
  if (!_fEnough) { if (spC && spC.parentElement) spC.parentElement.innerHTML = _fEmpty; }
  else spC._fChart = new Chart(spC, {type:'bar',data:{labels,datasets:[{data:weeks.map(w=>w.cell_spread_max),backgroundColor:weeks.map(w=>(w.cell_spread_max||0)>150?'rgba(226,75,74,0.6)':(w.cell_spread_max||0)>100?'rgba(239,159,39,0.6)':'rgba(26,122,74,0.6)'),borderWidth:0}]},options:cOpts});

  const vC = document.getElementById('f-chart-voltage');
  if (!_fEnough) { if (vC && vC.parentElement) vC.parentElement.innerHTML = _fEmpty; }
  else vC._fChart = new Chart(vC, {type:'line',data:{labels,datasets:[{data:weeks.map(w=>w.voltage_min),borderColor:'#6B21A8',backgroundColor:'rgba(107,33,168,0.08)',borderWidth:1.5,pointRadius:1.5,fill:true,spanGaps:true,pointBackgroundColor:weeks.map(w=>w.voltage_min&&w.voltage_min<48?'#E24B4A':'#6B21A8')}]},options:cOpts});

  const uC = document.getElementById('f-chart-usage');
  if (!_fEnough) { if (uC && uC.parentElement) uC.parentElement.innerHTML = _fEmpty; }
  else uC._fChart = new Chart(uC, {type:'bar',data:{labels,datasets:[{label:'km',data:weeks.map(w=>w.km_sum),backgroundColor:'rgba(26,78,140,0.45)',borderWidth:0,yAxisID:'y'},{label:'trips',type:'line',data:weeks.map(w=>w.trip_count),borderColor:'#EF9F27',borderWidth:1.5,pointRadius:1.5,yAxisID:'y2',spanGaps:true}]},options:{...cOpts,plugins:{legend:{display:true,labels:{font:{size:8}}}},scales:{x:{ticks:{font:{size:8},maxRotation:0,maxTicksLimit:14},grid:{display:false}},y:{position:'left',ticks:{font:{size:8}},grid:{color:'rgba(0,0,0,0.04)'}},y2:{position:'right',ticks:{font:{size:8}},grid:{drawOnChartArea:false}}}}});

  // Findings
  const findings = [];
  if (gapW >= 4) findings.push({sev:'critical',title:'IoT/CAN device failure — '+gapW+'-week gap',evidence:'CAN stopped at Week '+dq.can_last_week+'. GPS continued to Week '+dq.gps_last_week+'.',impl:'Vehicle is operating (GPS confirms) but BMS/IoT stopped transmitting. Cell-level signals missing after Week '+dq.can_last_week+'.',action:'Investigate IoT hardware. Check SIM and BMS firmware. Re-run pipeline once CAN restored.'});
  if (sohWeeks === 0 && weeks.length > 0) findings.push({sev:'critical',title:'soh_cap_weekly NULL for all '+weeks.length+' weeks',evidence:'No single week has soh_cap_weekly computed.',impl:'RUL model requires soh_cap as top feature. Any RUL figure is mathematically hollow without SOH trajectory.',action:'Do not use RUL for this battery. Restore CAN, recompute VWF, re-score.'});
  const critSpread = weeks.filter(w=>w.cell_spread_max>150).length;
  if (critSpread > 3) findings.push({sev:'warn',title:'Cell spread >150mV CRITICAL in '+critSpread+'/'+weeks.length+' weeks',evidence:'Elevated cell imbalance detected.',impl:'Physical cell balance check recommended.',action:'If spread persists after one charge cycle, escalate to service.'});
  if (events.length === 0 && weeks.length > 8) findings.push({sev:'info',title:'Zero events detected',evidence:'vehicle_events has 0 rows for this battery.',impl:gapW>=2?'Absence of events may be artefact of missing CAN data, not genuine absence of anomalies.':'No anomalies detected across all monitored thresholds.',action:gapW>=2?'Re-run event detection after CAN is restored.':'Normal operations. Continue monitoring.'});
  if (!findings.length) findings.push({sev:'info',title:'No significant data quality issues',evidence:'CAN coverage and feature completeness within normal range.',impl:'Score is based on real telemetry.',action:'Normal monitoring applies.'});

  document.getElementById('f-findings').innerHTML = findings.map(f => {
    const bg = f.sev==='critical'?'rgba(226,75,74,0.06)':f.sev==='warn'?'rgba(239,159,39,0.06)':'rgba(55,138,221,0.06)';
    const bc = f.sev==='critical'?'#E24B4A':f.sev==='warn'?'#EF9F27':'#378ADD';
    return `<div style="background:${bg};border-left:3px solid ${bc};border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:7px">
      <div style="font-weight:600;font-size:12px;color:${bc};margin-bottom:3px">${f.title}</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:2px"><strong>Evidence:</strong> ${f.evidence}</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:2px"><strong>Implication:</strong> ${f.impl}</div>
      <div style="font-size:11px;color:var(--text2)"><strong>Action:</strong> ${f.action}</div></div>`;
  }).join('');

  // Events with reliability
  const evtEl = document.getElementById('f-events-container');
  if (events.length > 0) {
    const rc = {HIGH:'var(--grn)',MEDIUM:'#d97706',LOW:'#E24B4A',SUPPRESSED:'#E24B4A'};
    evtEl.innerHTML = events.map(ev => `<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bg3);font-size:11px">

// Resolve the action code using scoring_conflict_note overrides.
// Never falls back to action_primary (Rule 207 deprecated).
function resolveAction(bat) {
  if (!bat) return null;
  const note = bat.scoring_conflict_note || '';
  if (note.includes('REPLACE_URGENT') || note.includes('SOH-FIX')) return 'EXIT_NOW';
  if (note.includes('RUL<4wk') || note.includes('C13'))            return 'EXIT_NOW';
  if (note.includes('REPLACE_PLAN') || note.includes('C11'))       return 'REPLACE_PLAN';
  return bat.rul_action_v2 || null;
}
// Translate scoring_conflict_note codes to plain English for end-user display.
function translateConflictNote(note) {
  if (!note) return null;
  let plain = String(note);
  // Longest-first to avoid partial overlaps (e.g. REPLACE_URGENT inside SOH-FIX)
  const keys = Object.keys(CONFLICT_PLAIN).sort((a, b) => b.length - a.length);
  keys.forEach(code => {
    const rx = new RegExp(code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    plain = plain.replace(rx, CONFLICT_PLAIN[code]);
  });
  // Strip remaining raw uppercase tokens (4+ chars — catches CRITICAL, NO_ACTION, etc.
  // while preserving short strings like SoH/RUL that appear in the already-translated text).
  plain = plain.replace(/\b[A-Z][A-Z0-9_]{3,}\b/g, '');
  // Strip leftover inequality/plus clauses (e.g. "CRITICAL+SOH<60+RUL<=4" remnant)
  plain = plain.replace(/\+?\b(SOH|RUL|EFC|AHI|DRI)\s*[<>=]+\s*\d+/gi, '');
  plain = plain.replace(/\u2192/g, '\u2014')
               .replace(/:\s*\./g, '.')   // tidy translated colon-then-period joins
               .replace(/\s*\u2014\s*/g, ' \u2014 ')
               .replace(/\s{2,}/g, ' ')
               .trim();
  // If every code was translated, the result may still start with a colon — drop it.
  if (plain.startsWith(':')) plain = plain.slice(1).trim();
  return plain || null;
}

  const iot = (bat && bat.iot_device_health) || '';

}
// Guard: SoH values > 100% are physics violations. Return null so UI can show dash.
function safeSoh(val) {

  if (n > 100) return null;

}

  h += '<div id="stk-intel-panel">';
  h += '<div style="display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap">';
  types.forEach((t,i) => {
    const a = i===0;
    h += `<button onclick="switchStkView('${t}')" class="stk-btn" data-stk="${t}" style="padding:4px 10px;border-radius:14px;border:1px solid ${a?'#0E7C7B':'#ddd'};background:${a?'#0E7C7B':'#FAFAF5'};color:${a?'#fff':'#1a2332'};font-size:10px;font-weight:600;cursor:pointer">${STK_PLAIN[t]}</button>`;
  });
  h += '</div>';

  types.forEach((t,i) => {
    const a = attMap[t] || {};
    const lv = a.attention_level || 'NONE';
    const reason = a.attention_reason || '--';
    h += `<div class="stk-view" data-stk="${t}" style="display:${i===0?'block':'none'}">`;
    h += `<div style="background:var(--bg1);border:1px solid var(--bg3);border-radius:8px;padding:12px 14px;margin-bottom:8px">`;
    h += `<div style="margin-bottom:6px">${attBadge(lv)}</div>`;
    h += `<div style="font-size:12px;color:var(--text);line-height:1.5">${reason}</div>`;
    h += `<div style="font-size:10px;color:var(--text3);margin-top:4px">${a.time_sensitivity?'Time: '+a.time_sensitivity:''} ${a.primary_signal?'\u00B7 Signal: '+a.primary_signal:''}</div>`;
    h += '</div>';
    // Audience-specific intelligence
    let intel = '';
    if (t==='OPERATOR') intel = cc.asset_impact_sentence || cc.operator_consequence_sentence || '';
    else if (t==='DRIVER') intel = cc.customer_sat_sentence || '';
    else if (t==='SERVICE_CO') intel = (cc.action_remark || resolveAction(cc) || '');
    else if (t==='NBFC') intel = (cc.nbfc_sentence||'') + (cc.nbfc_recovery_note?' '+cc.nbfc_recovery_note:'');
    else if (t==='BATTERY_OEM') intel = cc.battery_oem_sentence || '';
    else if (t==='VEHICLE_OEM') intel = cc.vehicle_oem_sentence || '';
    else if (t==='DEALER') intel = cc.action_remark || '';
    if (intel) h += `<div style="font-size:11px;color:var(--text2);line-height:1.5;padding:8px 12px;background:var(--bg2);border-radius:8px;margin-bottom:8px">${intel}</div>`;
    h += '</div>';
  });
  h += '</div>';
  return h;
}

// ── Service: Fault Header + Action + Observations ──
function renderFaultService(cc, obs) {
  if (!cc) return '';
  const fs = cc.fault_severity || 'NONE';
  const ft = FAULT_PLAIN[cc.fault_type] || cc.fault_type || 'Unknown';
  const fc = FAULT_COLORS[fs] || '#9ca3af';
  const fsp = FAULT_SEV_PLAIN[fs] || 'Monitoring';
  const act = ACTION_PLAIN[resolveAction(cc)] || 'Unknown';
  const corrVerdictMap = {PHYSICS_CONFIRMED:'High confidence',PROGRESSIVE:'Moderate confidence',STRONG:'High confidence',MODERATE:'Moderate confidence',WEAK_SIGNAL:'Low confidence \u2014 treat as directional',WEAK:'Low confidence \u2014 treat as directional',UNCONFIRMED:'Confidence not computed'};
  const corrPlain = corrVerdictMap[cc.corroboration_verdict] || cc.corroboration_verdict || 'Confidence not computed';

  let h = '';
  // Fault header
  h += `<div class="card" style="border-left:4px solid ${fc};margin-bottom:12px">`;
  h += `<div style="display:flex;justify-content:space-between;align-items:center">`;
  h += `<div style="font-family:var(--font-display);font-size:16px;font-weight:600;color:${fc}">${fsp} <span style="font-weight:400;color:var(--text-muted)">\u2014 ${ft}</span></div>`;
  h += `<div style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted)">${cc.fault_recurrence_count?'Seen '+cc.fault_recurrence_count+'\u00D7':''} ${cc.fault_duration_weeks?' \u00B7 '+cc.fault_duration_weeks+' wks':''}</div>`;
  h += '</div></div>';

  // Action card
  h += `<div class="card" style="border-left:4px solid ${fc};margin-bottom:12px">`;
  h += `<div style="font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px">${act}</div>`;
  if (cc.action_remark) h += `<div style="font-size:13px;color:var(--text-muted);line-height:1.6">${cc.action_remark}</div>`;
  h += `<div style="font-size:11px;color:var(--text-faint);margin-top:8px">Confidence: ${corrPlain}</div>`;
  h += '</div>';

  // Observations
  if (obs && obs.length) {
    h += '<div class="sec-l">\u25C8 Observation History</div>';
    obs.slice(0,5).forEach(o => {
      const sevCol = o.warranty_relevant ? '#ef4444' : '#f59e0b';
      h += `<div style="background:var(--bg1);border:1px solid var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:6px">`;
      h += `<div style="display:flex;justify-content:space-between;align-items:center">`;
      h += `<div><span style="font-size:9px;padding:2px 6px;border-radius:8px;background:${sevCol}18;color:${sevCol};font-weight:600">${o.warranty_relevant?'WARRANTY':'INFO'}</span> <span style="font-size:11px;font-weight:600">${(o.observation_type||'').replace(/_/g,' ')}</span></div>`;
      h += `<span style="font-size:10px;color:var(--text3)">${(o.created_at||'').slice(0,10)}</span>`;
      h += '</div>';
      if (o.observation_sentence) h += `<div style="font-size:11px;color:var(--text2);margin-top:4px">${(o.observation_sentence||'').slice(0,120)}</div>`;
      h += '</div>';
    });
  }
  return h;
}

// ── SHAP Bars (Section 7) ──
function renderShapBars(cc) {
  if (!cc) return '';
  if (!cc.shap_top1_feature) {
    let h = `<div class="section-label">Attribution</div><div style="font-size:13px;color:#6b7280">Detailed attribution unavailable for this battery tier.</div>`;
    if (cc.operator_attribution_sentence) h += `<div style="font-size:13px;color:#6b7280;font-style:italic;margin-top:8px">${cc.operator_attribution_sentence}</div>`;
    return h;
  }
  let h = '<div class="section-label">Top signals driving this battery\'s trajectory</div>';
  h += '<div class="card" style="margin-bottom:12px">';
  const features = [
    {f:cc.shap_top1_feature, p:cc.shap_top1_pct},
    {f:cc.shap_top2_feature, p:cc.shap_top2_pct},
    {f:cc.shap_top3_feature, p:cc.shap_top3_pct}
  ].filter(x => x.f);
  features.forEach(({f,p}) => {
    const pct = Math.round(p||0);
    h += `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:500">${shapFeaturePlain(f)}</span><span style="font-family:var(--font-mono);font-size:12px;color:#6b7280">${pct}%</span></div>`;
    h += `<div style="background:rgba(0,0,0,0.06);border-radius:3px;height:6px;margin-top:4px"><div style="height:6px;border-radius:3px;background:#f97316;width:${Math.min(pct,100)}%"></div></div></div>`;
  });
  if (cc.shap_explanation_sentence) h += `<div style="font-size:13px;color:#6b7280;font-style:italic;margin-top:8px">${cc.shap_explanation_sentence}</div>`;
  const _method = cc.shap_attribution_method;
  const _methodPlain = _method ? (_method.startsWith('LightGBM') ? _method.replace(/_/g,' ') : _method.replace(/_/g,' ')) : 'LightGBM SHAP \xB7 R\xB2=0.816';
  h += `<div style="font-family:var(--font-mono);font-size:11px;color:#9ca3af;margin-top:8px">${_methodPlain}</div>`;
  h += '</div>';
  return h;
}

// Global stakeholder view switcher
function switchStkView(type) {
  document.querySelectorAll('.stk-btn').forEach(b => {
    const sel = b.dataset.stk === type;
    b.style.background = sel ? '#0E7C7B' : '#FAFAF5';
    b.style.color = sel ? '#fff' : '#1a2332';
    b.style.borderColor = sel ? '#0E7C7B' : '#ddd';
  });
  document.querySelectorAll('.stk-view').forEach(d => {
    d.style.display = d.dataset.stk === type ? 'block' : 'none';
  });
}

async function renderAttribution() {
  const el = document.getElementById('tab-content');
  if (!S.bat) { el.innerHTML = emptyState('Select a battery','Choose a battery to view attribution.'); return; }
  el.innerHTML = '<div class="loading">Loading attribution...</div>';

  const [bat, attr] = await Promise.all([
    get('/api/battery/' + S.bat).catch(()=>null),
    get('/api/battery/' + S.bat + '/attribution?audience=oem').catch(()=>null),
  ]);

  if (!bat) { el.innerHTML = emptyState('Battery data unavailable',''); return; }

  let h = '';
  const isPack3401 = (bat.battery_model||'').includes('3401');
  const isException = isPack3401 || (attr && attr.attribution_mode === 'PACK_GAP_EXCEPTION');

  if (isException) {
    const noteText = (attr && (attr.pack_gap_note || attr.oem_narrative)) || 'Pack3401 shows an intrinsic design gap confirmed across the fleet. Degradation rate 6\xD7 Pack3001 (\u22120.0077/wk vs \u22120.0013/wk). Operator behaviour signals are within fleet norms. OEM investigation active.';
    h += `<div style="background:#FFF7ED;border:1px solid #FED7AA;border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 18px;margin-bottom:14px">
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px">PACK_GAP_EXCEPTION \xB7 Attribution not computed</div>
      <div style="font-size:13px;color:#374151;line-height:1.7;margin-bottom:12px">${noteText}</div>
      <div class="g3">
        <div style="background:#fff;border:1px solid #FED7AA;border-radius:6px;padding:8px 10px;text-align:center"><div style="font-size:9px;color:var(--text3)">Operator-attributable</div><div style="font-size:18px;font-weight:600;color:var(--text3)">\u2014</div></div>
        <div style="background:#fff;border:1px solid #FED7AA;border-radius:6px;padding:8px 10px;text-align:center"><div style="font-size:9px;color:var(--text3)">OEM-attributable</div><div style="font-size:18px;font-weight:600;color:var(--text3)">\u2014</div></div>
        <div style="background:#fff;border:1px solid #FED7AA;border-radius:6px;padding:8px 10px;text-align:center"><div style="font-size:9px;color:var(--text3)">Warranty eligible</div><div style="font-size:18px;font-weight:600;color:var(--grn)">${(attr && attr.warranty_claim_eligible === 1) ? 'YES' : (bat.warranty_claim_eligible === 1 ? 'YES' : '\u2014')}</div></div>
      </div>
    </div>`;
  } else if (attr) {
    const primary = attr.primary_driver_plain || attr.primary_factor || '\u2014';
    h += `<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px">Primary driver: ${primary}</div>`;

    // Accept both shapes: flat charging_pct etc OR nested factors dict
    const fac = (attr.factors && typeof attr.factors === 'object') ? attr.factors : null;
    const read = (flatKey, nestedKey) => {
      if (attr[flatKey] != null) return attr[flatKey];
      if (fac && fac[nestedKey] != null) return fac[nestedKey];
      return 0;
    };
    const factors = [
      { label:'Charging',       v: read('charging_pct',    'charging'),    color:'#f97316' },
      { label:'Usage',          v: read('usage_pct',       'usage'),       color:'#3b82f6' },
      { label:'Maintenance',    v: read('maintenance_pct', 'maintenance'), color:'#f59e0b' },
      { label:'Thermal',        v: read('thermal_pct',     'thermal'),     color:'#ef4444' },
      { label:'OEM / Calendar', v: read('oem_pct',         'calendar'),    color:'#9ca3af' },
    ];
    h += '<div style="margin-bottom:14px">';
    factors.forEach(f => {
      const pct = Math.min(35, Math.round(f.v));
      h += `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;color:var(--text)">${f.label}</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text2)">${pct}%</span></div><div style="height:8px;background:var(--bg3);border-radius:4px"><div style="height:100%;width:${pct}%;background:${f.color};border-radius:4px;transition:width 0.4s ease"></div></div></div>`;
    });
    h += '</div>';

    h += `<span onclick="toggleDPP(this)" style="font-size:10px;color:var(--text3);cursor:pointer;font-family:var(--font-mono)">\u25BE Data provenance</span><div class="dpp-panel">Source: battery_degradation_attribution \xB7 Mode: ${attr.attribution_method || 'RULE_BASED_V1'} \xB7 SHAP deprecated: negative R\xB2 on honest temporal splits (Rule 233) \xB7 Validated fleet physics Q1 2026 \xB7 No factor exceeds 35% cap (multi-causal)</div>`;
  } else {
    h += emptyState('Attribution unavailable','No attribution data for this battery.');
  }

  el.innerHTML = h;
}

async function renderDecisions() {
  const el = document.getElementById('tab-content');
  if (!S.bat) { el.innerHTML = emptyState('Select a battery','Choose a battery to view decisions.'); return; }
  el.innerHTML = '<div class="loading">Loading decisions...</div>';

  const [bat, rul, ctx, svc] = await Promise.all([
    get('/api/battery/' + S.bat).catch(()=>null),
    get('/api/battery/' + S.bat + '/rul-detail').catch(()=>null),
    get('/api/battery/' + S.bat + '/contextual-scores').catch(()=>null),
    get('/api/battery/' + S.bat + '/service').catch(()=>null),
  ]);

  if (!bat) { el.innerHTML = emptyState('Battery data unavailable',''); return; }

  let h = '';

  // ── CARD 1: RUL Action ──
  const actionKey = resolveAction(bat) || (rul && rul.rul_action) || '';
  const action = (typeof ACTION_PLAIN !== 'undefined' && ACTION_PLAIN[actionKey]) || actionKey || '\u2014';
  h += `<div class="card" style="border-left:4px solid var(--amb);background:#fffbeb;margin-bottom:14px"><div class="card-title">Recommended Action</div><div style="font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px">${action}</div>`;

  if (rul) {
    const readProb = (keyA, keyB) => (rul[keyA] != null ? rul[keyA] : (rul[keyB] != null ? rul[keyB] : 0));
    const rows = [
      ['4 weeks',  readProb('breach_prob_4wk',  'range_floor_breach_prob_4wk')],
      ['8 weeks',  readProb('breach_prob_8wk',  'range_floor_breach_prob_8wk')],
      ['12 weeks', readProb('breach_prob_12wk', 'range_floor_breach_prob_12wk')],
    ];
    h += '<div style="margin:10px 0">';
    rows.forEach(r => {
      const pct = Math.round((r[1] ?? 0) * 100);
      const col = pct >= 70 ? 'var(--red)' : pct >= 40 ? 'var(--amb)' : 'var(--grn)';
      h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:11px;color:var(--text2);min-width:60px">${r[0]}</span><div style="flex:1;height:8px;background:var(--bg3);border-radius:4px"><div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div><span style="font-family:var(--font-mono);font-size:11px;color:${col};min-width:36px">${pct}%</span></div>`;
    });
    h += '</div>';
  }

  // Fix 11 (2E): RUL data provenance toggle
  h += `<span onclick="toggleDPP(this)" style="font-size:10px;color:var(--text3);cursor:pointer;font-family:var(--font-mono);display:block;margin-top:8px">\u25BE RUL data provenance</span><div class="dpp-panel">Trigger: MIN(range_floor_weeks, soh_floor_weeks) \xB7 Distribution: STABLE=198, RANGE=119, SOH=10, RANGE_RECOMPUTED=2 \xB7 9 of 30 field-confirmed outcomes \xB7 P10/P90 bands heuristic until 30 outcomes confirmed \xB7 PRELIMINARY \u2014 not for contractual use \xB7 Rule C09</div>`;

  h += '<div style="font-size:10px;color:var(--text3);margin-top:6px">9 of 30 field outcomes confirmed. Directional \u2014 not for contractual use. Conformal calibration pending.</div></div>';

  // ── CARD 2: Warranty Assessment ──
  const eligible = bat.warranty_claim_eligible === 1;
  h += `<div class="card" style="border-left:4px solid var(--blue);background:#eff6ff;margin-bottom:14px"><div class="card-title">Warranty Assessment</div>`;

  if (eligible) {
    h += `<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#92400e;font-weight:600">\u26A0 Warranty claim eligible</div>`;
  }

  const checks = [
    ['Battery chemistry',   bat.chemistry_integrity_ok !== false],
    ['Cell imbalance',     (bat.cell_spread_max ?? 0) < 150],
    ['Charging compliance', bat.charger_type_inferred !== 'NON_STANDARD'],
    ['Thermal events',     (bat.critical_temp_weeks ?? 0) < 4],
    ['Physical damage',     bat.physical_damage_flag !== 1],
    ['Service compliance',  bat.service_profile !== 'NEGLIGENT'],
  ];
  h += '<div style="margin-bottom:10px">';
  checks.forEach(c => {
    const col = c[1] ? 'var(--grn)' : 'var(--red)';
    h += `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bg3)"><span style="color:${col};font-size:14px;min-width:16px">${c[1] ? '\u2713' : '\u2717'}</span><span style="font-size:12px;color:var(--text)">${c[0]}</span></div>`;
  });
  h += '</div>';

  // ── Fix 5 (2E): EFC consumed vs warranty limit ──
  {
    const _efc = bat.efc_cumulative;
    const _efcLimit = bat.warranty_efc_limit != null ? bat.warranty_efc_limit : 1200;
    if (_efc != null) {
      const _efcPct = Math.round((_efc / _efcLimit) * 100);
      const _efcCol = _efcPct > 80 ? 'var(--red)' : _efcPct > 60 ? 'var(--amb)' : 'var(--grn)';
      h += `<div style="margin:10px 0;padding:8px 12px;background:var(--bg2);border-radius:6px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:var(--text2)">EFC consumed</span><span style="font-family:var(--font-mono);font-size:11px;color:${_efcCol}">${Math.round(_efc)} of ${_efcLimit}</span></div><div style="height:6px;background:var(--bg3);border-radius:3px"><div style="height:100%;width:${Math.min(_efcPct,100)}%;background:${_efcCol};border-radius:3px"></div></div><div style="font-size:10px;color:var(--text3);margin-top:4px">${_efcPct}% of warranty EFC limit consumed. Calendar gate (36 months) may be binding gate.</div></div>`;
    }
  }

  if (eligible) {
    h += `<button style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Generate evidence pack \u2192</button><div style="font-size:10px;color:var(--text3);margin-top:4px">AG-1 \u2014 Evidence pack generation (coming soon)</div>`;
  }

  if (bat.charger_type_inferred === 'NON_STANDARD') {
    h += `<div style="margin-top:8px;font-size:11px;color:var(--red)">Void risk: Non-standard charger detected. ${bat.non_standard_charger_sessions ?? '\u2014'} sessions. Warranty clause 4.3 may apply.</div>`;
  }
  h += '</div>';

  // ── CARD 3: Replacement Economics ──
  if (ctx) {
    const fmtINR = v => (v != null && !isNaN(v)) ? '\u20B9' + Math.round(v).toLocaleString('en-IN') : '\u2014';
    const winMap = {OPEN:['var(--grn)','Window Open'],CLOSING:['var(--amb)','Window Closing'],CLOSED:['var(--red)','Window Closed']};
    const winKey = ctx.intervention_window || ctx.resale_exit_signal;
    const winVal = winMap[winKey] || (winKey === 'EXIT_NOW' ? ['var(--red)','Window Closing'] : ['var(--text3)','\u2014']);
    const resaleNow = ctx.resale_value_now ?? ctx.resale_now_inr;
    const resale8   = ctx.resale_value_8wk ?? ctx.resale_8wk_inr;
    h += `<div class="card" style="background:var(--bg2);margin-bottom:14px"><div class="card-title">Replacement Economics</div><div class="g3" style="margin-bottom:8px"><div style="text-align:center"><div style="font-size:9px;color:var(--text3)">Resale now</div><div style="font-size:18px;font-weight:600;color:var(--grn)">${fmtINR(resaleNow)}</div></div><div style="text-align:center"><div style="font-size:9px;color:var(--text3)">Resale in 8wk</div><div style="font-size:18px;font-weight:600;color:var(--amb)">${fmtINR(resale8)}</div></div><div style="text-align:center"><div style="font-size:9px;color:var(--text3)">Intervention</div><div style="font-size:14px;font-weight:600;color:${winVal[0]}">${winVal[1]}</div></div></div>${ctx.replacement_economics_sentence ? `<div style="font-size:11px;color:var(--text2)">${ctx.replacement_economics_sentence}</div>` : ''}</div>`;
  }

  // ── Service timeline ──
  const timelineSrc = (svc && (svc.events || svc.service_events || svc.complaints)) || [];
  if (timelineSrc.length) {
    h += '<div class="sec-l">\u25C8 Service history</div>';
    timelineSrc.slice(0,6).forEach(e => {
      const wk = e.week_number ?? '\u2014';
      const label = e.event_plain || e.event_type || e.diagnosis_category || e.complaint_category || '\u2014';
      h += `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--bg3);font-size:11px"><span style="color:var(--text3);font-family:var(--font-mono);min-width:48px">Wk ${wk}</span><span style="color:var(--text)">${label}</span></div>`;
    });
  }

  el.innerHTML = h;
}

function afterRender(tab) {
  const el = document.getElementById('tab-content');
  if (tab === 'summary') { renderSummary(); return; }
  if (tab === 'health') { renderHealth(); return; }
  if (tab === 'alerts') { renderAlerts(); return; }
  if (tab === 'predictions') { renderPredictions(); return; }
  if (tab === 'events') { renderEvents(); return; }
  if (tab === 'deepdive') { renderHealth(); return; }
  if (tab === 'service') { renderService(); return; }
  if (tab === 'dekf') { renderDEKF(); return; }
  if (tab === 'scorelab') { renderScoreLab(); return; }
  if (tab === 'forensic') { renderScoreLab(); return; }
  if (tab === 'attribution') { renderAttribution(); return; }
  if (tab === 'decisions') { renderDecisions(); return; }
  if (tab === 'profile') { renderProfile(); return; }
  if (tab === 'analytics') { renderAnalytics(); setTimeout(()=>{updateAnalyticsChart();updateAxisObjective();},80); return; }
  if (tab === 'reference') { renderReference(); return; }
  if (tab === 'config') {
    if (!new URLSearchParams(location.search).get('internal')) {
      el.innerHTML = emptyState('Internal use only', 'Add ?internal=true to URL to access config.');
      return;
    }
    renderConfig(); return;
  }
  el.innerHTML = emptyState(tab, 'Unknown tab.');
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  // Read URL params
  const p = new URLSearchParams(location.search);
  if (p.get('chem')) S.chem = p.get('chem');
  if (p.get('oem')) S.oem = p.get('oem');
  if (p.get('bat')) S.bat = p.get('bat');
  const context = p.get('context');
  if (context) S.context = context;
  const packParam = p.get('pack');
  if (packParam) S._initPack = packParam;
  const quadrantParam = p.get('quadrant');
  if (quadrantParam) S._initQuadrant = quadrantParam;
  const tabParam = p.get('tab');
  if (tabParam) S._initTab = tabParam;

  // Set chemistry pills
  document.querySelectorAll('.chem-pill').forEach(b =>
    b.classList.toggle('active', b.dataset.chem === S.chem)
  );

  // Health check
  const h = await get('/api/health');
  setOnline(!!h);

  // Sprint 2D Fix 9: cache current pipeline week for staleness display.
  try {
    const st = await get('/api/fleet/status');
    if (st && st.current_week) S.fleetCurrentWeek = st.current_week;
  } catch (e) { /* pill keeps showing raw week number */ }

  // Sprint 5 Route 7: Fleet view link is always visible — oem_v3.html now
  // ships. The Sprint 2D HEAD probe that previously hid the link has been
  // removed; nothing needs to override showTab.

  // Load OEMs and batteries
  await loadOEMs();
  await loadBatteries();
  loadFleetStatusBar();

  // Apply stored filters from URL
  if (S._initPack) {
    const packSel = document.getElementById('pack-filter');
    if (packSel) { packSel.value = S._initPack; applyFilters(); }
  }
  if (S._initQuadrant) {
    window._allBats = (window._allBats || []).filter(b => b.nbfc_quadrant === S._initQuadrant);
    renderBatList(window._allBats);
  }

  // Restore demo mode
  if (localStorage.getItem('enerlytik_demo_mode')) toggleDemo();

  // If battery was in URL, load the tab; otherwise default to BAT_LFP_278
  if (!S.bat) S.bat = 'BAT_LFP_278';
  updateSelectorDisplay(S.bat);
  updateContextBar(S.bat);
  showTab(S.tab);
  if (S._initTab) showTab(S._initTab);
}

// ════════════════════════════════════════════════════════════════
// BHS COMPONENT BREAKDOWN (CHANGE 4)
// ════════════════════════════════════════════════════════════════
async function toggleBHSBreakdown() {
  var el = document.getElementById('bhs-breakdown-panel');
  if (!el) return;
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (el.dataset.loaded) return;
  el.dataset.loaded = '1';

  var d = await get('/api/battery/' + S.bat + '/passport');
  if (!d) { el.innerHTML = '<div style="color:#666;font-size:11px">Unable to load</div>'; return; }

  var comps = [
    ['Cell balance', d.bhs_component_spread, 22.7, '#f97316'],
    ['Measured capacity', d.bhs_component_soh_latest, 17.7, '#3b82f6'],
    ['Capacity trend', d.bhs_component_soh_trend, 15.9, '#14b8a6'],
    ['Cycle wear', d.bhs_component_ah, 16.0, '#f59e0b'],
    ['Range retention', d.bhs_component_pct_comm, 14.7, '#22c55e'],
    ['Efficiency', d.bhs_component_op, 13.0, '#9ca3af']
  ];

  var h = '<div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">BHS Component Breakdown</div>';
  comps.forEach(function(c) {
    var val = c[1] || 0;
    var pct = c[2] > 0 ? (val / c[2] * 100) : 0;
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
    h += '<span style="font-size:10px;color:#999;width:110px;flex-shrink:0">' + c[0] + '</span>';
    h += '<div style="flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden"><div style="width:' + Math.min(pct, 100) + '%;height:100%;background:' + c[3] + ';border-radius:3px"></div></div>';
    h += '<span style="font-size:10px;color:#ccc;width:36px;text-align:right;font-family:\'DM Mono\',monospace">' + val.toFixed(1) + '</span>';
    h += '</div>';
  });
  if (d.bhs_dominant_driver) {
    h += '<div style="font-size:10px;color:#666;margin-top:6px">Weakest signal: ' + (d.bhs_dominant_driver || '--') + '</div>';
  }
  el.innerHTML = h;
}

function toggleDPP(el) {
  const p = el.nextElementSibling;
  const open = p.style.display === 'block';
  p.style.display = open ? 'none' : 'block';
  el.textContent = (open ? '\u25BE' : '\u25B4') + ' Data provenance';
}

// ════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════
window.onload = init;
</script>
