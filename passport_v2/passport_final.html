<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>enerlytik · Battery Passport v2</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@keyframes shimmer {
  0% { background-position: 200% 0 }
  100% { background-position: -200% 0 }
}
.dpp-panel { display:none; background:var(--bg2); border-radius:6px; padding:8px 10px; margin-top:4px; font-size:10px; color:var(--text3); font-family:var(--font-mono); line-height:1.7; }
/* ═══════════════════════════════════════════════════════
   DESIGN SYSTEM — CSS Variables
   ═══════════════════════════════════════════════════════ */
:root {
  /* Palette */
  --bg:         #fafaf8;
  --bg1:        #fafaf8;
  --bg-card:    #ffffff;
  --bg-muted:   #f4f3f0;
  --bg2:        #f4f3f0;
  --bg3:        #e4e2de;
  --text:       #0d0d0b;
  --text2:      #555;
  --text-muted: #6b7280;
  --text3:      #9ca3af;
  --text-faint: #9ca3af;
  --border:     rgba(0,0,0,0.08);
  --border-med: rgba(0,0,0,0.14);
  --accent:     #f97316;
  --accent-soft: rgba(249,115,22,0.08);
  --grn:   #22c55e;
  --red:   #ef4444;
  --amb:   #d97706;
  --blue:  #3b82f6;
  --nav:   #0f172a;

  /* Tier colours */
  --tier-prime:    #14b8a6;
  --tier-stable:   #22c55e;
  --tier-watch:    #f59e0b;
  --tier-stressed: #f97316;
  --tier-critical: #ef4444;

  /* Category colours */
  --cat-rr:           #14b8a6;
  --cat-prime:        #22c55e;
  --cat-operational:  #3b82f6;
  --cat-intervention: #f59e0b;
  --cat-watch:        #f97316;
  --cat-eol:          #ef4444;

  /* Attention / severity */
  --att-gone:     #1e1e1e;
  --att-critical: #ef4444;
  --att-urgent:   #f97316;
  --att-act:      #f59e0b;
  --att-watch:    #3b82f6;
  --att-routine:  #22c55e;
  --att-none:     #94a3b8;

  /* Typography */
  --font-display: 'Outfit', 'DM Sans', system-ui, sans-serif;
  --font-head: 'Outfit', sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'DM Mono', 'Fira Code', ui-monospace, monospace;

  /* Spacing */
  --radius:    8px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --card-pad:  20px 24px;
  --gap:       16px;
}

/* ═══════════════════════════════════════════════════════
   BASE RESET + BODY
   ═══════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  padding-bottom: 50px;
}

/* ═══════════════════════════════════════════════════════
   NAV BAR
   ═══════════════════════════════════════════════════════ */
nav {
  background: var(--nav);
  height: 72px;
  display: flex;
  align-items: center;
  padding: 0 28px;
  justify-content: space-between;
}
.nav-logo {
  font-family: var(--font-head);
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
}
.nav-logo span { color: var(--accent); }
.nav-tag {
  font-size: 10px;
  color: #666;
  font-family: var(--font-mono);
  margin-left: 10px;
  letter-spacing: 0.5px;
}
.nav-r { display: flex; align-items: center; gap: 12px; }

/* Chemistry pills */
.chem-pill {
  padding: 5px 16px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  border: 1px solid #333;
  background: transparent;
  color: #888;
  cursor: pointer;
  transition: all .15s;
}
.chem-pill.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 600;
}
.chem-pill:hover:not(.active) { border-color: #555; color: #ccc; }

/* OEM dropdown (nav) */
.nav-oem {
  padding: 5px 10px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  border: 1px solid #333;
  background: #1a1a14;
  color: #888;
  cursor: pointer;
}

/* API dot */
.api-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  transition: background .3s;
}
.api-dot.online { background: var(--grn); }

.nav-version {
  font-size: 9px;
  color: #555;
  font-family: var(--font-mono);
}

/* ═══════════════════════════════════════════════════════
   OFFLINE BANNER
   ═══════════════════════════════════════════════════════ */
.offline-bar {
  background: #fef3c7;
  color: #92400e;
  text-align: center;
  padding: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  display: none;
}
.offline-bar.show { display: block; }

/* ═══════════════════════════════════════════════════════
   SELECTOR BAR
   ═══════════════════════════════════════════════════════ */
.sel-bar {
  background: var(--bg1);
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--bg3);
  flex-wrap: wrap;
}
.sel-bar select {
  padding: 7px 12px;
  border: 1px solid var(--bg3);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}
.sel-bar select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#bat-sel { min-width: 260px; }
.sel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* Badge (generic) */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.badge-muted { background: var(--bg3); color: var(--text3); }
.badge-accent { background: var(--accent); color: #fff; }

/* Refresh button */
.refresh-btn {
  background: none;
  border: 1px solid var(--bg3);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text3);
  transition: all .15s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ═══════════════════════════════════════════════════════
   TAB BAR
   ═══════════════════════════════════════════════════════ */
.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  padding: 0 28px;
  background: transparent;
  overflow-x: auto;
}
.tab-btn {
  padding: 10px 16px;
  font-family: var(--font-body);
  font-size: 13px;
  color: #6b7280;
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all .15s;
  white-space: nowrap;
  font-weight: 400;
}
.tab-btn.active {
  color: #0d0d0b;
  border-bottom-color: #f97316;
  font-weight: 500;
}
.tab-btn:hover:not(.active) { color: #0d0d0b; }

/* ═══════════════════════════════════════════════════════
   TAB CONTENT AREA
   ═══════════════════════════════════════════════════════ */
#tab-content {
  padding: 20px 28px;
  max-width: 1100px;
  margin: 0 auto;
  min-height: 400px;
}

/* ═══════════════════════════════════════════════════════
   CARD SYSTEM
   ═══════════════════════════════════════════════════════ */
.card {
  background: #fff;
  border: 1px solid var(--bg3);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--accent);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* Grid helpers */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

/* Section label */
.sec-l {
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--accent);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin: 16px 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ═══════════════════════════════════════════════════════
   TIER BADGES
   ═══════════════════════════════════════════════════════ */
.tier-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
}
.tier-PRIME    { background: #dcfce7; color: #166534; }
.tier-STABLE   { background: #dbeafe; color: #1e40af; }
.tier-WATCH    { background: #fef3c7; color: #92400e; }
.tier-STRESSED { background: #ffedd5; color: #9a3412; }
.tier-CRITICAL { background: #fee2e2; color: #991b1b; }

/* ═══════════════════════════════════════════════════════
   SCORE ROWS + SIGNALS + PROXIES
   ═══════════════════════════════════════════════════════ */
.score-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
.score-row:last-child { border-bottom: none; }
.score-label { font-family: var(--font-mono); font-size: 11px; min-width: 140px; color: var(--text2); }
.score-bar { flex: 1; height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 3px; }
.score-val { font-family: var(--font-mono); font-size: 12px; min-width: 40px; text-align: right; }
.signal-card { text-align: center; padding: 14px; }
.signal-val { font-family: var(--font-head); font-size: 24px; font-weight: 700; }
.signal-unit { font-size: 10px; color: var(--text3); }
.signal-delta { font-size: 11px; margin-top: 2px; }

/* ═══════════════════════════════════════════════════════
   PASSPORT HEADER
   ═══════════════════════════════════════════════════════ */
.p-hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 0; gap: 20px; flex-wrap: wrap; }
.serial { font-family: var(--font-head); font-size: 28px; font-weight: 700; }
.p-sub { font-size: 12px; color: var(--text3); margin: 4px 0 8px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ph-r { text-align: right; }
.big-km { font-family: var(--font-head); font-size: 48px; font-weight: 800; color: var(--accent); }
.big-l { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }

/* ═══════════════════════════════════════════════════════
   VERDICT + CHAINS + FEEDBACK
   ═══════════════════════════════════════════════════════ */
.verdict-alert { padding: 14px 18px; border-radius: var(--radius); margin-bottom: 14px; border-left: 4px solid; }
.chain-panel { border-left: 3px solid var(--accent); padding: 10px 14px; background: rgba(249,115,22,0.04); border-radius: 0 8px 8px 0; margin-bottom: 8px; }
.fb-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; }
.fb-sel { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--bg3); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius: 6px; }
.fb-ta { width: 100%; background: #fff; border: 1px solid var(--bg3); color: var(--text); font-size: 11px; padding: 8px 10px; border-radius: 6px; resize: vertical; min-height: 52px; margin-bottom: 7px; font-family: var(--font-body); }
.fb-btn { padding: 7px 20px; background: var(--accent); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
.fb-btn:hover { opacity: 0.9; }

/* ═══════════════════════════════════════════════════════
   SIGNAL CARDS (Phase 1)
   ═══════════════════════════════════════════════════════ */
.sig-card { background: #fff; border: 1px solid var(--bg3); border-radius: var(--radius); padding: 14px 12px; }
.sig-label { font-family: var(--font-mono); font-size: 9px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
.sig-value { font-family: var(--font-head); font-size: 22px; font-weight: 700; line-height: 1.2; }
.sig-unit { font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-left: 2px; }
.sig-vs { font-family: var(--font-mono); font-size: 10px; margin-top: 3px; }
.sig-ctx { font-size: 10px; color: var(--text3); line-height: 1.5; margin-top: 6px; border-left: 2px solid var(--accent); padding-left: 8px; }
.sig-grn { color: var(--grn); }
.sig-amb { color: var(--amb); }
.sig-red { color: var(--red); }
.sig-neutral { color: var(--text2); }
.empty-small { text-align: center; padding: 16px; color: var(--text3); font-size: 11px; font-family: var(--font-mono); }
.scorecard-cell { background: #fff; border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; text-align: center; }
.scorecard-big { font-family: var(--font-head); font-size: 28px; font-weight: 700; line-height: 1.2; }
.scorecard-ctx { font-size: 10px; color: var(--text3); margin-top: 4px; }
.scorecard-trend { font-family: var(--font-mono); font-size: 10px; margin-top: 3px; }

/* ═══════════════════════════════════════════════════════
   EMPTY + LOADING STATES
   ═══════════════════════════════════════════════════════ */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty-msg { font-size: 14px; }
.empty-sub { font-size: 11px; margin-top: 4px; color: var(--text3); }
.loading { text-align: center; padding: 40px; color: var(--text3); font-family: var(--font-mono); font-size: 12px; }

/* ═══════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .p-hdr { flex-direction: column; }
  .ph-r { text-align: left; }
  nav { padding: 0 16px; }
  .sel-bar { padding: 10px 16px; }
  .tab-bar { padding: 0 16px; }
  #tab-content { padding: 16px; }
}

/* ═══════════════════════════════════════════════════════
   DESIGN SYSTEM — Component Classes
   ═══════════════════════════════════════════════════════ */
/* Section label */
.section-label { font-size:10px; font-weight:600; letter-spacing:0.1em;
                 text-transform:uppercase; color:var(--text-muted);
                 margin-bottom:8px; }
/* Lead sentence */
.lead { font-family:var(--font-display); font-size:17px;
        font-weight:500; line-height:1.4; color:var(--text); }
/* Data value */
.data-val { font-family:var(--font-mono); font-size:22px;
            font-weight:500; letter-spacing:-0.02em; }
.data-label { font-size:11px; color:var(--text-muted);
              text-transform:uppercase; letter-spacing:0.06em; }
/* Conflict banner */
.conflict-banner { background:#fef3c7; border-left:3px solid var(--tier-watch);
                   border-radius:0 var(--radius-sm) var(--radius-sm) 0;
                   padding:10px 14px; font-size:13px; margin-bottom:12px; }
/* Micro-tile */
.micro-tile { background:var(--bg-muted); border-radius:var(--radius-sm);
              padding:12px 16px; display:flex; flex-direction:column; gap:4px; }
/* Attribution bar */
.attr-bar-track { background:rgba(0,0,0,0.06); border-radius:4px;
                  height:6px; margin-top:4px; }
.attr-bar-fill  { height:6px; border-radius:4px;
                  background:var(--accent); transition:width 0.4s ease; }
/* SHAP bar */
.shap-track { background:rgba(0,0,0,0.06); border-radius:4px;
              height:8px; margin-top:3px; }
.shap-fill  { height:8px; border-radius:4px;
              background:var(--accent); transition:width 0.5s ease; }
/* Chain connector */
.chain-line  { display:flex; align-items:flex-start; gap:12px; }
.chain-dot   { width:8px; height:8px; border-radius:50%;
               background:var(--accent); margin-top:6px; flex-shrink:0; }
.chain-stem  { width:1px; background:var(--border-med);
               flex-shrink:0; min-height:24px; margin:4px 0 4px 3.5px; }
/* Audience pill */
.aud-pill { display:inline-block; padding:2px 8px; border-radius:12px;
            font-size:10px; font-weight:600; text-transform:uppercase;
            letter-spacing:0.05em; background:var(--accent-soft);
            color:var(--accent); margin-right:6px; flex-shrink:0; }
/* Tier border accent */
.tier-accent { border-left:4px solid var(--tier-stable); }
.tier-accent[data-tier="PRIME"]    { border-left-color:var(--tier-prime); }
.tier-accent[data-tier="STABLE"]   { border-left-color:var(--tier-stable); }
.tier-accent[data-tier="WATCH"]    { border-left-color:var(--tier-watch); }
.tier-accent[data-tier="STRESSED"] { border-left-color:var(--tier-stressed); }
.tier-accent[data-tier="CRITICAL"] { border-left-color:var(--tier-critical); }
/* Card flat */
.card-flat { background:var(--bg-muted); border-radius:var(--radius-md);
             border:none; padding:var(--card-pad); }

/* ── UI-INT + UI-SCORE + UI-COMMS ── */
.hero-dark{background:#0F0800;color:#fff;padding:18px 22px 14px;border-radius:10px;margin-bottom:12px}
.hero-score-num{font-size:56px;font-weight:500;line-height:1;color:#f97316}
.hero-score-denom{font-size:16px;color:#888;font-weight:400}
.hero-narrative{font-size:13px;color:#d1d5db;line-height:1.6;border-top:1px solid #1f1f1f;padding-top:10px;margin-top:8px}
.hero-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;border:none;cursor:pointer}
.act-op{background:#1a3a1a;color:#86efac} .act-nb{background:#1e2a4a;color:#93c5fd} .act-oem{background:#3a1a1a;color:#fca5a5}
.bms-strip{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:11px 15px;display:flex;align-items:center;gap:16px;margin-bottom:10px;font-size:12px}
.bms-gap-badge{display:inline-block;padding:2px 8px;border-radius:4px;background:#fef2f2;color:#dc2626;font-size:10px;font-weight:500;border:1px solid #fecaca}
.causal-card{border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px;border-left:3px solid}
.causal-comp{background:#eff6ff;border-color:#3b82f6} .causal-caus{background:#fff7ed;border-color:#f97316}
.causal-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.causal-comp .causal-label{color:#1d4ed8} .causal-caus .causal-label{color:#c2410c}
.causal-text{font-size:12px;line-height:1.6;color:#374151}
.sec-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;font-weight:500;margin:14px 0 7px}
.score-breakdown-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:13px 15px;margin-bottom:10px}
.score-layer-row{display:grid;grid-template-columns:110px 1fr 38px;align-items:start;gap:10px;margin-bottom:10px}
.score-layer-row:last-of-type{margin-bottom:0}
.sl-label{font-size:11px;color:#6b7280} .sl-weight{font-size:10px;color:#d1d5db}
.sl-bar-track{height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden;margin-bottom:3px}
.sl-bar-fill{height:100%;border-radius:3px}
.sl-explain{font-size:11px;color:#6b7280;line-height:1.5;grid-column:1/-1;margin-top:-6px}
.sl-num{font-size:13px;font-weight:500;text-align:right}
.subsys-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sub-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:0 8px 8px 0;padding:10px 12px;border-left:3px solid #94a3b8}
.sub-card.s-crit{border-left-color:#dc2626;background:#fff8f8} .sub-card.s-warn{border-left-color:#f59e0b;background:#fffdf5}
.sub-card.s-ok{border-left-color:#22c55e;background:#f8fff9} .sub-card.s-info{border-left-color:#94a3b8;background:#f8fafc}
.sub-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sub-name{font-size:11px;font-weight:500;color:#374151;text-transform:uppercase;letter-spacing:.04em}
.sub-status-badge{font-size:10px;font-weight:500;padding:1px 7px;border-radius:10px}
.sb-crit{background:#fef2f2;color:#dc2626} .sb-warn{background:#fffbeb;color:#d97706} .sb-ok{background:#f0fdf4;color:#16a34a} .sb-info{background:#f1f5f9;color:#64748b}
.sub-val{font-size:16px;font-weight:500;color:var(--text);margin-bottom:2px}
.sub-val span{font-size:11px;color:#9ca3af;font-weight:400;margin-left:2px}
.sub-insight{font-size:11px;color:#6b7280;line-height:1.5}
.seasonal-strip{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;font-size:11px;color:#92400e;line-height:1.6}
.rul-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:12px 15px;margin-bottom:10px}
.rul-inner{display:flex;gap:16px;align-items:flex-start}
.rul-num{font-size:32px;font-weight:500;color:#f59e0b;line-height:1} .rul-unit{font-size:12px;color:#9ca3af;margin-top:2px}
.rul-range{font-size:11px;color:#6b7280;margin-top:4px} .rul-text{font-size:12px;color:#374151;line-height:1.6;flex:1}
.case-flag-card{border-radius:0 8px 8px 0;border-left:3px solid #f59e0b;background:#fffbeb;padding:9px 13px;margin-bottom:10px;font-size:11px;color:#92400e;line-height:1.6;cursor:pointer}
/* Audience toggle */
.aud-toggle{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);margin:12px 0 4px}
.aud-btn{padding:6px 14px;font-size:10px;font-family:var(--font-mono);font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,0.4);border:none;transition:all .15s;letter-spacing:.04em}
.aud-btn.active{background:rgba(249,115,22,0.15);color:#f97316} .aud-btn:hover:not(.active){color:rgba(255,255,255,0.7)}
.aud-narrative{padding:14px 18px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.7}
.aud-narrative.aud-op{background:#fff;border:1px solid var(--bg3);color:var(--text)}
.aud-narrative.aud-nb{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.aud-narrative.aud-oem{background:#faf5ff;border:1px solid #e9d5ff;color:#6b21a8}
.nbfc-rating{display:inline-block;font-size:28px;font-weight:800;font-family:var(--font-head);margin-right:8px;vertical-align:middle}
.attr-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px} .attr-bar>div{height:100%}
.score-explain{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.score-explain .se-q{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.score-explain .se-a{font-size:12px;color:var(--text2);line-height:1.7}
/* Score Lab */
.sl-grid-table{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--font-mono)}
.sl-grid-table th{background:#0F0800;color:#fff;padding:6px 8px;font-weight:500;font-size:10px}
.sl-grid-table td{padding:6px 8px;text-align:center;border:1px solid var(--bg3)}
.sl-grid-table .cell-a{background:#FAEEDA} .sl-grid-table .cell-b{background:#FCEBEB}
.sl-grid-table .cell-ok{background:#EAF3DE} .sl-grid-table .cell-bad{background:#fff}
.case-bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.case-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.corr-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.corr-label{width:180px;font-size:11px;color:#374151;flex-shrink:0;text-align:right}
.corr-track{flex:1;height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden}
.corr-fill{height:100%;border-radius:4px}
.corr-val{width:50px;font-size:11px;font-family:var(--font-mono);text-align:right}
.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.arch-card{border:1px solid var(--bg3);border-radius:0 8px 8px 0;padding:12px 14px;border-left:3px solid}
.finding-card{border-radius:0 8px 8px 0;padding:12px 15px;margin-bottom:8px;border-left:3px solid;position:relative}
</style>
</head>

<script>
// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
const API_BASE = '';
const S = {
  chem: 'LFP',
  oem: '',
  bat: null,
  tab: 'summary',
  cache: {},
  online: false,
  batteries: [],
  oems: [],
  demoMode: false,
  context: '',
};

// ════════════════════════════════════════════════════════════════
// API — get / post
// ════════════════════════════════════════════════════════════════
async function get(ep) {
  try {
    const r = await fetch(`${API_BASE}${ep}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    setOnline(true);
    return await r.json();
  } catch (e) {
    console.warn('API', ep, e.message);
    setOnline(false);
    return null;
  }
}

async function post(ep, body) {
  try {
    const r = await fetch(`${API_BASE}${ep}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) return null;
    setOnline(true);
    return await r.json();
  } catch (e) {
    return null;
  }
}

// ════════════════════════════════════════════════════════════════
// ONLINE STATUS
// ════════════════════════════════════════════════════════════════
function setOnline(ok) {
  S.online = ok;
  const dot = document.getElementById('api-dot');
  const bar = document.getElementById('offline-bar');
  if (dot) dot.classList.toggle('online', ok);
  if (bar) bar.classList.toggle('show', !ok);
}

// ════════════════════════════════════════════════════════════════
// STALENESS BADGE
// ════════════════════════════════════════════════════════════════
function updateStaleness(dt) {
  const el = document.getElementById('stale-badge');
  if (!el) return;
  if (!dt) { el.textContent = '—'; el.className = 'badge badge-muted'; return; }
  const days = Math.round((Date.now() - new Date(dt).getTime()) / 86400000);
  el.textContent = days <= 0 ? 'Today' : `${days}d ago`;
  el.style.background = days <= 7 ? '#dcfce7' : days <= 14 ? '#fef3c7' : '#ffedd5';
  el.style.color = days <= 7 ? '#166534' : days <= 14 ? '#92400e' : '#9a3412';
}

// ════════════════════════════════════════════════════════════════
// CACHE KEY
// ════════════════════════════════════════════════════════════════
function cKey(prefix) {
  return `${prefix}_${S.bat}_${S.chem}_${S.oem}`;
}

// ════════════════════════════════════════════════════════════════
// EMPTY STATE HELPER
// ════════════════════════════════════════════════════════════════
function emptyState(msg, sub) {
  return `<div class="empty">
    <div class="empty-icon">⚡</div>
    <div class="empty-msg">${msg}</div>
    ${sub ? '<div class="empty-sub">' + sub + '</div>' : ''}
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// CHEMISTRY SWITCH
// ════════════════════════════════════════════════════════════════
async function setChemistry(c) {
  S.chem = c;
  S.bat = null;
  S.cache = {};
  document.querySelectorAll('.chem-pill').forEach(b =>
    b.classList.toggle('active', b.dataset.chem === c)
  );
  await loadBatteries();
  document.getElementById('tab-content').innerHTML = emptyState('Select a battery', 'Choose from the dropdown above to begin.');
  syncURL();
}

// ════════════════════════════════════════════════════════════════
// OEM FILTER
// ════════════════════════════════════════════════════════════════
async function setOEM(oem) {
  S.oem = oem;
  S.bat = null;
  S.cache = {};
  // Sync both nav and selector OEM dropdowns
  document.querySelectorAll('#nav-oem').forEach(el => el.value = oem);
  await loadBatteries();
  document.getElementById('tab-content').innerHTML = emptyState('Select a battery', 'Filtered by OEM: ' + (oem || 'All'));
  syncURL();
}

// ════════════════════════════════════════════════════════════════
// LOAD OEMs
// ════════════════════════════════════════════════════════════════
async function loadOEMs() {
  // Get distinct OEMs from battery list
  const d = await get('/api/fleet/batteries');
  if (!d) return;
  const list = Array.isArray(d) ? d : d.batteries || [];
  const oems = [...new Set(list.map(b => b.oem_name).filter(Boolean))].sort();
  S.oems = oems;
  const sel = document.getElementById('nav-oem');
  sel.innerHTML = '<option value="">All OEMs</option>';
  oems.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o;
    sel.appendChild(opt);
  });
  if (S.oem) sel.value = S.oem;
}

// ════════════════════════════════════════════════════════════════
// LOAD BATTERIES — searchable combo
// ════════════════════════════════════════════════════════════════
async function loadBatteries() {
  const d = await get('/api/batteries/list');
  if (!d) return;
  let list = Array.isArray(d) ? d : d.batteries || [];
  // Filter by chemistry
  if (S.chem) {
    list = list.filter(b => (b.chemistry || 'LFP') === S.chem);
  }
  // Filter by OEM if set
  if (S.oem) {
    list = list.filter(b => b.oem_name === S.oem);
  }
  S.batteries = list;
  populateBatList(list);
  // Populate pack filter
  const packs = [...new Set(window._allBats.map(b => b.battery_model).filter(Boolean))].sort();
  const packSel = document.getElementById('pack-filter');
  if (packSel) {
    const cur = packSel.value;
    packSel.innerHTML = '<option value="">All packs</option>' + packs.map(p => `<option value="${p}">${p}</option>`).join('');
    if (cur) packSel.value = cur;
  }
  // Populate city filter
  const cities = [...new Set(window._allBats.map(b => b.city).filter(Boolean))].sort();
  const citySel = document.getElementById('city-filter');
  if (citySel) {
    const cur = citySel.value;
    citySel.innerHTML = '<option value="">All cities</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
    if (cur) citySel.value = cur;
  }
  if (S.bat) updateSelectorDisplay(S.bat);
}

function applyFilters() {
  if (!window._allBats) return;
  const pack = document.getElementById('pack-filter')?.value || '';
  const city = document.getElementById('city-filter')?.value || '';
  let filtered = window._allBats;
  if (pack) filtered = filtered.filter(b => (b.battery_model||'') === pack);
  if (city) filtered = filtered.filter(b => (b.city||'') === city);
  if (S.demoMode && window._demoBats) {
    const demoIds = new Set(window._demoBats.map(b => b.battery_id||b));
    filtered = filtered.filter(b => demoIds.has(b.battery_id));
  }
  renderBatList(filtered);
}

async function toggleDemo() {
  const btn = document.getElementById('demo-toggle');
  if (S.demoMode) {
    S.demoMode = false;
    localStorage.removeItem('enerlytik_demo_mode');
    btn.textContent = 'Demo';
    btn.style.background = '';
    btn.style.color = '';
    applyFilters();
    return;
  }
  const d = await get('/api/demo/battery-list').catch(()=>null);
  window._demoBats = d ? (Array.isArray(d) ? d : d.batteries || []) : [];
  S.demoMode = true;
  localStorage.setItem('enerlytik_demo_mode', '1');
  const n = window._demoBats.length;
  btn.textContent = 'DEMO \u00B7 ' + n;
  btn.style.background = 'var(--accent)';
  btn.style.color = '#fff';
  applyFilters();
}

function populateBatList(batteries) {
  window._allBats = batteries;
  renderBatList(batteries);
}

function renderBatList(bats) {
  const list = document.getElementById('bat-list');
  if (!list) return;
  list.innerHTML = '';
  if (bats.length === 0) {
    list.innerHTML = '<div style="padding:10px 12px;color:#888">No batteries match</div>';
    return;
  }
  const groups = {};
  bats.forEach(b => {
    const g = b.chemistry || 'LFP';
    if (!groups[g]) groups[g] = [];
    groups[g].push(b);
  });
  Object.entries(groups).forEach(([chem, items]) => {
    const hdr = document.createElement('div');
    hdr.style.cssText = 'padding:5px 12px;font-size:10px;font-weight:600;' +
      'color:#888;text-transform:uppercase;letter-spacing:.06em;' +
      'background:#f8f8f8;border-top:1px solid #eee;' +
      'position:sticky;top:0';
    hdr.textContent = chem + ' \u2014 ' + items.length + ' batteries';
    list.appendChild(hdr);

    items.forEach(b => {
      const row = document.createElement('div');
      const tierColor = {
        PRIME:'#14b8a6', STABLE:'#22c55e', GOOD:'#22c55e',
        WATCH:'#f59e0b', STRESSED:'#f97316',
        CRITICAL:'#ef4444', INSUFFICIENT_DATA:'#888'
      }[normalizeTier(b.tier_label_v2 || b.tier_v2)] || '#888';

      const dqWarn = b.score_usable_for_decisions === 0 ||
        b.data_quality_verdict === 'SCORE_SUSPENDED' ||
        b.data_quality_verdict === 'IOT_CRITICAL';

      row.style.cssText = 'padding:7px 12px;cursor:pointer;' +
        'border-bottom:1px solid #f0f0f0;' +
        (b.battery_id === S.bat ? 'background:#EAF3DE;' : '') +
        (dqWarn ? 'background:#FFF0EE;' : '');
      row.innerHTML =
        '<div style="display:flex;justify-content:space-between;' +
        'align-items:center;margin-bottom:2px">' +
        '<span style="font-weight:600;color:var(--fg,#1a1a1a)">' +
        b.battery_id + '</span>' +
        '<span style="font-size:10px;padding:1px 6px;border-radius:8px;' +
        'background:' + tierColor + '22;color:' + tierColor + ';' +
        'font-weight:600">' + (b.tier_label_v2 || b.tier_v2 || '\u2014') + '</span>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;' +
        'align-items:center">' +
        '<span style="font-size:11px;color:#888;font-family:monospace">' +
        (b.original_id || '\u2014') + '</span>' +
        (dqWarn
          ? '<span style="font-size:10px;color:#A32D2D;font-weight:600">' +
            '\u26A0 ' + (b.data_quality_verdict || 'DQ issue') + '</span>'
          : '<span style="font-size:11px;color:#888">' +
            Math.round(b.operational_score || 0) + '</span>'
        ) +
        '</div>';

      row.addEventListener('mousedown', () => {
        selectBattery(b.battery_id);
        document.getElementById('bat-search').value =
          b.battery_id + '  ' + (b.original_id || '');
        hideBatList();
      });
      row.addEventListener('mouseover', () =>
        row.style.background = '#f0f4ff');
      row.addEventListener('mouseout', () =>
        row.style.background = dqWarn ? '#FFF0EE' :
          b.battery_id === S.bat ? '#EAF3DE' : '');
      list.appendChild(row);
    });
  });
}

function filterBatList(query) {
  if (!window._allBats) return;
  const q = query.toLowerCase().trim();
  if (!q) { renderBatList(window._allBats); showBatList(); return; }
  const filtered = window._allBats.filter(b =>
    (b.battery_id || '').toLowerCase().includes(q) ||
    (b.original_id || '').toLowerCase().includes(q) ||
    (b.battery_model || '').toLowerCase().includes(q)
  );
  renderBatList(filtered);
  showBatList();
}

function showBatList() {
  const list = document.getElementById('bat-list');
  if (list) list.style.display = 'block';
}

function hideBatList() {
  const list = document.getElementById('bat-list');
  if (list) list.style.display = 'none';
}

function updateSelectorDisplay(batteryId) {
  const input = document.getElementById('bat-search');
  if (!input || !window._allBats) return;
  const bat = window._allBats.find(b => b.battery_id === batteryId);
  if (bat) {
    input.value = bat.battery_id + '  ' + (bat.original_id || '');
  }
}

// ════════════════════════════════════════════════════════════════
// FLEET STATUS BAR (FLEET-UI)
// ════════════════════════════════════════════════════════════════
let _fleetBarExpanded = false;

function toggleFleetStatusBar() {
  _fleetBarExpanded = !_fleetBarExpanded;
  document.getElementById('fleet-status-expanded').style.display =
    _fleetBarExpanded ? 'block' : 'none';
  document.getElementById('fleet-status-chevron').innerHTML =
    _fleetBarExpanded ? '&#x25BC;' : '&#x25B2;';
}

function loadFleetStatusBar() {
  get('/api/fleet/summary?chemistry=' + (S.chem || 'LFP')).then(fs => {
    const fully = fs.fully_scored || 0;
    const caveats = fs.with_caveats || 0;
    const paused = fs.paused || 0;
    const urgent = fs.urgent || 0;
    const soon = fs.attention_soon || 0;

    // Collapsed bar text
    const barEl = document.getElementById('fleet-status-text');
    let txt = fully + ' scored \u00b7 ' + caveats + ' with caveats \u00b7 ' + paused + ' paused';
    txt += ' | ';
    if (urgent > 0) {
      txt += '<span style="background:#ef4444;color:#fff;padding:1px 6px;border-radius:10px;font-size:10px">' + urgent + ' urgent</span>';
    } else {
      txt += '0 urgent';
    }
    txt += ' \u00b7 ' + soon + ' need attention';
    barEl.innerHTML = txt;

    // Expanded panel rows
    document.getElementById('fleet-expanded-row1').textContent =
      'Scoring: ' + fully + ' full \u00b7 ' + caveats + ' caveats \u00b7 ' + paused + ' paused';
    const rest = (fs.total_batteries || 0) - urgent - soon;
    document.getElementById('fleet-expanded-row2').textContent =
      'Actions: ' + urgent + ' urgent \u00b7 ' + soon + ' plan \u00b7 ' + Math.max(0, rest) + ' monitored or stable';
  }).catch(() => {
    document.getElementById('fleet-status-text').textContent = 'Fleet status unavailable';
  });
}

// Auto-refresh fleet status every 5 minutes
setInterval(loadFleetStatusBar, 300000);

// ════════════════════════════════════════════════════════════════
// SELECT BATTERY
// ════════════════════════════════════════════════════════════════
function selectBattery(id) {
  if (!id) return;
  S.bat = id;
  S.cache = {};
  updateSelectorDisplay(id);
  const wkChip = document.getElementById('week-chip');
  if (wkChip) wkChip.textContent = '\u2014';
  syncURL();
  updateContextBar(id);
  showTab(S.tab);
}

async function updateContextBar(id) {
  const bar = document.getElementById('battery-context-bar');
  if (!id) { bar.style.display = 'none'; return; }
  const d = await get('/api/battery/' + id).catch(() => null);
  if (!d) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  document.getElementById('ctx-id').textContent = id;
  document.getElementById('ctx-pack').textContent = d.battery_model || d.pack_model || '';
  document.getElementById('ctx-city').textContent = d.city || '';
  const ctx = d.context || {};
  document.getElementById('ctx-age').textContent = ctx.age_display || '';
  document.getElementById('ctx-km').textContent = ctx.cumulative_km_display || '';
  document.getElementById('ctx-sessions').textContent = ctx.sessions_display || '';
  const ctxWarranty = document.getElementById('ctx-warranty');
  if (ctxWarranty) {
    if (d.warranty_claim_eligible === 1) {
      ctxWarranty.innerHTML = '<span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600;background:#FFF7ED;color:#92400e;border:1px solid #F97316">\u26A0 Warranty claim eligible</span>';
    } else if (d.in_warranty === 1 || d.warranty_status === 'IN_WARRANTY') {
      ctxWarranty.innerHTML = '<span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600;background:#f0fdf4;color:#166534">\u2713 In warranty</span>';
    } else {
      ctxWarranty.innerHTML = '<span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600;background:var(--bg3);color:var(--text3)">Out of warranty</span>';
    }
  }
  const ctxAction = document.getElementById('ctx-action');
  if (ctxAction) {
    const rawAction = resolveAction(d) || '';
    const plainAction = (typeof ACTION_PLAIN !== 'undefined' && ACTION_PLAIN[rawAction]) || '';
    ctxAction.innerHTML = plainAction
      ? `<span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono)">${plainAction}</span>`
      : '';
  }
  const regMap = {PRE_KNEE:['#22c55e','Linear Zone'],APPROACHING_KNEE:['#f59e0b','Watch Zone'],POST_KNEE:['#ef4444','Accelerating'],INSUFFICIENT_HISTORY:['#94a3b8','Early Stage']};
  const reg = regMap[d.degradation_regime] || ['#94a3b8', d.degradation_regime || ''];
  document.getElementById('ctx-regime').innerHTML = '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:' + reg[0] + '18;color:' + reg[0] + '">' + reg[1] + '</span>';
  const wkChip = document.getElementById('week-chip');
  if (wkChip) {
    const dataWk = d.week_number;
    wkChip.textContent = dataWk ? 'Week ' + dataWk + ' data' : '\u2014';
  }
  const breadcrumb = document.getElementById('ctx-breadcrumb');
  if (breadcrumb) {
    if (S.context === 'oem') {
      const pack = d.battery_model || '';
      breadcrumb.innerHTML = `<a href="/oem-v3?from=passport&pack=${pack}" style="font-size:11px;color:var(--accent);font-family:var(--font-mono);text-decoration:none;margin-right:12px">\u2190 OEM Dashboard</a>`;
    } else {
      breadcrumb.innerHTML = '';
    }
  }
}

// ════════════════════════════════════════════════════════════════
// URL SYNC
// ════════════════════════════════════════════════════════════════
function syncURL() {
  const p = new URLSearchParams();
  if (S.bat) p.set('bat', S.bat);
  if (S.chem) p.set('chem', S.chem);
  if (S.oem) p.set('oem', S.oem);
  if (S.context) p.set('context', S.context);
  history.replaceState(null, '', '?' + p.toString());
}

// ════════════════════════════════════════════════════════════════
// TAB ROUTER
// ════════════════════════════════════════════════════════════════
function showTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab)
  );
  const el = document.getElementById('tab-content');
  // Tabs that don't require a battery selection
  const noSelect = ['scorelab'];
  if (!S.bat && !noSelect.includes(tab)) {
    el.innerHTML = emptyState('Select a battery', 'Choose from the dropdown above to begin.');
    return;
  }
  el.innerHTML = '<div class="loading">Loading...</div>';
  afterRender(tab);
}

// ════════════════════════════════════════════════════════════════
// SHARED HELPERS (Phase 1)
// ════════════════════════════════════════════════════════════════
function tierBadge(t) {
  const tn = normalizeTier(t);  // Sprint 2D: normalise "GOOD" -> "PRIME" etc.
  const bg = {'PRIME':'#dcfce7','STABLE':'#dbeafe','WATCH':'#fef3c7','STRESSED':'#ffedd5','CRITICAL':'#fee2e2'}[tn] || '#f3f4f6';
  const tx = {'PRIME':'#166534','STABLE':'#1e40af','WATCH':'#92400e','STRESSED':'#9a3412','CRITICAL':'#991b1b'}[tn] || '#555';
  return `<span class="tier-badge" style="background:${bg};color:${tx}">${tn || '—'}</span>`;
}
function confidenceBadge(level) {
  if (!level) return '';
  const c = {'HIGH':'#16a34a','MEDIUM':'#d97706','LOW':'#ea580c','INSUFFICIENT_DATA':'#dc2626'}[level] || '#555';
  return `<span style="display:inline-block;padding:2px 8px;border-radius:3px;font-family:var(--font-mono);font-size:9px;background:${c}15;color:${c};border:1px solid ${c}33">${level}</span>`;
}
function fmt(v, d=1) { return v != null ? (typeof v === 'number' ? v.toFixed(d) : v) : '—'; }

function scoreFill(val, weight, label, ctx) {
  const pct = Math.min(100, Math.max(0, val || 0));
  const c = pct >= 80 ? 'var(--grn)' : pct >= 60 ? 'var(--blue)' : pct >= 40 ? 'var(--amb)' : 'var(--red)';
  return `<div class="score-row">
    <div class="score-label">${label} <span style="font-size:9px;color:var(--text3)">(${weight}%)</span></div>
    <div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${c}"></div></div>
    <div class="score-val" style="color:${c}">${val != null ? Math.round(val) : '—'}</div>
  </div>${ctx ? '<div style="font-size:11px;color:var(--text2);padding:4px 0 10px 152px;line-height:1.6">' + ctx + '</div>' : ''}`;
}

function sigCard(label, value, unit, vs, vsClass, ctx) {
  return `<div class="sig-card">
    <div class="sig-label">${label}</div>
    <div class="sig-value ${vsClass}">${value}<span class="sig-unit">${unit}</span></div>
    ${vs ? '<div class="sig-vs ' + vsClass + '">' + vs + '</div>' : ''}
    ${ctx ? '<div class="sig-ctx">' + ctx + '</div>' : ''}
  </div>`;
}

function proxyRow(label, value, unit, fill, cls, status, ctx) {
  const colVar = cls === 'red' ? 'var(--red)' : cls === 'amb' ? 'var(--amb)' : 'var(--grn)';
  return `<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
      <span style="font-size:11px;color:var(--text2)">${label}</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:${colVar}">${value}${unit ? ' <span style="color:var(--text3);font-size:9px">' + unit + '</span>' : ''} · ${status}</span>
    </div>
    <div style="height:3px;background:var(--bg3);border-radius:2px;margin-bottom:4px">
      <div style="height:100%;width:${Math.min(fill * 100, 100).toFixed(0)}%;background:var(--accent);border-radius:2px"></div>
    </div>
    <div style="font-size:10px;color:var(--text3);line-height:1.5">${ctx}</div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// VEHICLE PROFILE + SUBSYSTEM HEALTH (Health Enrichment)
// ════════════════════════════════════════════════════════════════
function batterySubLine(bat) {
  const chemLabel = S.chem === 'LFP' ? 'LFP E-Rickshaw' : 'NMC 2-Wheeler';
  const packGen = bat.battery_model || bat.pack_type || bat.oem_model || 'Pack';
  const packClean = packGen.replace(/GF_LFP_|INV_NMC_|GREENFUEL_|INVOLTA_|TPL[-_]LFP105[-_]16S[-_]/gi, '').replace(/_/g, ' ').trim() || packGen;
  const wk = bat.week_number || '—';
  const oem = bat.oem_name || '';
  return `${chemLabel} · ${oem ? oem + ' ' : ''}${packClean} · Week ${wk}`;
}

function vehicleProfile(bat, wks) {
  const n = wks.length;
  if (n < 2) return '';

  const speeds = wks.map(w => parseFloat(w.avg_speed || 0)).filter(v => v > 0);
  const avgSpeed = speeds.length ? speeds.reduce((a, b) => a + b, 0) / speeds.length : 0;
  const routeType = avgSpeed < 18 ? 'Urban stop-start' : avgSpeed < 28 ? 'Mixed urban/highway' : 'Highway-dominant';

  const trips = wks.map(w => parseFloat(w.trip_count || 0)).filter(v => v > 0);
  const tripMedian = trips.length ? [...trips].sort((a, b) => a - b)[Math.floor(trips.length / 2)] : 0;

  const dods = wks.map(w => parseFloat(w.dod_mean || 0)).filter(v => v > 0);
  const dodMedian = dods.length ? [...dods].sort((a, b) => a - b)[Math.floor(dods.length / 2)] : 0;
  const dodRaw = dodMedian > 1 ? dodMedian : dodMedian * 100;
  const dodPending = !(dodRaw >= 0 && dodRaw <= 100);
  const dodPct = Math.min(100, Math.max(0, dodRaw));

  const temps = wks.map(w => parseFloat(w.temp_max || 0)).filter(v => v > 0);
  const avgTemp = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '—';
  const hotWeeks = temps.filter(t => t > 40).length;
  const critWeeks = temps.filter(t => t > 45).length;

  const dailyKm = tripMedian > 0 && avgSpeed > 0 ? Math.round(tripMedian * avgSpeed * 0.4) : '—';

  const chargingPattern = (function() {
    const cc = wks.map(w => parseFloat(w.charge_cycles_delta || 0)).filter(v => v > 0);
    const avg = cc.length ? cc.reduce((a, b) => a + b, 0) / cc.length : 0;
    if (avg > 8) return 'Opportunity charging (frequent short charges)';
    if (dodPct > 85) return 'Deep cycle pattern (charges from very low SoC)';
    return 'Full cycle pattern (normal)';
  })();

  const profileRows = [
    ['Vehicle type', bat.vehicle_type || (S.chem === 'LFP' ? 'E-Rickshaw (3W)' : '2-Wheeler (2W)'), ''],
    ['Route profile', routeType, avgSpeed > 0 ? 'Mean speed: ' + avgSpeed.toFixed(1) + ' km/h' : ''],
    ['Daily usage', typeof dailyKm === 'number' ? '~' + dailyKm + ' km/day' : '—', tripMedian > 0 ? tripMedian.toFixed(0) + ' trips/week median' : ''],
    ['Mean DoD', dodPending ? 'Data pending' : (dodPct > 0 ? dodPct.toFixed(1) + '%' : '—'), dodPending ? '' : (dodPct > 85 ? 'Very deep cycling' : dodPct > 70 ? 'Deep cycling' : 'Normal range')],
    ['Charging pattern', chargingPattern, ''],
    ['Avg operating temp', avgTemp !== '—' ? avgTemp + '°C' : '—', hotWeeks + 'wk >40°C · ' + critWeeks + 'wk >45°C'],
    ['Monsoon exposure', wks.filter(w => { const m = w.month || 0; return m >= 5 && m <= 8; }).length + ' weeks', 'Jun–Sep high-humidity operation'],
    ['Summer exposure', wks.filter(w => { const m = w.month || 0; return m >= 2 && m <= 4; }).length + ' weeks', 'Mar–May peak thermal stress period'],
  ].filter(r => r[1] && r[1] !== '—' && r[1] !== '0 weeks');

  return `<div class="sec-l">◈ Vehicle & usage profile — derived from telemetry</div>
  <div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden;margin-bottom:10px">
    <div style="padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--bg3);font-size:9px;font-family:var(--font-mono);color:var(--text3)">

function subsystemHealth(bat, wks) {
  const spread = Math.round(parseFloat(bat.cell_spread_max || (wks.length ? wks[wks.length - 1].cell_spread_max : 0) || 0));
  const temp = parseFloat(bat.temp_max || (wks.length ? wks[wks.length - 1].temp_max : 0) || 0);
  const critTempWks = wks.filter(w => parseFloat(w.temp_max || 0) > 45).length;
  const deepDisch = parseInt(bat.cumulative_deep_discharge_count || 0);
  const vsag = parseFloat(bat.soc_corrected_voltage_sag || (wks.length ? wks[wks.length - 1].soc_corrected_voltage_sag : 0) || 0);

  const cellStatus = spread > 150 ? ['CRITICAL', 'red', 'Spread ' + spread + 'mV above critical. Active imbalance — BMS alert disabled at 800mV.']
    : spread > 100 ? ['WARNING', 'amb', 'Spread ' + spread + 'mV approaching threshold. Monitor weekly.']
    : ['HEALTHY', 'grn', 'Spread ' + spread + 'mV within normal range.'];

  const thermalStatus = critTempWks > 4 ? ['STRESS', 'red', critTempWks + ' weeks above 45°C — accelerated degradation risk.']
    : temp > 40 ? ['ELEVATED', 'amb', 'Peak temp ' + Math.round(temp) + '°C elevated. Monitor during summer.']
    : ['WITHIN SPEC', 'grn', 'Temperature within normal operating range.'];

  const chargeStatus = deepDisch > 10 ? ['IRREGULAR', 'red', deepDisch + ' deep discharge events. Charging before 10% SoC recommended.']
    : deepDisch > 5 ? ['MODERATE', 'amb', deepDisch + ' deep discharge events detected.']
    : ['NORMAL', 'grn', 'Charging pattern within normal parameters.'];

  const irStatus = vsag > 1.3 ? ['HIGH', 'red', 'Resistance proxy elevated. Power delivery reduced.']
    : vsag > 1.1 ? ['ELEVATED', 'amb', 'Resistance proxy rising. Monitor trend.']
    : vsag > 0 ? ['NORMAL', 'grn', 'Internal resistance within normal range.']
    : ['UNKNOWN', 'neutral', 'Insufficient voltage sag data.'];

  const score = bat.operational_score || bat.adjusted_composite || 0;
  const capPct = Math.max(0, Math.min(100, score));
  const capStatus = capPct < 30 ? ['SIGNIFICANT FADE', 'red', 'Score ' + Math.round(capPct) + '/100 — approaching end-of-life threshold.']
    : capPct < 50 ? ['MODERATE FADE', 'amb', 'Score ' + Math.round(capPct) + '/100 — degradation accelerating.']
    : ['NORMAL AGING', 'grn', 'Score ' + Math.round(capPct) + '/100 — within expected aging curve.'];

  const bmsStatus = bat.has_cusum ? ['CUSUM ACTIVE', 'amb', 'Regime change detected — permanent efficiency shift flagged.']
    : ['FUNCTIONING', 'grn', 'No abnormal protection trips or regime changes detected.'];

  const subsystems = [
    ['Cell balance', ...cellStatus],
    ['BMS / regime', ...bmsStatus],
    ['Thermal system', ...thermalStatus],
    ['Charging system', ...chargeStatus],
    ['Capacity (overall)', ...capStatus],
    ['Internal resistance', ...irStatus],
  ];

  const dot = cls => `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--${cls === 'neutral' ? 'text3' : cls});margin-right:5px;flex-shrink:0"></span>`;

  return `<div class="sec-l">◈ Subsystem health — platform assessment</div>
  <div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden;margin-bottom:10px">
    <div style="display:grid;grid-template-columns:1fr 1fr">
      ${subsystems.map(([name, status, cls, detail], i) => `<div style="padding:10px 14px;border-bottom:${i < 4 ? '1px solid var(--bg3)' : 'none'};border-right:${i % 2 === 0 ? '1px solid var(--bg3)' : 'none'}">
        <div style="font-size:9px;font-family:var(--font-mono);color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">${name}</div>
        <div style="display:flex;align-items:center;margin-bottom:3px">${dot(cls)}<span style="font-size:11px;font-weight:600;color:var(--${cls === 'neutral' ? 'text3' : cls})">${status}</span></div>
        <div style="font-size:10px;color:var(--text3);line-height:1.5">${detail}</div>
      </div>`).join('')}
    </div>
    <div style="padding:8px 14px;background:var(--bg3);font-size:10px;color:var(--text3);line-height:1.5">
      Subsystem status inferred from telemetry signals — not from BMS self-report.
      BMS self-diagnostics are unreliable for LFP (SoH reads 97–100% on degraded batteries).
    </div>
  </div>`;
}

async function renderInternalDiag(batId) {

  h += '<div class="sec-l" style="margin-top:14px">\u25C8 Signal Comparison (Production vs Shadow)</div>';

    if (prod == null || shad == null) return '#94a3b8';
    const pct = prod !== 0 ? Math.abs((shad - prod) / prod * 100) : 0;
    return pct <= 10 ? '#22c55e' : pct <= 25 ? '#f59e0b' : '#ef4444';
  };
  const _delta = (prod, shad, unit) => {
    if (prod == null || shad == null) return '\u2014';
    return (shad - prod >= 0 ? '+' : '') + (shad - prod).toFixed(1) + (unit||'');
  };

  // DT-LFP P50 at 4w as shadow range
  const lfpP50 = d.dt_lfp_projections && d.dt_lfp_projections.length > 0 ? d.dt_lfp_projections[0].range_p50_km : null;
  const rows = [
    ['Range', _fv(sig.range_est_km)+'km', lfpP50!=null?Math.round(lfpP50)+'km':'\u2014', _delta(sig.range_est_km,lfpP50,'km'), _deltaCol(sig.range_est_km,lfpP50), 'dt_lfp_v1.1'],
    ['SOH', (function(){const s=safeSoh(sig.soh_corrected);return s!=null?Math.round(s)+'%':'\u2014';})(), (function(){if(sig.soh_coulomb==null)return '\u2014';const pct=sig.soh_coulomb*100;return pct>100?'\u2014':pct.toFixed(1)+'%';})(), sig.soh_corrected!=null&&sig.soh_coulomb!=null&&sig.soh_coulomb*100<=100?_delta(sig.soh_corrected,sig.soh_coulomb*100,'%'):'\u2014', _deltaCol(safeSoh(sig.soh_corrected),sig.soh_coulomb!=null&&sig.soh_coulomb*100<=100?sig.soh_coulomb*100:null), 'n='+(sig.soh_coulomb_n_cycles||0)],
    ['RUL', sig.rul_weeks_v2!=null?Math.round(sig.rul_weeks_v2)+'wk':'\u2014', sig.capacity_rul_weeks!=null?Math.round(sig.capacity_rul_weeks)+'wk':'\u2014', _delta(sig.rul_weeks_v2,sig.capacity_rul_weeks,'wk'), _deltaCol(sig.rul_weeks_v2,sig.capacity_rul_weeks), sig.capacity_rul_confidence||'\u2014'],
    ['Score', sig.operational_score!=null?sig.operational_score.toFixed(1):'\u2014', '\u2014', '\u2014', '#94a3b8', '3-layer scoring'],
  ];
  if (d.chemistry === 'NMC') rows.push(['SoC', 'BMS', '\u2014', '\u2014', '#94a3b8', 'SHADOW 10.1% MAPE']);
  rows.forEach(([label, prod, shad, delta, col, src]) => {
    h += `<tr style="border-bottom:1px solid var(--bg3)"><td style="padding:4px 8px;font-weight:500">${label}</td><td style="padding:4px 8px;text-align:center">${prod}</td><td style="padding:4px 8px;text-align:center">${shad}</td><td style="padding:4px 8px;text-align:center;color:${col}">${delta}</td><td style="padding:4px 8px;text-align:center;font-size:9px;color:var(--text3)">${src}</td></tr>`;
  });
  h += '</table>';

  // Section B — Scoring conflict
  if (sc.scoring_conflict_note) {
    const _conflictPlain = translateConflictNote(sc.scoring_conflict_note);
    if (_conflictPlain) h += `<div style="background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#92400e">\u26A0 <strong>Platform override:</strong> ${_conflictPlain}</div>`;
  }

  // Section C — Data quality tiles
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">';
  const vmodeCol = {FULL:'#22c55e',PARTIAL_NO_SOH:'#3b82f6',PARTIAL_LOW_DATA:'#f59e0b',ESTIMATED:'#94a3b8',SUSPENDED:'#ef4444'}[sc.scoring_mode]||'#94a3b8';
  h += `<div class="card" style="padding:8px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">vScore Mode</div><div style="font-size:12px;font-weight:600;color:${vmodeCol}">${sc.scoring_mode||'\u2014'}</div></div>`;
  h += `<div class="card" style="padding:8px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Tier</div><div style="font-size:12px;font-weight:600">${sc.tier_label||'\u2014'}</div></div>`;
  h += `<div class="card" style="padding:8px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">DQ Flags</div><div style="font-size:11px">${sc.data_quality_flags||'None'}</div></div>`;
  h += '</div>';

  // Section D — DT NMC results (only if available)
  if (d.dt_nmc) {
    h += `<div class="card" style="margin-bottom:10px;padding:10px 14px"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;margin-bottom:4px">NMC ECM Simulation</div>`;

  }

  // Section E — DT-LFP projections detail
  if (d.dt_lfp_projections && d.dt_lfp_projections.length > 0) {
    h += '<div class="sec-l" style="margin-top:10px">\u25C8 DT-LFP Range Projections</div>';
    h += '<table style="width:100%;border-collapse:collapse;font-size:11px;font-family:\'DM Mono\',monospace;margin-bottom:8px">';

    d.dt_lfp_projections.forEach(p => {
      h += `<tr style="border-bottom:1px solid var(--bg3)"><td style="padding:4px 8px;font-weight:500">${p.horizon_weeks} weeks</td><td style="padding:4px 8px;text-align:center">${Math.round(p.range_p10_km)}km</td><td style="padding:4px 8px;text-align:center;font-weight:600">${Math.round(p.range_p50_km)}km</td><td style="padding:4px 8px;text-align:center">${Math.round(p.range_p90_km)}km</td><td style="padding:4px 8px;text-align:center;font-size:9px;color:var(--text3)">${p.model_version||'dt_lfp_v1.1'}</td></tr>`;
    });
    h += '</table>';
    h += '<div style="font-size:10px;color:var(--text3);font-style:italic">Persistence architecture. MAPE 5.80% excl POST_KNEE.</div>';

// ── Chart 1: Attribution horizontal bars (OEM view) ──
function drawAttrBars() {
  const canvas = document.getElementById('oem-attr-bars');
  if (!canvas || !window._attrBarData) return;
  const {labels, values} = window._attrBarData;
  if (!values || values.length < 2) {
    canvas.parentElement.innerHTML = '<p class="empty-small">Not enough data yet — builds after 2+ weeks.</p>';
    return;
  }
  if (window._attrBarChart) { try { window._attrBarChart.destroy(); } catch(e) {} }
  window._attrBarChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: values.map((v,i) => i === 0 ? '#f97316' : 'rgba(0,0,0,0.12)'),
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { display: false, max: 100 },
        y: { grid: { display: false }, ticks: { font: { size: 13 }, color: '#6b7280' } }
      },
      layout: { padding: { right: 40 } }
    },
    plugins: [{
      id: 'barLabels',
      afterDraw(chart) {
        const ctx = chart.ctx;
        chart.data.datasets[0].data.forEach((val, i) => {
          const meta = chart.getDatasetMeta(0).data[i];
          if (!meta) return;
          ctx.fillStyle = '#6b7280'; ctx.font = '12px var(--font-mono)';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(val + '%', meta.x + 8, meta.y);
        });
      }
    }]
  });
}

// ── Chart 2: Range trajectory (PASSPORT-P3 — 4 reference lines, regime colour) ──
function drawKmChart(bat, trend, rangeHist) {
  const canvas = document.getElementById('km-chart');
  if (!canvas) return;

  // Prefer rangeHist (new endpoint), fall back to trend
  const hasHist = rangeHist && (rangeHist.weekly_data || rangeHist.weeks) && (rangeHist.weekly_data || rangeHist.weeks).length > 0;
  const hasTrend = trend && trend.values && trend.weeks;
  if (!hasHist && !hasTrend) {
    canvas.parentElement.innerHTML = '<div class="empty-small">No weekly range history available</div>';
    return;
  }

  let labels, rangeVals, regime, refs, latestRange;
  if (hasHist) {
    const wkData = rangeHist.weekly_data || rangeHist.weeks;
    labels = wkData.map(w => 'W' + w.week_number);
    rangeVals = wkData.map(w => Math.round(w.range_km));
    regime = rangeHist.degradation_regime || 'PRE_KNEE';
    refs = rangeHist.references || {};
    latestRange = rangeHist.range_corrected_km || rangeVals[rangeVals.length - 1];
  } else {
    labels = trend.weeks.map(w => 'W' + w);
    rangeVals = trend.values.map(v => v != null ? Math.round(v * 80) : null);
    regime = 'PRE_KNEE';
    refs = {};
    latestRange = rangeVals[rangeVals.length - 1];
  }
  const n = labels.length;

  // Regime colour for trajectory line
  const regimeColours = { PRE_KNEE: '#14b8a6', APPROACHING_KNEE: '#f59e0b', POST_KNEE: '#ef4444', STABLE: '#3b82f6' };
  const lineColour = regimeColours[regime] || '#22c55e';

  // Reference horizontal lines (full width)
  // 3 reference lines (NO 56km floor — permanently banned per Rule 101)
  const refLineDefs = [
    { key: 'mfg_rated_km', label: 'OEM Rated', color: '#9ca3af', dash: [6, 4] },
    { key: 'commissioned_km', label: 'Your Baseline', color: '#3b82f6', dash: [4, 3] },
    { key: 'fleet_expected_km', label: 'Fleet Avg', color: '#22c55e', dash: [4, 3] },
  ];
  // Also try old key names for backward compat
  if (!refs.commissioned_km && refs.commissioned_range_km) refs.commissioned_km = refs.commissioned_range_km;
  if (!refs.fleet_expected_km && refs.fleet_expected_range_km) refs.fleet_expected_km = refs.fleet_expected_range_km;

  // Per-week point colours by regime: use degradation_regime from data if available
  const regimeColourMap = { PRE_KNEE: '#14b8a6', APPROACHING_KNEE: '#f59e0b', POST_KNEE: '#ef4444' };
  const ptCols = rangeVals.map(() => regimeColourMap[regime] || '#14b8a6');

  const datasets = [
    { label: 'Range', data: rangeVals, borderColor: lineColour, backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 2, pointBackgroundColor: ptCols,
      tension: 0.3, spanGaps: false, order: 1 },
  ];

  refLineDefs.forEach(rd => {
    const val = refs[rd.key];
    if (val && val > 0) {
      datasets.push({
        label: rd.label, data: Array(n).fill(Math.round(val)),
        borderColor: rd.color, borderDash: rd.dash, borderWidth: 1.5,
        pointRadius: 0, fill: false, order: 3,
      });
    }
  });

  // ── Projection extension (dt_lfp_v1.1) ──
  const projs = rangeHist && rangeHist.projections || [];
  const projWeek = rangeHist && rangeHist.projection_current_week;
  if (projs.length > 0 && projWeek) {
    // Extend labels for projection horizons
    projs.forEach(p => { labels.push('W' + (projWeek + p.horizon_weeks)); });

    // Extend ref line datasets to cover new labels
    datasets.forEach(ds => {
      if (ds.label !== 'Range') {
        const fill = ds.data[0];
        while (ds.data.length < labels.length) ds.data.push(fill);
      }
    });

    // P50 projection line — orange dashed, connecting from last actual
    const p50Data = Array(n).fill(null);
    p50Data[n - 1] = rangeVals[n - 1]; // connect from last actual point
    projs.forEach(p => { p50Data.push(Math.round(p.range_p50_km)); });
    datasets.push({
      label: 'Projection P50', data: p50Data,
      borderColor: '#f97316', borderDash: [6, 4], borderWidth: 2,
      pointRadius: 3, pointBackgroundColor: '#f97316',
      tension: 0.3, spanGaps: true, fill: false, order: 1,
    });

    // P10 line (lower bound of band)
    const p10Data = Array(n).fill(null);
    p10Data[n - 1] = rangeVals[n - 1];
    projs.forEach(p => { p10Data.push(Math.round(p.range_p10_km)); });
    datasets.push({
      label: 'P10', data: p10Data,
      borderColor: 'transparent', borderWidth: 0,
      pointRadius: 0, fill: false, order: 2,
    });

    // P90 line (upper bound — fills down to P10)
    const p90Data = Array(n).fill(null);
    p90Data[n - 1] = rangeVals[n - 1];
    projs.forEach(p => { p90Data.push(Math.round(p.range_p90_km)); });
    const p10Idx = datasets.length - 1; // index of P10 dataset
    datasets.push({
      label: 'P90', data: p90Data,
      borderColor: 'transparent', borderWidth: 0,
      pointRadius: 0, fill: { target: p10Idx, above: 'rgba(249,115,22,0.12)' }, order: 2,
    });
  }

  if (!rangeVals || rangeVals.filter(v => v != null).length < 2) {
    canvas.parentElement.innerHTML = '<p class="empty-small">Not enough data yet — builds after 2+ weeks.</p>';
    return;
  }
  if (window._kmChart) { try { window._kmChart.destroy(); } catch(e) {} }
  window._kmChart = new Chart(canvas, {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: ctx => ctx.dataset.label !== 'P10' && ctx.dataset.label !== 'P90',
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'Range') {
                const regLabel = { PRE_KNEE: 'Pre-knee', APPROACHING_KNEE: 'Approaching knee', POST_KNEE: 'Post-knee' };
                return ctx.raw + 'km \u00b7 ' + (regLabel[regime] || regime);
              }
              if (ctx.dataset.label === 'Projection P50') return 'P50: ' + ctx.raw + 'km (directional)';
              return ctx.dataset.label + ': ' + ctx.raw + 'km';
            }
          }
        }
      },
      scales: {
        x: { title: { display: true, text: 'week', font: { size: 11, family: "'DM Sans',sans-serif" }, color: '#9ca3af' },
             grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 11 }, color: '#9ca3af', maxTicksLimit: 10, maxRotation: 0 } },
        y: { title: { display: true, text: 'km range', font: { size: 11, family: "'DM Sans',sans-serif" }, color: '#9ca3af' },
             grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 11 }, color: '#9ca3af' } }
      }
    }
  });

  // ── Deviation cards (below chart) ──
  const devEl = document.getElementById('range-deviation-cards');
  const apiDev = rangeHist && rangeHist.range_deviation || {};
  if (devEl && latestRange) {
    const devCol = (pct) => pct > 95 ? '#22c55e' : pct >= 80 ? '#f59e0b' : '#ef4444';
    const tiles = [
      { label: 'vs OEM Rated', ref: refs.mfg_rated_km, refLabel: 'OEM' },
      { label: 'vs Fleet', ref: refs.fleet_expected_km || refs.fleet_expected_range_km, refLabel: 'fleet' },
      { label: 'vs Own Baseline', ref: refs.commissioned_km || refs.commissioned_range_km, refLabel: 'baseline' },
    ];
    let dh = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">';
    tiles.forEach(t => {
      if (t.ref && t.ref > 0) {
        const pct = Math.round(latestRange / t.ref * 100);
        const col = devCol(pct);
        dh += '<div class="card" style="padding:10px 12px;border-left:3px solid ' + col + '">';
        dh += '<div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;font-family:\'DM Sans\',sans-serif">' + t.label + '</div>';
        dh += '<div style="font-size:20px;font-weight:500;color:' + col + ';font-family:\'DM Mono\',monospace">' + pct + '%</div>';
        dh += '<div style="font-size:11px;color:#6b7280;font-family:\'DM Mono\',monospace">' + Math.round(latestRange) + 'km vs ' + Math.round(t.ref) + 'km ' + t.refLabel + '</div>';
        dh += '</div>';
      } else {
        dh += '<div class="card" style="padding:10px 12px;opacity:0.5">';
        dh += '<div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em">' + t.label + '</div>';
        dh += '<div style="font-size:14px;color:#9ca3af">No data</div></div>';
      }
    });
    dh += '</div>';
    dh += '<div style="font-size:10px;color:#9ca3af;margin-top:4px;font-family:\'DM Sans\',sans-serif">Latest week vs reference</div>';
    // Projection disclosure (shown when projections exist)
    if (projs.length > 0) {
      dh += '<div style="font-size:10px;color:#9ca3af;font-style:italic;margin-top:8px;line-height:1.6;font-family:\'DM Sans\',sans-serif">';
      dh += 'Projections are directional only \u00b7 P10/P90 bands show pack-level variability \u00b7 Not for covenant triggers \u00b7 model: ' + (projs[0].model_version || 'dt_lfp_v1.1');
      dh += '</div>';
    }
    devEl.innerHTML = dh;
  }

  // ── Custom HTML legend (below deviation cards) ──
  const legEl = document.getElementById('range-chart-legend');
  if (legEl) {
    const items = [
      { col: lineColour, label: 'Actual range (' + (regime || '').replace(/_/g, ' ').toLowerCase() + ')' },
      { col: '#9ca3af', dash: true, label: 'OEM rated' },
      { col: '#3b82f6', dash: true, label: 'Commissioned' },
      { col: '#22c55e', dash: true, label: 'Fleet expected' },
      { col: '#f97316', dash: true, label: 'Prediction (12w)' },
    ];
    let lh = '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">';
    items.forEach(it => {
      const sw = it.dash
        ? '<svg width="18" height="2" style="vertical-align:middle;margin-right:4px"><line x1="0" y1="1" x2="18" y2="1" stroke="' + it.col + '" stroke-width="1.5" stroke-dasharray="4,3"/></svg>'
        : '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + it.col + ';vertical-align:middle;margin-right:4px"></span>';
      lh += '<span style="font-size:11px;color:#6b7280;font-family:\'DM Sans\',sans-serif">' + sw + it.label + '</span>';
    });
    lh += '</div>';
    legEl.innerHTML = lh;
  }
}

async function submitFeedback(batId) {
  const payload = {
    battery_id: batId,
    user_assessment: document.getElementById('fb-a')?.value || '',
    feedback_reason_code: document.getElementById('fb-r')?.value || '',
    stakeholder_role: document.getElementById('fb-role')?.value || '',
    feedback_comment: document.getElementById('fb-c')?.value || '',
    timestamp: new Date().toISOString()
  };
  const res = await post('/api/feedback', payload);
  const ok = document.getElementById('fb-ok');
  if (!ok) return;
  ok.style.display = 'block';
  ok.style.color = res ? 'var(--grn)' : 'var(--amb)';
  ok.textContent = res ? '✓ Submitted' : '⚠ Offline — use Save as JSON';
  setTimeout(() => ok.style.display = 'none', 5000);
}

function saveFeedbackJSON(batId) {
  const p = {
    battery_id: batId,
    user_assessment: document.getElementById('fb-a')?.value || '',
    feedback_reason_code: document.getElementById('fb-r')?.value || '',
    stakeholder_role: document.getElementById('fb-role')?.value || '',
    feedback_comment: document.getElementById('fb-c')?.value || '',
    timestamp: new Date().toISOString()
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(p, null, 2)], { type: 'application/json' }));
  a.download = `feedback_${batId}_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function publicModelName(m) {
  if (!m) return 'Range Predictor';
  if (m.includes('personal') || m.includes('BAT_')) return 'Personal Range Model (personalised to this battery)';
  if (m.includes('ensemble') || m.includes('t2t1')) return 'Fleet Ensemble Range Predictor';
  if (m.includes('t1b') || m.includes('lgbm')) return 'LGBM Range Predictor';
  return 'Range Predictor';
}

function confidenceBar(p10, p50, p90) {
  const min = Math.max(0, p10 - 10), max = p90 + 10, range = max - min || 1;
  const p10pct = ((p10 - min) / range * 100).toFixed(1);
  const p50pct = ((p50 - min) / range * 100).toFixed(1);
  const widthPct = ((p90 - p10) / range * 100).toFixed(1);
  return `<div style="margin:10px 0 4px;position:relative;height:20px">
    <div style="position:absolute;top:7px;left:0;right:0;height:6px;background:var(--bg3);border-radius:3px"></div>
    <div style="position:absolute;top:7px;left:${p10pct}%;width:${widthPct}%;height:6px;background:rgba(217,119,6,0.3);border-radius:3px;border:1px solid rgba(186,117,23,0.3)"></div>
    <div style="position:absolute;top:3px;left:calc(${p50pct}% - 1px);width:2px;height:14px;background:var(--accent);border-radius:1px"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:9px;font-family:var(--font-mono);color:var(--text3);margin-bottom:8px">
    <span>P10 · ${p10}km</span><span style="color:var(--accent);font-weight:600">P50 · ${p50}km</span><span>P90 · ${p90}km</span>
  </div>`;
}

function rangeContext(p50, currentRange, baselineRange, fleetP50) {
  const designSpec = S.chem === 'LFP' ? 80 : 40;
  const vsFleet = fleetP50 > 0 ? (((currentRange - fleetP50) / fleetP50) * 100).toFixed(1) : null;
  const vsSpec = currentRange > 0 ? (((currentRange - designSpec) / designSpec) * 100).toFixed(1) : null;
  const vsForecast = currentRange > 0 ? (((p50 - currentRange) / currentRange) * 100).toFixed(1) : null;
  const vsComm = baselineRange ? (((currentRange - baselineRange) / baselineRange) * 100).toFixed(1) : null;

  const cell = (label, value, pct, cls, note) => `<div style="background:var(--bg2);border-radius:8px;padding:10px 12px;text-align:center">
    <div style="font-size:9px;font-family:var(--font-mono);color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">${label}</div>
    <div style="font-size:18px;font-weight:700;font-family:var(--font-head);color:var(--text);line-height:1">${value}</div>
    ${pct ? '<div style="font-size:11px;font-family:var(--font-mono);font-weight:600;color:var(--' + cls + ');margin-top:2px">' + pct + '%</div>' : ''}
    <div style="font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4">${note}</div>
  </div>`;

  let h = '<div class="g4" style="margin:10px 0 12px">';
  h += cell('Current week', currentRange + 'km', null, '', 'actual this week');
  h += cell('12-week forecast', p50 + 'km', vsForecast ? (parseFloat(vsForecast) > 0 ? '+' : '') + vsForecast : null, parseFloat(vsForecast || 0) < 0 ? 'amb' : 'grn', 'vs current');
  h += cell('vs fleet today', fleetP50 + 'km fleet avg', vsFleet ? (parseFloat(vsFleet) > 0 ? '+' : '') + vsFleet : null, parseFloat(vsFleet || 0) < 0 ? 'red' : 'grn', 'fleet P50');
  h += cell('vs design spec', designSpec + 'km spec', vsSpec ? (parseFloat(vsSpec) > 0 ? '+' : '') + vsSpec : null, parseFloat(vsSpec || 0) < 0 ? 'amb' : 'grn', S.chem + ' design range');
  h += '</div>';

  if (vsComm && parseFloat(vsComm) < 0) {
    h += `<div style="font-size:11px;color:var(--text2);padding:8px 12px;background:rgba(239,68,68,0.06);border-radius:6px;margin-bottom:10px;border-left:3px solid var(--red)">
      <strong>Total range lost since commissioning: ${Math.abs(parseFloat(vsComm)).toFixed(1)}%</strong>
      — from ${baselineRange}km when new → ${currentRange}km today (${baselineRange - currentRange}km absolute loss).
      BMS displays ~${currentRange + 4}km — overstated by ~4.4km due to systematic SoC error.
    </div>`;
  }
  return h;
}

function fleetBenchmarkBar(currentRange, fleetP10, fleetP50, fleetP90) {
  if (!fleetP50 || !currentRange) return '';
  const min = Math.max(0, fleetP10 - 10), max = fleetP90 + 10, range = max - min || 1;
  const thisPct = ((currentRange - min) / range * 100).toFixed(1);
  const p50Pct = ((fleetP50 - min) / range * 100).toFixed(1);
  const belowFleet = currentRange < fleetP50;

  return `<div style="margin:10px 0;padding:10px 12px;background:var(--bg2);border:1px solid var(--bg3);border-radius:8px">

      <div style="position:absolute;top:3px;left:calc(${thisPct}% - 9px);width:18px;height:18px;border-radius:50%;background:${belowFleet ? 'var(--red)' : 'var(--grn)'};display:flex;align-items:center;justify-content:center"><span style="font-size:8px;color:#fff;font-weight:700">${currentRange}</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;font-family:var(--font-mono);color:var(--text3)">
      <span>Fleet P10: ${fleetP10}km</span><span style="color:#1e40af">Fleet median: ${fleetP50}km</span><span>Fleet P90: ${fleetP90}km</span>
    </div>
    <div style="margin-top:6px;font-size:11px;color:var(--text2)">
      ${belowFleet
        ? 'This battery (' + currentRange + 'km) is <strong style="color:var(--red)">' + (fleetP50 - currentRange) + 'km below fleet median</strong>.'
        : 'This battery (' + currentRange + 'km) is <strong style="color:var(--grn)">' + (currentRange - fleetP50) + 'km above fleet median</strong>.'}
    </div>
  </div>`;
}

function specificBasedOn(bat, pred, intel, weeks_history, model, mape) {
  const fc = pred && pred.forecast;
  const slope = intel ? parseFloat(intel.trend_signal || 0) : 0;
  const effLoss = intel ? Math.abs(parseFloat(intel.os1_range_loss || 0)) : 0;
  const spread = Math.round(bat.cell_spread_max || (bat.weekly_trend && bat.weekly_trend.length ? bat.weekly_trend[bat.weekly_trend.length - 1].cell_spread_max : 0) || 0);
  const cusumActive = bat.has_cusum;
  const cusumWeek = bat.cusum_week;
  const is_personal = (model || '').includes('personal') || (model || '').includes('BAT_');

  return [
    effLoss > 0 ? `Efficiency ${effLoss.toFixed(1)}% below own commissioning baseline — the strongest predictor (SHAP: 25.2% importance). Sustained over ${Math.min(weeks_history, 12)} weeks.` : null,
    slope < 0 ? `Decline rate: ${slope.toFixed(4)} km/SoC%/week (OLS slope). At this rate: additional ${Math.abs(slope * 12).toFixed(2)} km/SoC% lost in 12 weeks.` : null,
    cusumActive ? `CUSUM regime change confirmed${cusumWeek ? ' at Week ' + cusumWeek : ''} — permanent efficiency shift, not noise or seasonal variation.` : null,
    spread > 100 ? `Cell spread ${spread}mV — active imbalance compounding efficiency loss. Each mV above 100mV costs ~0.3% capacity.` : null,
    is_personal ? `Personal model active — trained on this battery's ${weeks_history} weeks.` : weeks_history >= 20 ? `⚠ ${weeks_history} weeks of history — personal model threshold is 20wk. Check why ensemble is active.` : `Fleet ensemble model — personal model activates at 20 weeks (currently ${weeks_history}wk).`,
    `Model: ${publicModelName(model)} · ${parseFloat(mape).toFixed(2)}% average error on held-out 12-week forecasts.`,
    'Relative target: predicting % loss from own baseline — 6pp more accurate than absolute prediction.'
  ].filter(Boolean);
}

function specificUnless(bat, pred, intel, weeks_history, model) {
  const spread = Math.round(bat.cell_spread_max || (bat.weekly_trend && bat.weekly_trend.length ? bat.weekly_trend[bat.weekly_trend.length - 1].cell_spread_max : 0) || 0);
  const deepDisch = parseInt(bat.cumulative_deep_discharge_count || 0);
  const effLoss = intel ? Math.abs(parseFloat(intel.os1_range_loss || 0)) : 0;
  const is_personal = (model || '').includes('personal');

  return [
    spread > 100 ? `BMS cell balancing performed → spread drops below 100mV → estimated range recovery +4–7km` : null,
    deepDisch > 5 ? `Deep discharge events reduced (charge before SoC <20%) → slows anode degradation ~15% → RUL extends ~3–5 weeks` : null,
    effLoss > 20 ? `Note: efficiency regime change is largely irreversible. Max realistic recovery: +5–10% of lost range.` : null,
    !is_personal && weeks_history >= 20 ? `Personal model activates → accuracy improves from ${parseFloat(bat.model_mape_12w || 14.07).toFixed(1)}% to ~9.3% MAPE` : null,
    'Seasonal improvement: post-monsoon cooling (Oct–Nov) typically shows +2–4% temporary efficiency recovery.'
  ].filter(Boolean);
}
