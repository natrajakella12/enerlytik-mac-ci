const SEV_COLORS_MAP = {'SEV-1':'#E24B4A','SEV-2':'#f97316','SEV-3':'#EF9F27','SEV-4':'#378ADD','CRITICAL':'#E24B4A','HIGH':'#f97316','WARNING':'#EF9F27','MEDIUM':'#EF9F27','LOW':'#378ADD'};

const CHAINS = {
  'E3_E2':{label:'E3→E2',color:'#f97316',why:'Thermal stress precedes cell imbalance. High temperatures (Indian summer Apr–Jun) accelerate differential cell aging, creating voltage spread. Most common degradation pathway in Indian LFP fleets.',action:'Check charging temperature. Avoid charging in direct sunlight. Shade infrastructure significantly extends battery life.'},
  'E2_E1':{label:'E2→E1',color:'#d97706',why:'Cell imbalance reduces effective pack capacity, causing apparent efficiency drop. The weakest cell limits the entire pack — not bulk chemistry degradation.',action:'BMS balancing check. Full discharge–recharge cycle may help.'},
  'E6_E1':{label:'E6→E1',color:'#d97706',why:'Usage shift (operator reducing trips) often precedes efficiency regime change. Operator detected performance degradation before platform flagged it.',action:'Interview operator immediately. This pattern indicates real degradation was noticed in the field.'},
  'E4_E7':{label:'E4→E7',color:'#E24B4A',why:'Deep discharge causes voltage sag in subsequent cycles. Repeated deep discharge damages anode lithium structure — progressive and cumulative.',action:'Set BMS lower voltage cutoff higher. Operator education on charging habits.'},
  'E3_E1':{label:'E3→E1',color:'#f97316',why:'Direct thermal pathway to efficiency loss. Extended heat exposure degrades electrolyte conductivity and thickens SEI layer.',action:'Seasonal advisory. Monitor closely through peak summer months (Apr–Jun).'},
  'E1_E2':{label:'E1→E2',color:'#E24B4A',why:'Efficiency drop concurrent with cell spread — systemic degradation rather than single-cell fault.',action:'Full diagnostic recommended. Check batch peers — may indicate batch-level defect.'},
};

function detectChains(evList) {
  const types = evList.map(e => e.event_code || e.event_type || '');
  const found = [];
  Object.entries(CHAINS).forEach(([key, chain]) => {
    const [a, b] = key.split('_');
    const iA = types.findIndex(t => t === a || t.startsWith(a + '_') || t.includes(a));
    const iB = types.findIndex(t => t === b || t.startsWith(b + '_') || t.includes(b));
    if (iA >= 0 && iB >= 0) {
      const wA = evList[iA].week_number || 0, wB = evList[iB].week_number || 0;
      if (Math.abs(wA - wB) <= 6) found.push(chain);
    }
  });
  return found;
}

function evtCodeShort(e) {
  return e.event_code || (e.event_type ? e.event_type.match(/E\d+/) ? e.event_type.match(/E\d+/)[0] : e.event_type.slice(0, 3) : '?');
}

  const m = new Date().getMonth();
  const season = m >= 2 && m <= 4 ? 'Peak Summer (Mar–May)' : m >= 5 && m <= 8 ? 'Monsoon (Jun–Sep)' : m >= 9 && m <= 10 ? 'Post-monsoon (Oct–Nov)' : 'Winter (Dec–Feb)';
  const effects = {'Peak Summer (Mar–May)':'Ambient 40–45°C — peak thermal stress. E3 events most likely. Charging in direct sunlight adds 10–15°C to cell temp. Highest degradation risk period.','Monsoon (Jun–Sep)':'High humidity — monitor cell insulation. Lower ambient temps reduce thermal stress. E5 (charging anomaly) elevated due to power cuts.','Post-monsoon (Oct–Nov)':'Transitional period. Temperatures dropping. E3 risk reducing. Good period for recovery if cell balancing is performed.','Winter (Dec–Feb)':'Lowest degradation rate of year. Cold reduces capacity temporarily but slows permanent aging. Good time for baseline recalibration.'};
  return `<div style="padding:10px 12px;background:var(--bg2);border-radius:8px;border:1px solid var(--bg3);margin-top:10px">
    <div class="sec-l" style="margin-top:0">External conditions</div>

}

async function renderEvents() {
  const el = document.getElementById('tab-content');
  const data = await get(`/api/battery/${S.bat}/events`);
  if (data && data.error) { el.innerHTML = emptyState('Battery data unavailable','No telemetry data for '+S.bat+'. Check IoT connection.'); return; }
  const evList = data ? (Array.isArray(data) ? data : data.events || []) : [];

  if (evList.length === 0) {
    el.innerHTML = `<div class="card" style="border-left:3px solid var(--grn);text-align:center;padding:30px 20px">
      <div style="font-size:36px;color:var(--grn);margin-bottom:8px">&#10003;</div>
      <div style="font-size:16px;font-weight:600;color:var(--grn)">No Anomalous Events Detected</div>
      <div style="font-size:13px;color:var(--text2);margin-top:6px">This battery is operating within all monitored parameters.</div>
    </div>`;
    return;
  }

  // Get battery spread_delta for structural E2 classification
  const batScore = await get(`/api/battery/${S.bat}`).catch(()=>null);
  const spreadDelta = batScore?.spread_delta_mv;
  const commSpread = batScore?.commissioning_spread_mv;
  const isStructuralE2 = spreadDelta != null && spreadDelta < 30;

  let h = '';

  // E2 structural info strip (Rule 51)
  const hasImbalanceEvents = evList.some(e => (e.event_type||'').includes('IMBALANCE'));
  if (hasImbalanceEvents) {
    const stripKey = 'enerlytik_e2_strip_dismissed';
    const dismissed = typeof localStorage!=='undefined' && localStorage.getItem(stripKey);
    if (!dismissed) {
      h += `<div id="e2-info-strip" style="background:#fffdf5;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:8px 14px;margin-bottom:10px;font-size:11px;color:#92400e;display:flex;justify-content:space-between;align-items:flex-start">`;
      h += `<div>E2 alert threshold updated (Rule 51): alerts now fire at max(150mV, commissioning_spread + 80mV). Historical cell imbalance events marked STRUCTURAL reflect pack design baseline, not degradation.</div>`;
      h += `<span onclick="this.parentElement.style.display='none';localStorage.setItem('${stripKey}','1')" style="cursor:pointer;font-size:14px;color:#d97706;margin-left:10px;flex-shrink:0">×</span></div>`;
    }
  }

  // ── Section A: Summary Pills ──
  h += '<div class="sec-l">◈ Event history — ' + evList.length + ' events</div>';
  const counts = {};
  evList.forEach(e => { const c = evtCodeShort(e); counts[c] = (counts[c] || 0) + 1; });
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">';
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([code, cnt]) => {
    const col = SEV_COLORS_MAP[evList.find(e => evtCodeShort(e) === code)?.severity] || '#888';
    h += `<span style="font-family:var(--font-mono);font-size:10px;padding:3px 10px;border-radius:12px;background:${col}15;color:${col};border:1px solid ${col}30">${code} ×${cnt}</span>`;
  });
  h += '</div>';

  // ── Section B: Event Timeline Canvas ──
  h += '<div class="card"><div class="card-title">Event Timeline</div><canvas id="event-timeline" style="width:100%;height:60px"></canvas></div>';

  // ── Section C: Event Table ──
  h += '<div class="card"><div class="card-title">Event Detail</div>';
  h += '<table style="width:100%;font-size:12px;border-collapse:collapse">';
  h += '<tr style="font-family:var(--font-mono);font-size:9px;color:var(--text3)"><th style="text-align:left;padding:4px 8px">CODE</th><th>SEVERITY</th><th>WEEK</th><th style="text-align:left">DESCRIPTION</th><th style="text-align:left">CONTEXT</th></tr>';
  evList.forEach(e => {
    const code = evtCodeShort(e);
    let sev = e.severity || '—';
    let sevCol = SEV_COLORS_MAP[sev] || '#888';
    let desc = EVENT_LABELS[code] || e.event_type || code;
    let ctx = EVENT_CONTEXT[code] || '';
    let tagPill = '';

    // E2/Cell imbalance structural classification (Rule 51)
    const isImbalance = (e.event_type||'').includes('IMBALANCE');
    if (isImbalance && isStructuralE2) {
      // Case A: structural spread — not degradation
      sevCol = '#94a3b8';
      sev = 'INFO';
      desc = 'Cell spread — structural baseline (not degradation)';
      ctx = `Fleet finding: 82% delivered above 150mV (median 193mV). Pack design baseline.${commSpread?' Commissioning: '+Math.round(commSpread)+'mV.':''}`;
      tagPill = '<span style="font-size:8px;padding:1px 5px;border-radius:4px;background:#94a3b818;color:#94a3b8;font-family:var(--font-mono);margin-left:4px">STRUCTURAL · Rule 51</span>';
    } else if (isImbalance && spreadDelta != null && spreadDelta < 80) {
      // Case B: below 80mV delta — monitor
      sevCol = '#f59e0b';
      sev = 'MONITOR';
      ctx = `Spread above 150mV absolute but delta only ${Math.round(spreadDelta)}mV from commissioning. Alert fires at commissioning+80mV.`;
      tagPill = '<span style="font-size:8px;padding:1px 5px;border-radius:4px;background:#f59e0b18;color:#f59e0b;font-family:var(--font-mono);margin-left:4px">MONITOR · Rule 51</span>';
    } else if (isImbalance && spreadDelta != null && spreadDelta >= 80) {
      // Case C: real operator-caused imbalance
      ctx = `Spread grew ${Math.round(spreadDelta)}mV above commissioning baseline — operator-caused imbalance.`;
    }

    // Calendar week (WS4)
    const wkDisplay = typeof fmtCalWk==='function' && (e.scored_calendar_week||e.calendar_week) ? fmtCalWk(e.scored_calendar_week||e.calendar_week, e.week_start_date) : 'W'+(e.week_number||'?');

    h += `<tr style="border-top:1px solid var(--bg2)">
      <td style="padding:6px 8px"><span style="font-family:var(--font-mono);font-size:10px;padding:1px 6px;border-radius:3px;background:${sevCol}15;color:${sevCol};border:1px solid ${sevCol}30">${code}</span>${tagPill}</td>
      <td style="text-align:center"><span style="font-family:var(--font-mono);font-size:9px;color:${sevCol}">${sev}</span></td>
      <td style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px">${wkDisplay}</td>
      <td style="font-size:11px;color:var(--text2)">${desc}</td>
      <td style="font-size:10px;color:var(--text3);max-width:300px">${ctx}</td>
    </tr>`;
  });
  h += '</table></div>';

  // ── Section D: Causal Chain Detection ──
  const chains = detectChains(evList);
  if (chains.length > 0) {
    h += '<div class="sec-l">◈ Causal chain analysis</div>';
    chains.forEach(c => {
      h += `<div class="chain-panel" style="border-left-color:${c.color}">
        <div style="font-family:var(--font-mono);font-size:11px;color:${c.color};font-weight:600;margin-bottom:6px">${c.label}</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.7;margin-bottom:6px">${c.why}</div>
        <div style="font-size:10px"><strong style="color:var(--text2)">Recommended:</strong> <span style="color:var(--text3)">${c.action}</span></div>
      </div>`;
    });
  }

  // ── Section E: External Conditions ──
  h += externalConditions();

  // ── Section F: Collapsible Event Legend ──
  h += `<details style="margin-top:12px"><summary style="cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--text3);padding:6px 0">Event & severity legend</summary>
    <div class="card" style="margin-top:6px">
      <div class="card-title">Event Codes</div>
      <div style="font-size:11px;color:var(--text2);line-height:2">
        ${Object.entries(EVENT_LABELS).map(([k, v]) => `<div><span style="font-family:var(--font-mono);color:var(--accent)">${k}</span> — ${v}. <span style="color:var(--text3);font-size:10px">${EVENT_CONTEXT[k] || ''}</span></div>`).join('')}
      </div>
      <div class="card-title" style="margin-top:12px">Severity Levels</div>
      <div style="font-size:11px;color:var(--text2);line-height:2">
        <div><span style="color:#E24B4A">SEV-1</span> — Critical. Immediate action required.</div>
        <div><span style="color:#f97316">SEV-2</span> — High. Service within 2 weeks.</div>
        <div><span style="color:#EF9F27">SEV-3</span> — Medium. Monitor closely.</div>
        <div><span style="color:#378ADD">SEV-4</span> — Low. Informational.</div>
      </div>
    </div>
  </details>`;

  el.innerHTML = h;

  // Draw timeline after DOM ready
  setTimeout(() => drawEventTimeline(evList), 50);
}

function drawEventTimeline(evList) {
  const canvas = document.getElementById('event-timeline');
  if (!canvas || !evList || !evList.length) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || canvas.parentElement?.offsetWidth || 600;
  canvas.width = W; canvas.height = 60;
  ctx.clearRect(0, 0, W, 60);

  const weeks = [...new Set(evList.map(e => e.week_number))].sort((a, b) => a - b);
  const wMin = weeks[0], wMax = weeks[weeks.length - 1];
  const wRange = Math.max(wMax - wMin, 1);

  // Base line
  ctx.strokeStyle = '#e4e2de'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(W - 20, 30); ctx.stroke();

  // Event dots
  evList.forEach(ev => {
    const x = 20 + ((ev.week_number - wMin) / wRange) * (W - 40);
    const col = SEV_COLORS_MAP[ev.severity] || '#888';
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, 30, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const code = evtCodeShort(ev);
    ctx.fillText(code.replace('E', ''), x, 30);
  });

  // Week labels
  ctx.fillStyle = '#999'; ctx.font = '9px monospace';
  ctx.textAlign = 'left'; ctx.fillText('W' + wMin, 20, 52);
  ctx.textAlign = 'right'; ctx.fillText('W' + wMax, W - 20, 52);
}

// ════════════════════════════════════════════════════════════════
// DEEPDIVE TAB — renderDeepdive (Phase 3)
// ════════════════════════════════════════════════════════════════
const VERDICT_CONFIG = {
  PHYSICS_CONFIRMED:{cls:'red',label:'Physics confirmed',summary:'Signal triangulation confirms a real electrochemical issue. At least one signal >1.5σ at complaint window. OEM action recommended.'},
  PROGRESSIVE:{cls:'red',label:'Progressive degradation',summary:'Sustained multi-signal decline confirmed. Systematic degradation in progress.'},
  ESCALATED:{cls:'amb',label:'Escalated — OEM review',summary:'Evidence crosses threshold for OEM warranty investigation.'},
  WEAK_SIGNAL:{cls:'amb',label:'Weak signal',summary:'Signals present but below 1.5σ threshold. Possible early warning — monitor closely.'},
  UNCONFIRMED:{cls:'text3',label:'Unconfirmed — operator issue likely',summary:'Complaints present but telemetry does not corroborate. Possible operator misuse or charging issue.'},
  NO_COMPLAINTS:{cls:'blue',label:'No complaints — telemetry only',summary:'No operator complaints. Investigation triggered by telemetry signals alone. Early warning mode.'},
  NO_DATA:{cls:'text3',label:'No investigation data',summary:'Insufficient complaint or signal history for investigation verdict.'}
};

function deepNarrative(inv, bat, evList, verdict) {
  const tier = bat.tier_label_v2 || 'UNSCORED';
  const score = Math.round(bat.operational_score || 0);
  const complaintCount = inv?.n_complaints || 0;
  const wks = bat.weekly_trend || [];
  const latest = wks.length ? wks[wks.length-1] : {};
  const effLoss = bat.efficiency_score_v2 ? Math.round(100 - bat.efficiency_score_v2) : 0;
  const spread = Math.round(latest.cell_spread_max || 0);

  const trigger = complaintCount > 0
    ? `This battery was investigated because ${complaintCount} operator complaint${complaintCount>1?'s were':' was'} recorded.`
    : 'This battery was investigated because telemetry signals crossed the investigation threshold — no operator complaint was required.';

  const found = effLoss > 20
    ? `Platform analysis found efficiency ${effLoss}% below commissioning baseline${spread>100?', with cell spread at '+spread+'mV':''}.`
    : 'Platform analysis examined all available signals against baseline and fleet context.';

  const vs = {
    PHYSICS_CONFIRMED:'The verdict is PHYSICS CONFIRMED — at least one signal exceeded 1.5σ at the complaint window.',
    PROGRESSIVE:'The verdict is PROGRESSIVE DEGRADATION — multiple signals show sustained decline.',
    WEAK_SIGNAL:'The verdict is WEAK SIGNAL — signals present but below 1.5σ threshold. May be early-stage.',
    UNCONFIRMED:'The verdict is UNCONFIRMED — complaints exist but telemetry does not corroborate.',
    NO_COMPLAINTS:'No verdict issued — investigation triggered by telemetry only. Early warning mode.',
  }[verdict] || 'Investigation is ongoing.';

  const imp = {
    PHYSICS_CONFIRMED:'OEM warranty review and possible replacement are indicated.',
    PROGRESSIVE:'Schedule inspection within 2 weeks.',
    WEAK_SIGNAL:'Recheck in 4 weeks — if signals strengthen, verdict will update.',
    UNCONFIRMED:'Interview operator about charging behaviour and usage patterns.',
    NO_COMPLAINTS:'Proactive service could prevent future complaints.',
  }[verdict] || '';

  return `<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;font-size:12px;color:var(--text2);line-height:1.8">${trigger} ${found} ${vs} ${imp}</div>`;
}

function buildEvidenceChain(inv, bat) {
  let signals = [];
  if (inv?.signals_json) {
    const sj = typeof inv.signals_json === 'string' ? JSON.parse(inv.signals_json) : inv.signals_json;
    if (Array.isArray(sj) && sj.length > 0) {
      if (typeof sj[0] === 'string') signals = sj.map(s => ({signal:s, value:'—', sigma:'—', contribution:'MEDIUM'}));
      else signals = sj;
    }
  }
  if (!signals.length) {
    const wks = bat.weekly_trend || [];
    const latest = wks.length ? wks[wks.length-1] : {};
    const spread = parseFloat(latest.cell_spread_max || 0);
    const kps = latest.km_per_soc_pct;
    const vsag = parseFloat(latest.soc_corrected_voltage_sag || 0);
    if (kps) signals.push({signal:'Efficiency vs baseline',value:kps.toFixed(2)+' km/SoC%',sigma:'—',contribution:kps<0.8?'HIGH':'LOW'});
    if (spread) signals.push({signal:'Cell spread max',value:Math.round(spread)+'mV',sigma:(spread/50).toFixed(1),contribution:spread>150?'HIGH':spread>100?'MEDIUM':'LOW'});
    if (vsag) signals.push({signal:'Voltage sag',value:vsag.toFixed(3),sigma:((vsag-1)/0.1).toFixed(1),contribution:vsag>1.3?'HIGH':'LOW'});
  }
  return signals;
}

function reasoningChain(bat, inv, evList) {
  const wks = bat.weekly_trend || [];
  const latest = wks.length ? wks[wks.length-1] : {};
  const layers = [
    {label:'Layer 1 — Raw signals',cls:'blue',items:[
      latest.km_per_soc_pct?'Efficiency: '+latest.km_per_soc_pct.toFixed(2)+' km/SoC%':null,
      latest.temp_max?'Temperature: '+Math.round(latest.temp_max)+'°C max':null,
      latest.cell_spread_max?'Cell spread: '+Math.round(latest.cell_spread_max)+'mV':null,
    ].filter(Boolean)},
    {label:'Layer 2 — Computed features',cls:'grn',items:[
      bat.has_cusum?'CUSUM: ACTIVE — regime change':'CUSUM: No regime change',
      'Events detected: '+evList.length,
      latest.dod_mean?(function(){const r=latest.dod_mean>1?latest.dod_mean:latest.dod_mean*100;if(r<0||r>100)return 'DoD: Data pending';return 'DoD: '+Math.min(100,Math.max(0,r)).toFixed(1)+'%';})():null,
    ].filter(Boolean)},
    {label:'Layer 3 — Model outputs',cls:'amb',items:[
      'L1 Self-baseline: '+(bat.l1_score!=null?Math.round(bat.l1_score):Math.round(bat.efficiency_score_v2||0))+'/100 (50%)',
      'L2 Physics: '+(bat.l2_score!=null?Math.round(bat.l2_score):Math.round(bat.fault_risk_score||0))+'/100 (30%)',
      'L3 Fleet: '+(bat.l3_score!=null?Math.round(bat.l3_score):'—')+'/100 (20%)',
      bat.event_penalty?'Event penalty: -'+bat.event_penalty:null,
    ].filter(Boolean)},
    {label:'Layer 4 — Composite intelligence',cls:'red',items:[
      'Composite: '+Math.round(bat.operational_score||0)+'/100',
      'Tier: '+(bat.tier_label_v2||'—'),
      'Verdict: '+(inv?.verdict||'NO_DATA').replace(/_/g,' '),
    ]},
  ];
  const bgMap={blue:'#E6F1FB',grn:'#dcfce7',amb:'#fef3c7',red:'#fee2e2'};
  const bdMap={blue:'#3b82f6',grn:'#22c55e',amb:'#d97706',red:'#ef4444'};
  const txMap={blue:'#1e40af',grn:'#166534',amb:'#92400e',red:'#991b1b'};
  return layers.map((l,i)=>`<div style="background:${bgMap[l.cls]};border:1px solid ${bdMap[l.cls]};border-radius:8px;padding:10px 14px">
    <div style="font-size:9px;font-family:var(--font-mono);font-weight:600;color:${txMap[l.cls]};text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">${l.label}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${l.items.map(it=>'<span style="font-size:11px;color:'+txMap[l.cls]+';background:rgba(255,255,255,0.5);border-radius:4px;padding:2px 8px;font-family:var(--font-mono)">'+it+'</span>').join('')}</div>
  </div>${i<3?'<div style="text-align:center;font-size:14px;color:var(--text3);margin:2px 0;line-height:1">↓</div>':''}`).join('');
}

async function renderDeepdive() {
  const el = document.getElementById('tab-content');
  const [inv, bat, evData] = await Promise.all([
    get(`/api/battery/${S.bat}/investigation`),
    get(`/api/battery/${S.bat}`),
    get(`/api/battery/${S.bat}/events`),
  ]);
  if (!bat) { el.innerHTML = emptyState('Deepdive data unavailable'); return; }
  const evList = evData ? (Array.isArray(evData) ? evData : evData.events || []) : [];
  const hasInv = inv && inv.status !== 'no_investigation' && inv.verdict;
  const verdict = hasInv ? inv.verdict : (evList.length > 0 ? 'NO_COMPLAINTS' : 'NO_DATA');
  const vc = VERDICT_CONFIG[verdict] || VERDICT_CONFIG.NO_DATA;
  const vcColor = {'red':'var(--red)','amb':'var(--amb)','blue':'var(--blue)','grn':'var(--grn)','text3':'var(--text3)'}[vc.cls] || 'var(--text3)';
  const vcBg = {'red':'#fee2e2','amb':'#fef3c7','blue':'#E6F1FB','grn':'#dcfce7','text3':'var(--bg2)'}[vc.cls] || 'var(--bg2)';
  let h = '';

  // Section A — Verdict banner
  h += `<div style="background:${vcBg};border-left:4px solid ${vcColor};border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;margin-bottom:12px">
    <div style="font-family:var(--font-head);font-size:20px;font-weight:700;color:${vcColor};margin-bottom:4px">${vc.label.toUpperCase()}</div>
    <div style="font-size:12px;color:var(--text2);line-height:1.7">${vc.summary}</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text3);margin-top:6px">Rule 28: verdict requires ≥1 signal >1.5σ at complaint window. Event count alone is not a signal.</div>
  </div>`;

  // Section B — Deep narrative
  h += '<div class="sec-l">◈ Investigation narrative</div>';
  h += deepNarrative(hasInv ? inv : null, bat, evList, verdict);

  // Section C — Complaint timeline
  h += '<div class="sec-l">◈ Complaint timeline</div>';
  if (hasInv && inv.evidence_chain_json) {
    let chain = typeof inv.evidence_chain_json === 'string' ? JSON.parse(inv.evidence_chain_json) : inv.evidence_chain_json;
    if (chain && chain.length > 0) {
      chain.forEach((c, i) => {
        const sigs = c.signals || [];
        const hasSig = sigs.length > 0;
        h += `<div style="display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg3)">
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--text3)">#${i+1}<br><span style="font-size:9px">${(c.complaint_date||'').slice(0,10)}</span></div>
          <div><div style="font-size:11px;font-weight:500;color:var(--text);margin-bottom:2px">${hasSig ? sigs.length + ' signal(s) active' : 'No signals detected'}</div>
            ${hasSig ? sigs.map(s => '<div style="font-size:10px;font-family:var(--font-mono);color:var(--amb)">' + (s.signal || s) + (s.delta ? ' (' + (s.delta > 0 ? '+' : '') + s.delta.toFixed(1) + 'σ)' : '') + '</div>').join('') : '<div style="font-size:10px;color:var(--text3)">Telemetry within normal range at this complaint date</div>'}
          </div>
        </div>`;
      });
    } else {
      h += '<div style="padding:12px 14px;background:var(--bg2);border-radius:8px;font-size:11px;color:var(--text3)">No operator complaints recorded. Investigation triggered by telemetry signals crossing threshold.</div>';
    }
  } else {
    h += '<div style="padding:12px 14px;background:var(--bg2);border-radius:8px;font-size:11px;color:var(--text3)">' + (S.chem === 'LFP' ? 'LFP e-rickshaws do not have a formal complaint system. Investigation triggered by telemetry signals.' : 'No complaint data available for this battery.') + '</div>';
  }

  // Section D — Evidence chain
  h += '<div class="sec-l">◈ Evidence chain</div>';
  const signals = buildEvidenceChain(hasInv ? inv : null, bat);
  if (signals.length > 0) {
    h += '<div class="card"><table style="width:100%;font-size:12px;border-collapse:collapse"><tr style="font-family:var(--font-mono);font-size:9px;color:var(--text3)"><th style="text-align:left;padding:4px 8px">SIGNAL</th><th>VALUE</th><th>σ FROM BASELINE</th><th>CONTRIBUTION</th></tr>';
    signals.forEach(s => {
      const contCol = s.contribution === 'HIGH' ? 'var(--red)' : s.contribution === 'MEDIUM' ? 'var(--amb)' : 'var(--grn)';
      h += `<tr style="border-top:1px solid var(--bg2)"><td style="padding:6px 8px">${s.signal}</td><td style="text-align:center;font-family:var(--font-mono)">${s.value||'—'}</td><td style="text-align:center;font-family:var(--font-mono)">${s.sigma||'—'}σ</td><td style="text-align:center;color:${contCol};font-family:var(--font-mono);font-size:10px">${s.contribution||'—'}</td></tr>`;
    });
    const qualifying = signals.filter(s => parseFloat(s.sigma) > 1.5).length;
    h += `</table><div style="font-family:var(--font-mono);font-size:9px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--bg3)">Rule 28: verdict requires ≥1 signal >1.5σ. ${qualifying} signal${qualifying!==1?'s':''} qualif${qualifying!==1?'y':'ies'}.</div></div>`;
  } else {
    h += '<div class="card"><div style="color:var(--text3);font-size:12px;padding:8px 0">No signal evidence available.</div></div>';
  }

  // Section E — 4-layer reasoning chain
  h += '<div class="sec-l">◈ Reasoning chain — intelligence trace</div>';
  h += '<div class="card">' + reasoningChain(bat, hasInv ? inv : null, evList) + '</div>';

  // Section F — External conditions
  const month = new Date().getMonth();
  const season = month>=2&&month<=4?'Peak Summer':month>=5&&month<=8?'Monsoon':month>=9&&month<=10?'Post-monsoon':'Winter';
  h += `<div class="sec-l">◈ External conditions</div><div style="padding:10px 14px;background:var(--bg2);border-radius:8px;border:1px solid var(--bg3);margin-bottom:10px"><div style="font-size:11px;color:var(--text2);line-height:1.7"><strong>Season:</strong> ${season}<br><strong>India context:</strong> ${season==='Peak Summer'?'Ambient 40–45°C — peak thermal stress. Charging in direct sunlight adds 10–15°C to cell temp.':season==='Monsoon'?'High humidity can affect cell insulation. Power cuts cause charging irregularities.':'Moderate conditions — not a high-stress season.'}</div></div>`;

  // Section G — OEM panel (NMC) or LFP note
  if (S.chem === 'NMC' && hasInv) {
    const warrantyVerdict = verdict==='PHYSICS_CONFIRMED'||verdict==='PROGRESSIVE' ? 'WARRANTY REVIEW INDICATED' : verdict==='UNCONFIRMED' ? 'OPERATOR ISSUE — warranty not indicated' : 'MONITORING';
    h += `<div class="sec-l">◈ OEM action panel</div><div style="background:#E6F1FB;border:1px solid rgba(55,138,221,0.3);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;color:${verdict==='PHYSICS_CONFIRMED'||verdict==='PROGRESSIVE'?'var(--red)':'var(--amb)'}margin-bottom:6px">${warrantyVerdict}</div>
      <div style="font-size:11px;color:#1e40af;line-height:1.7">${inv.oem_action || 'No OEM action specified.'}</div>
      <div style="font-family:var(--font-mono);font-size:9px;color:#1e40af;margin-top:6px">Signal triangulation: complaints = search trigger · telemetry = verdict</div>
    </div>`;
  } else {
    h += `<div style="padding:14px 16px;background:var(--bg2);border-radius:8px;border:1px solid var(--bg3);margin-bottom:10px;font-size:11px;color:var(--text2);line-height:1.7"><strong>LFP investigation — telemetry only:</strong> LFP e-rickshaws do not have a formal complaint system. Investigation triggered by telemetry signals. Use Field Validation feedback in Health tab for field observations.</div>`;
  }

  el.innerHTML = h;
}

// ════════════════════════════════════════════════════════════════
// SERVICE TAB — renderService (Phase 3)
// ════════════════════════════════════════════════════════════════
async function renderService() {
  const el = document.getElementById('tab-content');
  const EVENT_WHITELIST = new Set([
    'CELL_BALANCE','VOLTAGE_SAG','WARRANTY_FLAG','TIER_CHANGE',
    'ACTION_RECOMMENDED','SOX_EVENT','THERMAL_EVENT',
    'DEEP_DISCHARGE','CHARGING_ANOMALY','CELL_IMBALANCE'
  ]);
  const _svcFilterEvents = arr => Array.isArray(arr) ? arr.filter(e => !e || !e.event_type || EVENT_WHITELIST.has(e.event_type)) : arr;
  const [svc, bat, soxDetail, cellImb, iotHealth] = await Promise.all([
    get(`/api/battery/${S.bat}/service`),
    get(`/api/battery/${S.bat}`),
    get(`/api/battery/${S.bat}/sox-detail`).catch(()=>null),
    get(`/api/battery/${S.bat}/cell-imbalance`).catch(()=>null),
    get(`/api/battery/${S.bat}/iot-health`).catch(()=>null),
  ]);
  if (!bat || bat.error) { el.innerHTML = emptyState('Battery data unavailable','No telemetry data for '+S.bat+'. Check IoT connection.'); return; }
  if (svc && typeof svc === 'object') {
    if (Array.isArray(svc.events)) svc.events = _svcFilterEvents(svc.events);
    if (Array.isArray(svc.service_events)) svc.service_events = _svcFilterEvents(svc.service_events);
    if (Array.isArray(svc.vehicle_events)) svc.vehicle_events = _svcFilterEvents(svc.vehicle_events);
  }
  let h = '';

  // Mandatory disclaimer
  h += '<div style="background:#E6F1FB;border-left:3px solid #378ADD;border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:12px;font-size:11px;color:#1e40af;line-height:1.6"><strong>Service scheduling only</strong> — this tab informs when to schedule service, not whether the battery is healthy. Health decisions are in the Health and Deepdive tabs. Track O (operational) signals here cannot trigger replacement recommendations.</div>';

  if (S.chem === 'NMC' && svc && svc.forecast) {
    const fc = svc.forecast;
    const p30 = parseFloat(fc.p_complaint_30d || 0);
    const p60 = parseFloat(fc.p_complaint_60d || 0);
    const p90 = parseFloat(fc.p_complaint_90d || 0);
    const median = fc.median_days_to_complaint ? Math.round(fc.median_days_to_complaint) : null;

    h += '<div class="sec-l">◈ Service forecast (NMC survival model)</div><div class="card">';
    [{l:'P(complaint in 30 days)',v:p30},{l:'P(complaint in 60 days)',v:p60},{l:'P(complaint in 90 days)',v:p90}].forEach(p => {
      const pct = Math.round(p.v * 100);
      const col = pct > 70 ? 'var(--red)' : pct > 40 ? 'var(--amb)' : 'var(--grn)';
      const risk = pct > 70 ? 'HIGH RISK' : pct > 40 ? 'MEDIUM' : 'LOW';
      h += `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:11px;color:var(--text3)">${p.l}</span><span style="font-family:var(--font-mono);font-size:11px;color:${col}">${pct}% · ${risk}</span></div><div style="height:20px;background:var(--bg3);border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${col};border-radius:4px"></div></div></div>`;
    });
    if (median) h += `<div style="text-align:center;padding:14px 0;border-top:1px solid var(--bg3)"><div style="font-family:var(--font-head);font-size:36px;font-weight:700;color:var(--accent)">${median}</div><div style="font-size:11px;color:var(--text3)">median days to next complaint</div></div>`;
    h += `<div style="font-family:var(--font-mono);font-size:9px;color:var(--text3)">Weibull AFT · C-index: 0.600 · ${fc.model_version || 'nmc_survival_v2.1.0'}</div></div>`;

    // Silent degrader
    const isSilent = svc.silent_degrader || (p30 < 0.3 && bat && bat.operational_score < 50);
    if (isSilent) {
      h += '<div style="background:rgba(239,68,68,0.06);border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0"><strong style="color:var(--red)">Silent degrader detected</strong><div style="font-size:11px;color:var(--red);margin-top:3px;line-height:1.6">This battery shows high signal severity with few or no complaints. Rule 29: survival model underestimates silent degraders. Do not use P(complaint) as proxy for health — see Health tab.</div></div>';
    }

    // Service priority
    const priority = p30 > 0.7 ? 'HIGH' : p30 > 0.4 ? 'MEDIUM' : 'LOW';
    const priorityCol = priority === 'HIGH' ? 'var(--red)' : priority === 'MEDIUM' ? 'var(--amb)' : 'var(--grn)';
    h += `<div class="sec-l">◈ Service priority</div><div class="card" style="border-left:3px solid ${priorityCol}"><div style="font-size:14px;font-weight:600;color:${priorityCol};margin-bottom:4px">${priority} PRIORITY</div><div style="font-size:11px;color:var(--text2);line-height:1.7">${p30>0.7?'High complaint probability — schedule inspection this week.':p30>0.4?'Moderate risk — schedule inspection within 3 weeks.':'Low near-term risk — routine service schedule.'}</div></div>`;

    // Complaint history
    const complaints = svc.complaints || [];
    if (complaints.length > 0) {
      h += '<div class="sec-l">◈ Complaint history</div><div class="card"><table style="width:100%;font-size:12px;border-collapse:collapse"><tr style="font-family:var(--font-mono);font-size:9px;color:var(--text3)"><th style="text-align:left;padding:4px 8px">#</th><th>DATE</th><th>TYPE</th><th>RESOLUTION</th><th>DELTA mV</th></tr>';
      complaints.forEach((c, i) => {
        h += `<tr style="border-top:1px solid var(--bg2)"><td style="padding:5px 8px;font-family:var(--font-mono)">${i+1}</td><td style="font-size:10px">${(c.complaint_date||'').slice(0,10)}</td><td style="font-size:10px;color:var(--text2)">${c.diagnosis_category||c.complaint_category||'—'}</td><td style="font-size:10px">${c.resolution_type||'—'}</td><td style="font-family:var(--font-mono);text-align:center">${c.delta_mv!=null?Math.round(c.delta_mv):'—'}</td></tr>`;
      });
      h += '</table></div>';
    }
  } else {
    // ── Fix 10 (2E): Service Group card ──
    const _sgAction = bat.rul_action_v2 || '';
    const _sgFault  = bat.fault_severity || '';
    const _sgIot    = (iotHealth && iotHealth.iot_status) || bat.iot_device_health || '';
    const _sgImb    = (cellImb && cellImb.imbalance_tier) || '';
    let sg;
    if (_sgAction === 'EXIT_NOW' || _sgAction === 'REPLACE_PLAN' || _sgAction === 'PHYSICS_REPLACE_PLAN' || _sgFault === 'CRITICAL' || _sgFault === 'HIGH') {
      sg = { group:'Replace', color:'var(--red)', text:'Replacement required. Battery at or near operational floor \u2014 full fault narrative below.' };
    } else if (_sgIot === 'CRITICAL') {
      sg = { group:'IoT', color:'var(--text3)', text:'IoT device issue \u2014 battery chemistry unknown. Replace device (\u20B91,500) before any battery decision. This is a device issue, not a battery fault.' };
    } else if (_sgImb === 'ACUTE' || _sgImb === 'ESCALATION') {
      sg = { group:'Cell Balance', color:'var(--amb)', text:'Cell imbalance active. Balance service recommended before replacement \u2014 range recovery possible.' };
    } else if (_sgAction === 'ROUTE_SHORTEN') {
      sg = { group:'Route Shorten', color:'var(--blue)', text:'Range below route floor. NOT a battery fault \u2014 capacity intact for lighter routes. Operator action only.' };
    } else if (_sgAction === 'MONITOR_INVESTIGATE' || _sgAction === 'MONITOR_WEEKLY' || _sgAction === 'MONITOR') {
      sg = { group:'Monitor', color:'var(--text3)', text:'Anomaly active, attribution in progress. No dispatch needed this week.' };
    } else {
      sg = { group:'Healthy', color:'var(--grn)', text:'Confirmed healthy. Platform monitoring weekly. No service visit needed.' };
    }
    h += `<div class="card" style="border-left:4px solid ${sg.color};margin-bottom:14px"><div class="card-title">Service Group</div><div style="font-size:16px;font-weight:600;color:${sg.color};margin-bottom:4px">${sg.group}</div><div style="font-size:12px;color:var(--text2);line-height:1.6">${sg.text}</div></div>`;

    // ── 3-card grid: SOX / Cell imbalance / IoT (2C-A) ──
    const soxColors = {HEALTHY:'var(--grn)',EARLY_WARNING:'var(--amb)',MODERATE:'var(--accent)',POWER_DEGRADED:'var(--red)',CRITICAL:'var(--red)',SILENT_SOX:'var(--text3)'};
    const soxCol = soxColors[soxDetail && soxDetail.sox_tier] || 'var(--text3)';
    const ciColors = {HEALTHY:'var(--grn)',EARLY_WARNING:'var(--amb)',ACUTE:'var(--red)'};
    const ciCol = ciColors[cellImb && cellImb.imbalance_tier] || 'var(--text3)';
    const iotColors = {HEALTHY:'var(--grn)',DEGRADING:'var(--amb)',CRITICAL:'var(--red)'};
    const iotCol = iotColors[iotHealth && iotHealth.iot_status] || 'var(--text3)';

    h += '<div class="g3" style="margin-bottom:14px">';
    h += `<div class="card" style="border-left:3px solid ${soxCol}"><div class="card-title">SOX \u2014 State of Power</div><div style="font-size:16px;font-weight:600;color:${soxCol}">${(soxDetail && soxDetail.sox_tier) || '\u2014'}</div><div style="font-size:11px;color:var(--text2);margin-top:4px">${(soxDetail && soxDetail.events_active) || 0} events active \xB7 ${(soxDetail && soxDetail.trajectory) || '\u2014'}</div></div>`;
    const _ciSpread = (cellImb && cellImb.cell_spread_mv != null) ? Math.round(cellImb.cell_spread_mv) : '\u2014';
    const _ciThr = (cellImb && (cellImb.threshold_mv ?? cellImb.fleet_p75_spread_mv) != null) ? Math.round(cellImb.threshold_mv ?? cellImb.fleet_p75_spread_mv) : '\u2014';
    h += `<div class="card" style="border-left:3px solid ${ciCol}"><div class="card-title">Cell Imbalance</div><div style="font-size:16px;font-weight:600;color:${ciCol}">${(cellImb && cellImb.imbalance_tier) || '\u2014'}</div><div style="font-size:11px;color:var(--text2);margin-top:4px">Spread: ${_ciSpread}mV (threshold: ${_ciThr}mV)</div></div>`;
    const iotCritical = iotHealth && iotHealth.iot_status === 'CRITICAL';
    h += `<div class="card" style="border-left:3px solid ${iotCol}"><div class="card-title">IoT Device</div><div style="font-size:16px;font-weight:600;color:${iotCol}">${(iotHealth && iotHealth.iot_status) || '\u2014'}</div>${iotCritical ? '<div style="font-size:10px;color:var(--red);margin-top:4px;line-height:1.5">Replace device (\u20B91,500) before any battery decision. This is a device issue \u2014 not battery failure.</div>' : ''}</div>`;
    h += '</div>';

    // LFP service: use consequence chain + observations
    let [cc, obs] = await Promise.all([
      get(`/api/battery/${S.bat}/consequence-chain`).catch(()=>null),
      get(`/api/battery/${S.bat}/observations`).catch(()=>null),
    ]);
    if (Array.isArray(obs)) obs = _svcFilterEvents(obs);
    else if (obs && Array.isArray(obs.observations)) obs.observations = _svcFilterEvents(obs.observations);
    if (cc && cc.fault_severity) {
      h += renderFaultService(cc, obs);
    } else {
      h += '<div class="sec-l">\u25C8 Service guidance</div><div style="padding:12px 14px;background:var(--bg2);border-radius:8px;font-size:11px;color:var(--text2);line-height:1.7"><strong>LFP service forecast:</strong> No survival model for LFP. Service scheduling based on Health tab tier and event count. Recommended: inspect WATCH or worse tier every 4 weeks. Replace CRITICAL tier within 2 weeks.</div>';
    }
  }

  el.innerHTML = h;
}

// ════════════════════════════════════════════════════════════════
// DEKF TAB — renderDEKF (Phase 3)
// ════════════════════════════════════════════════════════════════
async function renderDEKF() {
  const el = document.getElementById('tab-content');
  const [dekf, status, bat, socData] = await Promise.all([
    get(`/api/battery/${S.bat}/dekf`),
    get(`/api/battery/${S.bat}/dekf/status`),
    get(`/api/battery/${S.bat}`),
    get(`/api/battery/${S.bat}/soc-profile`).catch(()=>null),
  ]);
  if (!bat || bat.error) { el.innerHTML = emptyState('Battery data unavailable','No telemetry data for '+S.bat+'. Check IoT connection.'); return; }
  const chem = (status && status.chemistry) || bat?.chemistry || S.chem;
  const shadowExists = dekf && dekf.data && dekf.data.length > 0;
  let h = '';

  // ── DEKF SOC section (2C-B) ──
  h += '<div class="sec-l">\u25C8 DEKF SOC \u2014 This battery</div>';
  const _dekfSocAvail = socData && (socData.dekf_soc_available === 1 || socData.dekf_soc_available === true || socData.soc_dekf_available === 1 || socData.soc_dekf_available === true);
  if (_dekfSocAvail) {
    const _d2  = (socData.soc_dekf_latest ?? 0);
    const _b2  = (socData.bms_soc_latest ?? socData.bms_soc_reconstructed ?? 0);
    const _cr2 = (socData.soc_correction_mean ?? socData.soc_bms_correction_pct ?? 0);
    const _cf2 = socData.dekf_confidence ?? socData.soc_dekf_confidence ?? '\u2014';
    const d2 = (+_d2).toFixed(1);
    const b2 = (+_b2).toFixed(1);
    const cr2 = (+_cr2).toFixed(2);
    const cr2Sign = parseFloat(cr2) > 0 ? '+' : '';
    const cr2Col = parseFloat(cr2) < 0 ? 'var(--red)' : 'var(--grn)';
    const cf2Col = ({HIGH:'var(--grn)',MEDIUM:'var(--amb)',LOW:'var(--red)'})[_cf2] || 'var(--text3)';

    h += `<div class="g3" style="margin-bottom:10px"><div class="card" style="text-align:center"><div class="sig-label">DEKF SOC</div><div class="sig-value" style="font-size:28px;color:var(--accent)">${d2}<span class="sig-unit">%</span></div><span style="font-size:9px;padding:2px 6px;border-radius:4px;background:${cf2Col}18;color:${cf2Col};font-family:var(--font-mono)">${_cf2}</span></div><div class="card" style="text-align:center"><div class="sig-label">BMS Reported</div><div class="sig-value" style="font-size:28px;color:var(--text2)">${b2}<span class="sig-unit">%</span></div><div style="font-size:10px;color:var(--text3)">Not reliable for LFP</div></div><div class="card" style="text-align:center"><div class="sig-label">BMS Bias</div><div class="sig-value" style="font-size:28px;color:${cr2Col}">${cr2Sign}${cr2}<span class="sig-unit">%</span></div><div style="font-size:10px;color:var(--text3)">BMS overread correction</div></div></div>`;

    h += '<canvas id="dekf-soc-weekly" height="160" style="margin-bottom:10px"></canvas>';
    h += '<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:10px;color:var(--text3);line-height:1.7">DEKF SOC corrects for BMS firmware bias. GE (SIGNED): BMS overreads SOC by 4.44% on average. SG (MAG_ONLY): BMS overreads by 1.0%. LFP SoC MAPE 25.1% is a physics constraint from the flat OCV plateau at 3.2\u20133.4V \u2014 not a software limitation.</div>';
  } else {
    h += '<div class="card" style="color:var(--text3);font-size:11px;font-family:var(--font-mono)">DEKF SOC estimate not available for this battery.</div>';
  }

  // Shadow mode banner
  h += '<div style="background:#E6F1FB;border:1px solid rgba(55,138,221,0.3);border-radius:8px;padding:10px 14px;margin-bottom:12px"><div style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:#1e40af;margin-bottom:3px">DEKF SHADOW MODE ACTIVE</div><div style="font-size:11px;color:#1e40af;line-height:1.6">Dual Extended Kalman Filter running in parallel — not influencing production scores. R0 promoted for both chemistries. SoC tracks remain in shadow.</div></div>';

  // 4-track promotion status
  h += '<div class="sec-l">◈ Track promotion status</div>';
  const tracks = [
    {label:'NMC R0',status:'PROMOTED',metric:'7.3% MAPE vs pulse ECM',note:'Battery-specific OCV · decoupled R0/SoC · 27 batteries',cls:'grn'},
    {label:'LFP R0',status:'PROMOTED',metric:'100% ECM agreement',note:'Thermal proxy only (Rule 14) — not a degradation signal',cls:'grn'},
    {label:'NMC SoC',status:'SHADOW',metric:'10.8% correction (gate <8%)',note:'Close to gate — Q_nominal tuning pending',cls:'amb'},
    {label:'LFP SoC',status:'SHADOW',metric:'25.1% correction (gate <10%)',note:'Physics floor — flat OCV 3.2–3.4V across 20–80% SoC',cls:'amb'},
  ];
  h += '<div class="g2">';
  tracks.forEach(t => {
    const badgeCol = t.cls === 'grn' ? '#166534' : '#92400e';
    const badgeBg = t.cls === 'grn' ? '#dcfce7' : '#fef3c7';
    h += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-family:var(--font-mono);font-size:12px;font-weight:600">${t.label}</span><span style="padding:2px 8px;border-radius:12px;font-size:9px;font-family:var(--font-mono);background:${badgeBg};color:${badgeCol};font-weight:600">${t.status}</span></div><div style="font-size:12px;color:var(--text2);margin-bottom:3px">${t.metric}</div><div style="font-size:10px;color:var(--text3)">${t.note}</div></div>`;
  });
  h += '</div>';

  // R0 chart
  h += '<div class="sec-l">◈ R0 tracking</div><div class="card"><div style="position:relative;height:100px"><canvas id="dekf-r0-chart"></canvas></div><div style="font-size:9px;color:var(--text3);font-family:var(--font-mono);margin-top:4px">DEKF R0 (orange) vs ECM baseline (blue dashed) · per cell · mΩ</div></div>';

  // LFP Rule 14 note
  if (chem === 'LFP') {
    h += '<div style="background:#fef3c7;border-left:3px solid var(--amb);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:11px;color:var(--amb);line-height:1.6"><strong>Rule 14 — LFP R0 is thermal proxy only.</strong> LFP internal resistance increases with temperature, not just degradation. Do not interpret as a health or degradation signal for LFP. Use efficiency trajectory and cell spread for LFP health assessment.</div>';
    // SoC physics note
    h += '<div style="background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:11px;color:var(--text2);line-height:1.7"><strong>Why LFP SoC is in shadow:</strong> LFP pack voltage is flat at 3.2–3.4V across 20–80% SoC — the electrochemical plateau. A Kalman filter uses voltage as the observation signal. In the flat region, voltage carries near-zero information about SoC. This is a chemistry constraint, not a filter deficiency. DEKF provides R0 and covariance tracking — SoC primary estimation uses Coulomb counting.</div>';
  }

  // Promotion checklist
  h += '<div class="sec-l">◈ Promotion checklist</div><div class="card">';
  const checks = chem === 'NMC' ? [
    {label:'R0 MAPE < 8%',done:true,value:'7.3% ✓'},
    {label:'SoC correction < 8%',done:false,value:'10.8% — 2.8pp gap'},
    {label:'Zero diverged batteries',done:true,value:'0/27 ✓'},
    {label:'Q_nominal selective fix',done:false,value:'Pending'},
  ] : [
    {label:'R0 ECM agreement 100%',done:true,value:'100% ✓'},
    {label:'SoC correction < 10%',done:false,value:'25.1% — physics floor'},
    {label:'Zero diverged batteries',done:true,value:'0/179 ✓'},
    {label:'OCV flat region handling',done:true,value:'Dual-observation ✓'},
  ];
  checks.forEach(c => {
    const icon = c.done ? '✓' : '✗';
    const col = c.done ? 'var(--grn)' : 'var(--amb)';
    h += `<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="color:${col};font-size:14px;font-weight:700">${icon}</span><span style="font-size:12px;color:var(--text2)">${c.label}</span><span style="font-family:var(--font-mono);font-size:10px;color:${col};margin-left:auto">${c.value}</span></div>`;
  });
  h += '</div>';

  // Promote command
  h += `<div style="font-family:var(--font-mono);font-size:10px;color:var(--text3);padding:8px 12px;background:var(--bg2);border-radius:6px;margin-top:8px">To promote SoC when gate is met: <code style="background:var(--bg3);padding:2px 6px;border-radius:3px">python pipeline/dekf_promote.py --chemistry ${chem} --track soc --confirm</code></div>`;

  el.innerHTML = h;

  // Draw R0 chart after DOM ready
  setTimeout(() => drawDEKFR0Chart(dekf, chem), 50);

  // Weekly SOC chart (Y axis fixed 0-100) — 2C-B
  setTimeout(() => {
    const sWeekly = (socData && socData.soc_weekly_trend) || [];
    const sCanvas = document.getElementById('dekf-soc-weekly');
    if (!sCanvas) return;
    if (sCanvas._chart) { try { sCanvas._chart.destroy(); } catch(e) {} }
    if (sWeekly.length >= 2) {
      sCanvas._chart = new Chart(sCanvas, {
        type: 'line',
        data: {
          labels: sWeekly.map(w => 'W' + w.week_number),
          datasets: [

async function updateAnalyticsChart() {
  const xKey = document.getElementById('ax-x')?.value;
  const yKey = document.getElementById('ax-y')?.value;
  const zKey = document.getElementById('ax-z')?.value;
  const chartType = document.getElementById('ax-type')?.value || 'line';
  if (!xKey || !yKey || !S.bat) return;

  try { localStorage.setItem('analytics_'+S.bat, JSON.stringify({x:xKey,y:yKey,z:zKey||'',chartType})); } catch(e) {}

  const xMeta = ANALYTICS_AXES.x.find(a=>a.value===xKey) || {label:xKey,unit:''};
  const yMeta = ANALYTICS_AXES.y.find(a=>a.value===yKey) || {label:yKey,unit:'',color:'#f97316'};
  const zMeta = zKey ? ANALYTICS_AXES.y.find(a=>a.value===zKey) : null;

  const bat = await get(`/api/battery/${S.bat}`);
  const weekly = bat?.weekly_trend || [];
  if (!weekly.length) { const t = document.getElementById('analytics-chart-title'); if(t) t.textContent='No weekly data available'; return; }

  function getX(w, i) {
    if (xKey==='week_number') return w.week_number||i;
    if (xKey==='cumulative_km') { const v=getVal(w,'cumulative_km'); return v!==null?v:(i*50); }
    if (xKey==='weeks_in_service') return i+1;
    return i;
  }
  // Confirmed VWF fields in weekly_trend (db_api.py /api/battery/:id):
  // week_number, km_per_soc_pct, cell_spread_mean, cell_spread_max, temp_max, temp_avg_clean,
  // dod_mean, cusum_flag, avg_speed, trip_count, voltage_mean, voltage_min,
  // current_discharge_mean, soc_min, km_sum, cumulative_km, charge_cycle_rate
  function getVal(w, key) {
    const v = w[key]; if (v!==undefined&&v!==null&&v!=='') return parseFloat(v);
    const FIELD_MAP = {
      km_per_soc_pct:['efficiency','kps','km_per_soc'],
      cell_spread_max:['cell_spread','spread_max','max_cell_spread'],
      cell_spread_mean:['spread_mean','mean_cell_spread'],
      voltage_mean:['pack_voltage_mean','voltage_avg','v_mean'],
      voltage_min:['pack_voltage_min','min_voltage','v_min'],
      current_discharge_mean:['current_mean','avg_current','discharge_current_mean'],
      soc_min:['soc_minimum','min_soc'],
      temp_max:['temperature_max','max_temp','peak_temp'],
      temp_avg_clean:['temp_mean','temperature_mean','avg_temp'],
      km_sum:['km_total','km_week','total_km','weekly_km'],
      charge_cycle_rate:['charge_cycles','cycles_per_week'],
      cumulative_km:['total_km_driven','km_cumulative'],
      dod_mean:['dod','depth_of_discharge'],
      avg_speed:['speed_mean','mean_speed'],
      trip_count:['trips_per_week','trips'],
    };
    for (const f of (FIELD_MAP[key]||[])) { if(w[f]!==undefined&&w[f]!==null&&w[f]!=='') return parseFloat(w[f]); }
    return null;
  }

  const xVals = weekly.map((w,i)=>getX(w,i));
  const yVals = weekly.map(w=>getVal(w,yKey));
  const zVals = zKey ? weekly.map(w=>getVal(w,zKey)) : [];
  const validIdx = yVals.map((v,i)=>v!==null?i:null).filter(i=>i!==null);
  const xF = validIdx.map(i=>xVals[i]), yF = validIdx.map(i=>yVals[i]), zF = zKey ? validIdx.map(i=>zVals[i]) : [];

  if (!yF.length || yF.length < 2) { const canvas=document.getElementById('analytics-chart'); if(canvas && canvas.parentElement) canvas.parentElement.innerHTML = '<p class="empty-small">Not enough data yet — builds after 2+ weeks.</p>'; const t=document.getElementById('analytics-chart-title'); if(t) t.textContent='No data for '+yMeta.label; return; }
  if (window._analyticsChart) { try{window._analyticsChart.destroy();}catch(e){} window._analyticsChart=null; }

  const titleEl = document.getElementById('analytics-chart-title');
  if (titleEl) titleEl.textContent = `${yMeta.label}${zMeta?' vs '+zMeta.label:''} over ${xMeta.label} · ${S.bat} · ${yF.length} pts`;

  const labels = xF.map(v=>xKey==='week_number'?'W'+v:Math.round(v));
  const datasets = [{
    label:yMeta.label+' ('+yMeta.unit+')', data:chartType==='scatter'?xF.map((x,i)=>({x,y:yF[i]})):yF,
    borderColor:yMeta.color, backgroundColor:chartType==='bar'?yMeta.color+'99':yMeta.color+'15',
    borderWidth:chartType==='bar'?0:2, pointRadius:chartType==='scatter'?4:2, tension:0.3,
    fill:chartType==='line', yAxisID:'y1', borderRadius:chartType==='bar'?2:0,
  }];
  if (zMeta && zF.length) {
    datasets.push({
      label:zMeta.label+' ('+zMeta.unit+')', data:chartType==='scatter'?xF.map((x,i)=>({x,y:zF[i]})):zF,
      borderColor:zMeta.color, backgroundColor:'transparent', borderWidth:2, borderDash:[4,3],
      pointRadius:2, tension:0.3, fill:false, yAxisID:'y2',
    });
  }

  if (window._analyticsChart) { try{window._analyticsChart.destroy();}catch(e){} window._analyticsChart=null; }
  const canvas = document.getElementById('analytics-chart');
  if (!canvas) return;

  const scales = {
    x: { type:chartType==='scatter'?'linear':'category', labels:chartType!=='scatter'?labels:undefined,
      grid:{display:false}, ticks:{font:{size:9},maxRotation:0,maxTicksLimit:12} },
    y1: { position:'left', grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:9},callback:v=>typeof v==='number'?v.toFixed(yMeta.unit==='%'||yMeta.unit==='/100'?0:2)+yMeta.unit:v} },
  };
  if (zMeta) { scales.y2 = {position:'right',grid:{display:false},ticks:{font:{size:9},callback:v=>typeof v==='number'?v.toFixed(2)+zMeta.unit:v}}; }

  window._analyticsChart = new Chart(canvas, {
    type:chartType==='scatter'?'scatter':chartType,
    data:{labels:chartType!=='scatter'?labels:undefined, datasets},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:ctx=>`${xMeta.label}: ${ctx[0]?.label||''}`,
        label:ctx=>`${ctx.dataset.label}: ${(ctx.parsed?.y??ctx.raw?.y)?.toFixed(3)}`
      }}},
      scales
    }
  });

  // Legend
  const legendEl = document.getElementById('analytics-chart-legend');
  if (legendEl) legendEl.innerHTML = datasets.map(d=>`<div style="display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--font-mono);color:var(--text3)"><div style="width:20px;height:2px;background:${d.borderColor};${d.borderDash?'border-top:2px dashed '+d.borderColor+';background:none':''}"></div>${d.label}</div>`).join('');

  // Stats
  renderAnalyticsStats(yF, yMeta);
  // Insights
  renderAnalyticsInsights(yKey, yF, yMeta, weekly);
  // Table
  renderAnalyticsTable(xF, xMeta, yF, yMeta, zF, zMeta, xKey);
}

function renderAnalyticsStats(yV, yM) {
  const el = document.getElementById('analytics-stats');
  if (!el||!yV.length) return;
  const min=Math.min(...yV),max=Math.max(...yV),mean=yV.reduce((a,b)=>a+b,0)/yV.length,last=yV[yV.length-1],first=yV[0];
  const trend=last-first, trendPct=first>0?((trend/first)*100).toFixed(1):null;
  const goodUp = ['km_per_soc_pct','voltage_mean','voltage_min','soc_min','avg_speed'].includes(yM.value);
  const trendCls = trend>0?(goodUp?'grn':'red'):(goodUp?'red':'grn');
  const stat=(label,value,sub,cls='')=>`<div style="background:#fff;border:1px solid var(--bg3);border-radius:8px;padding:8px 10px;text-align:center"><div style="font-size:9px;font-family:var(--font-mono);color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px">${label}</div><div style="font-size:15px;font-weight:700;font-family:var(--font-head);color:${cls?'var(--'+cls+')':'var(--text)'}">${value}</div>${sub?'<div style="font-size:9px;color:var(--text3);margin-top:1px">'+sub+'</div>':''}</div>`;
  el.innerHTML=[stat('Current',last.toFixed(2),yM.unit),stat('Mean',mean.toFixed(2),yM.unit),stat('Min',min.toFixed(2),yM.unit,'text3'),stat('Max',max.toFixed(2),yM.unit,'text3'),stat('Trend',(trend>=0?'+':'')+trend.toFixed(2),trendPct?(trend>=0?'+':'')+trendPct+'% total':'',trendCls)].join('');
}

function renderAnalyticsInsights(yKey, yV, yM, weekly) {
  const el = document.getElementById('analytics-insights');
  if (!el||yV.length<4) return;
  const insights=[], first=yV[0], last=yV[yV.length-1], trend=last-first;
  const trendPct = first>0?(trend/first*100).toFixed(1):null;
  if (trendPct&&Math.abs(parseFloat(trendPct))>5) {
    const dir=trend>0?'increased':'decreased';
    const badDown=['km_per_soc_pct','voltage_mean','voltage_min','soc_min'], badUp=['cell_spread_max','cell_spread_mean','temp_max','temp_avg_clean','current_discharge_mean'];
    const concern=badDown.includes(yKey)?trend<0:badUp.includes(yKey)?trend>0:null;
    insights.push({type:concern===true?'warn':concern===false?'good':'info',text:`${yM.label} has ${dir} by ${Math.abs(parseFloat(trendPct))}% — from ${first.toFixed(2)} to ${last.toFixed(2)} ${yM.unit}.`});
  }
  const diffs=yV.slice(1).map((v,i)=>Math.abs(v-yV[i]));
  const avgDiff=diffs.reduce((a,b)=>a+b,0)/diffs.length, maxDiff=Math.max(...diffs);
  if (maxDiff>avgDiff*3&&avgDiff>0) {
    const spikeWk=weekly[diffs.indexOf(maxDiff)+1]?.week_number;
    insights.push({type:'warn',text:`Unusual spike detected${spikeWk?' at Week '+spikeWk:''} — single-week change of ${maxDiff.toFixed(2)} ${yM.unit} (${(maxDiff/avgDiff).toFixed(1)}× average).`});
  }
  if (yKey==='cell_spread_max') { const a150=yV.filter(v=>v>150).length,a100=yV.filter(v=>v>100).length; if(a150>0) insights.push({type:'warn',text:`${a150} week${a150>1?'s':''} above 150mV CRITICAL threshold.`}); else if(a100>0) insights.push({type:'info',text:`${a100} week${a100>1?'s':''} above 100mV WARNING threshold.`}); }
  if (yKey==='temp_max') { const hot=yV.filter(v=>v>45).length,warm=yV.filter(v=>v>40).length; if(hot>0) insights.push({type:'warn',text:`${hot} week${hot>1?'s':''} above 45°C thermal stress threshold.`}); else if(warm>0) insights.push({type:'info',text:`${warm} week${warm>1?'s':''} above 40°C elevated thermal threshold.`}); }
  if (yKey==='temp_avg_clean') { const high=yV.filter(v=>v>35).length; if(high>0) insights.push({type:'warn',text:`${high} week${high>1?'s':''} with sustained mean temperature above 35°C — accelerates calendar aging.`}); }
  if (yKey==='soc_min') { const deep=yV.filter(v=>v<10).length; if(deep>0) insights.push({type:'warn',text:`${deep} deep discharge event${deep>1?'s':''} (SoC <10%).`}); }
  if (yKey==='voltage_min') { const low=yV.filter(v=>v<48).length; if(low>0) insights.push({type:'warn',text:`${low} week${low>1?'s':''} with pack voltage below 48V — deep discharge zone for 16S LFP.`}); }
  if (yKey==='dod_mean') { const deep=yV.filter(v=>v>85).length; if(deep>0) insights.push({type:'warn',text:`${deep} week${deep>1?'s':''} with mean DoD above 85% — deep cycling accelerates degradation.`}); }
  if (!insights.length) insights.push({type:'good',text:`${yM.label} appears stable. No threshold breaches or unusual volatility detected.`});
  el.innerHTML='<div class="sec-l" style="margin-bottom:6px">◈ Automated insights</div>'+insights.map(ins=>{
    const bg=ins.type==='warn'?'rgba(217,119,6,0.06);border-left:3px solid var(--amb)':ins.type==='good'?'rgba(34,197,94,0.06);border-left:3px solid var(--grn)':'var(--bg2);border-left:3px solid var(--bg3)';
    return `<div style="background:${bg};border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:6px;font-size:11px;color:var(--text2);line-height:1.6">${ins.text}</div>`;
  }).join('');
}

function renderAnalyticsTable(xF, xM, yF, yM, zF, zM, xKey) {
  const el = document.getElementById('analytics-table');
  if (!el) return;
  el.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:11px;font-family:var(--font-mono)"><thead><tr style="border-bottom:1px solid var(--bg3)"><th style="text-align:left;padding:6px 8px;color:var(--text3);font-size:9px;text-transform:uppercase">${xM.label}</th><th style="text-align:right;padding:6px 8px;color:var(--text3);font-size:9px;text-transform:uppercase">${yM.label} (${yM.unit})</th>${zM?'<th style="text-align:right;padding:6px 8px;color:var(--text3);font-size:9px;text-transform:uppercase">'+zM.label+' ('+zM.unit+')</th>':''}</tr></thead><tbody>${xF.map((x,i)=>`<tr style="border-bottom:1px solid var(--bg3)"><td style="padding:5px 8px;color:var(--text3)">${xKey==='week_number'?'W'+x:Math.round(x)}</td><td style="padding:5px 8px;text-align:right;color:var(--text)">${yF[i]!=null?yF[i].toFixed(3):'—'}</td>${zM?'<td style="padding:5px 8px;text-align:right;color:var(--text3)">'+(zF[i]!=null?zF[i].toFixed(3):'—')+'</td>':''}</tr>`).join('')}</tbody></table>`;

function resetAnalytics() {
  try { localStorage.removeItem('analytics_'+S.bat); } catch(e) {}
  if(document.getElementById('ax-x')) document.getElementById('ax-x').value='week_number';
  if(document.getElementById('ax-y')) document.getElementById('ax-y').value='km_per_soc_pct';
  if(document.getElementById('ax-z')) document.getElementById('ax-z').value='';
  if(document.getElementById('ax-type')) document.getElementById('ax-type').value='line';
  updateAnalyticsChart();
  updateAxisObjective();
}

function updateAxisObjective() {
  const yKey = document.getElementById('ax-y')?.value;
  const xKey = document.getElementById('ax-x')?.value;
  const zKey = document.getElementById('ax-z')?.value;
  const yMeta = ANALYTICS_AXES.y.find(a=>a.value===yKey);
  const xMeta = ANALYTICS_AXES.x.find(a=>a.value===xKey);
  const zMeta = zKey ? ANALYTICS_AXES.y.find(a=>a.value===zKey) : null;
  const el = document.getElementById('analytics-objective');
  if (!el||!yMeta) return;
  const combo = ANALYTICS_COMBOS[yKey];

  el.innerHTML = `<div style="padding:8px 12px;background:var(--bg2);border-radius:8px;border:1px solid var(--bg3);font-size:11px;color:var(--text2);line-height:1.6"><strong style="color:var(--text)">${yMeta.label}</strong> — ${yMeta.objective}${xMeta?' <span style="color:var(--text3)">· X: '+xMeta.desc+'</span>':''}${zMeta?'<div style="margin-top:4px;color:var(--text3)">Z overlay: '+zMeta.objective+'</div>':''}${comboHTML}</div>`;
}

function applyCombo(x, y, z) {
  document.getElementById('ax-x').value = x;
