// ── RENDER CHAIN CARD (4 layers) ──
function renderChainCard(cid, data) {
  const def=CHAIN_NODES[cid];
  const isLive=PRIORITY.includes(cid);
  const nodes=def?def.nodes:[{type:'signal',value:'...',sub:'Awaiting data',s:null},{type:'physics',value:'...',sub:'Physics model',s:null},{type:'ml',value:'...',sub:'ML inference',s:null},{type:'cause',value:'...',sub:'Root cause',s:'operator'},{type:'decision',value:'...',sub:'Decision output',s:'operator',ok:true}];
  const layer2=def?def.layer2:['','','','',''];
  const layer3=def?def.layer3:CHAIN_META[cid].stakeholders.map(s=>({s:s,t:'Intelligence applied'}));
  const saving=def?def.saving:null;
  const demo=def?def.demo:null;
  const insights=CHAIN_INSIGHTS[cid]||getPlaceholderInsights(cid);

  // Update C12 insights with live data
  if(cid===12&&data?.regime_distribution){
    const rd=data.regime_distribution;
    const pre=rd.find(r=>r.degradation_regime==='PRE_KNEE');
    const app=rd.find(r=>r.degradation_regime==='APPROACHING_KNEE');
    const post=rd.find(r=>r.degradation_regime==='POST_KNEE');
    if(insights[0])insights[0].value=String((app||{}).n||58);
    if(insights[1])insights[1].value=String((post||{}).n||32);
    if(insights[2])insights[2].value=String((pre||{}).n||120);
  }

  let h='<div style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">';

  // Layer 1: Reasoning nodes
  h+='<div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:5px 14px;background:#F9FAFB;border-bottom:1px solid #F3F4F6;color:#9CA3AF">Layer 1 \u2014 reasoning chain</div>';
  h+='<div style="display:grid;grid-template-columns:repeat('+nodes.length+',1fr);border-bottom:1px solid #F3F4F6">';
  nodes.forEach((n,i)=>{
    const tc=NC[n.type]||(n.type==='decision'?(n.ok?NC.decision_ok:NC.decision_bad):'#9CA3AF');
    const sc_=n.s?SC[n.s]||SC.operator:null;
    const bg=((n.type==='cause'||n.type==='decision')&&sc_)?sc_.bg:'#fff';
    const valCol=((n.type==='cause'||n.type==='decision')&&sc_)?sc_.text:'#111827';
    const isLast=i===nodes.length-1;
    h+='<div style="padding:12px 12px;border-right:'+(isLast?'none':'1px solid #F3F4F6')+';border-left:3px solid '+tc+';background:'+bg+';position:relative;min-width:0">';
    h+='<div style="font-size:8px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:'+tc+';margin-bottom:5px">'+n.type+(n.s?' \u00B7 '+n.s.charAt(0).toUpperCase()+n.s.slice(1):'')+'</div>';
    h+='<div style="font-size:13px;font-weight:700;color:'+valCol+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">'+n.value+'</div>';
    h+='<div style="font-size:9px;color:#9CA3AF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4">'+n.sub+'</div>';
    if(!isLast)h+='<div style="position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:'+bg+';border-radius:50%;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;z-index:2;font-size:8px;color:#F97316;line-height:14px;text-align:center">\u203A</div>';
    h+='</div>';
  });
  h+='</div>';

  // Layer 2: Data values
  h+='<div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:5px 14px;background:#F9FAFB;border-bottom:1px solid #F3F4F6;border-top:1px solid #F3F4F6;color:#9CA3AF">Layer 2 \u2014 data values through chain</div>';
  h+='<div style="display:flex;border-bottom:1px solid #F3F4F6">';
  layer2.forEach((v,i)=>{
    const isLast=i===layer2.length-1;
    const lines=(v||'\u2014').split('\n');
    h+='<div style="flex:1;padding:8px 11px;min-width:0;border-right:'+(isLast?'none':'1px solid #F3F4F6')+'">';
    h+='<div style="font-size:11px;font-weight:600;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(lines[0]||'')+'</div>';
    if(lines[1])h+='<div style="font-size:9px;color:#9CA3AF;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+lines[1]+'</div>';
    h+='</div>';
    if(!isLast)h+='<div style="display:flex;align-items:center;padding:0 2px;font-size:10px;color:rgba(249,115,22,0.3);flex-shrink:0">\u2192</div>';
  });
  h+='</div>';

  // Layer 3: Stakeholder tags
  h+='<div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:5px 14px;background:#F9FAFB;border-bottom:1px solid #F3F4F6;border-top:1px solid #F3F4F6;color:#9CA3AF">Layer 3 \u2014 who acts on this chain</div>';
  h+='<div style="padding:9px 14px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #F3F4F6">';
  layer3.forEach(tag=>{
    const sc_=SC[tag.s]||SC.operator;
    h+='<span style="font-size:10px;font-weight:600;padding:4px 10px;border-radius:10px;border:1px solid '+sc_.border+';background:'+sc_.bg+';color:'+sc_.text+';white-space:nowrap">'+tag.s.charAt(0).toUpperCase()+tag.s.slice(1)+': '+tag.t+'</span>';
  });
  h+='</div>';

  // Insights row
  h+='<div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:5px 14px;background:#F9FAFB;border-bottom:1px solid #F3F4F6;border-top:1px solid #F3F4F6;color:#9CA3AF">Insights from this chain</div>';
  h+='<div style="padding:10px 14px;display:grid;grid-template-columns:repeat('+Math.min(insights.length,3)+',1fr);gap:10px;background:#FAFAF8">';
  insights.forEach(ins=>{
    h+='<div style="background:#fff;border:1px solid #E5E7EB;border-radius:7px;padding:10px 12px">';
    h+='<div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:4px">'+ins.title+'</div>';
    h+='<div style="font-size:10px;color:#6B7280;line-height:1.5;margin-bottom:6px">'+ins.body+'</div>';
    h+='<div style="font-size:16px;font-weight:700;color:'+(ins.colour||'#F97316')+'">'+ins.value+'</div>';
    h+='<div style="font-size:9px;color:#9CA3AF;margin-top:2px">'+ins.sub+'</div></div>';
  });
  h+='</div></div>';

  // Saving bar
  if(saving){
    h+='<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:9px 14px;font-size:12px;color:#15803D;font-weight:600;text-align:center;margin-top:12px">'+saving+'</div>';
  }

  // Demo row
  if(demo){
    h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;border:1px solid #E5E7EB;border-radius:8px;margin-top:8px">';
    h+='<div><div style="font-size:8px;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:3px">Live demo battery</div><div style="font-size:13px;font-weight:700;color:#F97316;font-family:\'DM Mono\',monospace">'+demo+'</div></div>';
    h+='<button onclick="window.open(\'/passport-next?battery='+demo+'\',\'_blank\')" style="background:#F97316;color:#fff;border:none;padding:6px 14px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer">Open in Passport \u2192</button></div>';
  }

  // Chain-specific extras
  if(cid===2){
    h+='<div style="display:flex;align-items:center;gap:6px;padding:10px 14px;background:#fff;border:1px solid #E5E7EB;border-radius:8px;margin-top:8px">';
    h+='<span style="font-size:10px;color:#6B7280;margin-right:4px">Signal agreement:</span>';
    for(let i=0;i<7;i++){const f=i<2;h+='<div style="width:24px;height:24px;border-radius:50%;background:'+(f?'#FFF7ED':'#F9FAFB')+';border:2px solid '+(f?'#F97316':'#E5E7EB')+';display:flex;align-items:center;justify-content:center;font-size:9px;color:'+(f?'#F97316':'#D1D5DB')+'">S'+(i+1)+'</div>';}
    h+='<span style="font-size:10px;color:#6B7280;margin-left:8px">2 of 7 agree. Threshold: 3+.</span></div>';
  }

  return h;
}

function getPlaceholderInsights(cid){
  const m=CHAIN_META[cid];
  return [{title:'What this chain detects',body:m.invisible,value:'Live soon',sub:'data wiring in progress',colour:'#9CA3AF'},{title:'Primary stakeholder',body:'Delivers intelligence directly to '+m.stakeholders[0]+' decisions.',value:m.stakeholders[0],sub:'primary audience',colour:'#F97316'},{title:'The invisible made visible',body:'Before enerlytik this signal was not observable from any single data source.',value:'Not visible before',sub:'without this platform',colour:'#0D9488'}];
}

// ── OPEN ENERLYST WITH CHAIN CONTEXT ──
function openEnerlyst(question){
  const activeEl=document.querySelector('.chain-item.active');
  const chainId=activeEl?activeEl.id.replace('chain-item-',''):null;
  const meta=chainId&&CHAIN_META[chainId]?CHAIN_META[chainId]:null;
  let q=question;
  if(meta){
    const demo=meta.demo&&meta.demo[0]?meta.demo[0]:null;
    q='[Context: Chain '+chainId+' \u2014 '+meta.label+']'
      +(demo?' [Battery: '+demo+']':'')
      +' '+question;
  }
  window.open('/enerlyst-next?q='+encodeURIComponent(q),'_blank');
}

// ── RENDER STAKEHOLDERS ──
function renderStakeholders(cid){
  const el=document.getElementById('stakeholder-cards');
  const cards=STAKEHOLDER_CARDS[cid]||CHAIN_META[cid].stakeholders.map(s=>({role:s.toUpperCase(),s:s,sees:CHAIN_META[cid].invisible,decides:'Intelligence applied.',saving:'Chain '+cid,link:s==='operator'?'/fleet-mis':s==='nbfc'||s==='lender'?'/nbfc':s==='oem'?'/oem':'/swap',linkLabel:'Open surface \u2192'}));
  let h='';
  cards.forEach(card=>{
    const sc_=SC[card.s]||SC.operator;
    h+='<div style="border-left:3px solid '+sc_.border+';background:'+sc_.bg+';border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:8px">';
    h+='<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:'+sc_.text+';margin-bottom:4px">'+card.role+'</div>';
    h+='<div style="font-size:11px;font-weight:600;color:#111827;margin-bottom:3px;line-height:1.4">'+card.decides+'</div>';
    h+='<div style="font-size:10px;color:#6B7280;line-height:1.5;margin-bottom:6px">'+card.sees+'</div>';
    h+='<a href="'+card.link+'" target="_blank" style="font-size:10px;font-weight:600;color:'+sc_.text+';text-decoration:none">'+card.linkLabel+'</a></div>';
  });
  // Enerlyst questions
  const qs=CHAIN_META[cid]?.questions||[];
  if(qs.length){
    h+='<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:10px 12px;margin-top:12px">';
    h+='<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#C2410C;margin-bottom:8px;font-family:\'DM Mono\',monospace">\u25C8 Ask enerlyst</div>';
    qs.forEach(q=>{h+='<div onclick="openEnerlyst(\''+q.replace(/'/g,"\\'")+'\')" style="background:#fff;border:1px solid #FED7AA;border-radius:8px;padding:5px 9px;font-size:10px;color:#C2410C;cursor:pointer;margin-bottom:5px;line-height:1.4;transition:all 0.12s" onmouseover="this.style.background=\'#F97316\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'#fff\';this.style.color=\'#C2410C\'">'+q+'</div>';});
    h+='</div>';
  }
  el.innerHTML=h;
}

// ── CHAIN SELECTOR ──
let openGroupId=null;
function renderChainSelector(){
  const el=document.getElementById('chain-selector');
  let h='';
  CHAIN_GROUPS.forEach((group,gi)=>{
    const isOpen=openGroupId===group.id||(openGroupId===null&&gi===0);
    h+='<div><div onclick="toggleGroup(\''+group.id+'\')" style="padding:8px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#9CA3AF;display:flex;justify-content:space-between;cursor:pointer;user-select:none;border-bottom:1px solid #F9FAFB">';
    h+=group.label+'<span style="background:#F3F4F6;color:#9CA3AF;padding:1px 6px;border-radius:8px;font-family:monospace;font-size:9px">'+group.chains.length+'</span></div>';
    h+='<div id="group-'+group.id+'" style="'+(isOpen?'':'display:none')+'">';
    group.chains.forEach(cid=>{
      const c=CHAIN_META[cid];if(!c)return;
      const isLive=PRIORITY.includes(cid);
      h+='<div id="chain-item-'+cid+'" class="chain-item" onclick="selectChain('+cid+')" style="padding:8px 14px 8px 16px;cursor:pointer">';
      h+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px"><span style="font-size:9px;font-family:monospace;font-weight:700;color:#F97316">C'+cid+'</span>'+(isLive?'<span style="width:5px;height:5px;border-radius:50%;background:#22C55E;flex-shrink:0"></span>':'')+'</div>';
      h+='<div class="ci-label" style="font-size:11px;font-weight:600;color:#374151">'+c.label+'</div>';
      h+='<div style="font-size:10px;color:#9CA3AF;line-height:1.35;margin-top:2px">'+c.invisible+'</div></div>';
    });
    h+='</div></div>';
  });
  el.innerHTML=h;
}
function toggleGroup(id){
  if(openGroupId===id){openGroupId=null;}else{openGroupId=id;}
  CHAIN_GROUPS.forEach(g=>{const el=document.getElementById('group-'+g.id);if(el)el.style.display=g.id===openGroupId?'':'none';});
}

// ── SELECT CHAIN ──
async function selectChain(cid){
  document.querySelectorAll('.chain-item').forEach(i=>{i.classList.remove('active');});
  const item=document.getElementById('chain-item-'+cid);
  if(item)item.classList.add('active');
  document.getElementById('chain-counter').textContent='Chain '+cid+' of 22 \u00B7 '+(CHAIN_META[cid]?.label||'');
  document.getElementById('chain-default').style.display='none';
  const flow=document.getElementById('chain-flow');
  flow.style.display='block';
  flow.innerHTML='<div style="color:#9CA3AF;font-size:13px;padding:40px;text-align:center">Loading chain data...</div>';
  document.getElementById('stakeholder-default').style.display='none';
  document.getElementById('stakeholder-cards').style.display='block';
  const meta=CHAIN_META[cid];
  const data=await loadChainData(cid);
  // Chain header
  let h='<div style="flex-shrink:0">';
  h+='<div style="font-size:9px;font-family:\'DM Mono\',monospace;color:#F97316;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px">Chain '+cid+' \u00B7 '+(CHAIN_GROUPS.find(g=>g.chains.includes(cid))?.label||'')+'</div>';
  const chainBadge=PRIORITY.includes(cid)?'<span style="background:#DCFCE7;color:#16A34A;font-size:8px;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:0.06em;margin-left:8px">LIVE</span>':'<span style="background:#F3F4F6;color:#6B7280;font-size:8px;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:0.06em;margin-left:8px">CONFIRMED</span>';
  h+='<div style="font-size:18px;font-weight:700;color:#111827;margin-bottom:6px;font-family:\'Outfit\',sans-serif">'+meta.label+chainBadge+'</div>';
  h+='<div style="font-size:12px;color:#6B7280;font-style:italic;margin-bottom:16px">The invisible: '+meta.invisible+'</div>';
  h+='</div>';
  h+=renderChainCard(cid,data);
  flow.innerHTML=h;
  renderStakeholders(cid);
}

// ── URL PARAMS ──
function handleParams(){
  const params=new URLSearchParams(window.location.search);
  const chainParam=params.get('chain');
  if(chainParam){
    const cid=parseInt(chainParam);
    const group=CHAIN_GROUPS.find(g=>g.chains.includes(cid));
    if(group){openGroupId=group.id;renderChainSelector();}
    selectChain(cid);
  }
}

// ── BOOT ──
renderChainSelector();
handleParams();
</script>
